
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Total Customer | ONE ONLINE</title>
<style>
:root{
  --bg:#f4f6fa;--panel:#fff;--panel2:#f8fafc;--text:#172033;
  --muted:#718096;--border:#e3e8ef;--primary:#087f5b;
  --primary2:#066b4d;--danger:#dc3545;--warning:#d97706;
  --success:#138a58;--shadow:0 5px 22px rgba(20,35,60,.07);
}
body[data-theme="dark"]{
  --bg:#101722;--panel:#182332;--panel2:#202d3d;--text:#edf3fa;
  --muted:#a5b2c2;--border:#304052;--primary:#20b889;
  --primary2:#159a70;--danger:#ff6675;--warning:#f5b84b;
  --success:#35c98b;--shadow:0 5px 22px rgba(0,0,0,.22);
}
body[data-theme="funny"]{
  --bg:#fff2fb;--panel:#fff;--panel2:#fff7fd;--text:#392044;
  --muted:#896b91;--border:#efd7f0;--primary:#a33bc1;
  --primary2:#8629a4;--danger:#e44d82;--warning:#d68a20;
  --success:#269b72;--shadow:0 5px 22px rgba(120,40,130,.09);
}
*{box-sizing:border-box}
body{
  margin:0;padding:22px;background:var(--bg);color:var(--text);
  font-family:Inter,Arial,sans-serif;transition:.2s;
}
.page{max-width:1600px;margin:auto}
.header{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;flex-wrap:wrap;margin-bottom:18px
}
.heading h2{margin:0;font-size:23px;font-weight:800}
.heading p{margin:6px 0 0;color:var(--muted);font-size:13px}
.header-right{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.total-pill{
  padding:10px 15px;border:1px solid var(--border);
  background:var(--panel);border-radius:10px;font-size:13px;
  font-weight:700
}
.total-pill strong{color:var(--primary);font-size:17px;margin-left:5px}
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--border);
  border-radius:13px;padding:14px;margin-bottom:15px;
  box-shadow:var(--shadow)
}
.search-wrap{display:flex;gap:8px;flex:1;min-width:220px}
input,select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);
  border-radius:8px;background:var(--panel);color:var(--text);
  outline:none;font:inherit;font-size:13px
}
input:focus,select:focus,textarea:focus{
  border-color:var(--primary);box-shadow:0 0 0 3px rgba(8,127,91,.10)
}
.search-wrap input{min-width:100px}
button{
  border:0;border-radius:8px;padding:10px 13px;
  font-size:12px;font-weight:700;cursor:pointer;
  transition:.15s;white-space:nowrap
}
button:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{background:var(--primary2)}
.btn-light{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:rgba(220,53,69,.12);color:var(--danger)}
.btn-success{background:rgba(19,138,88,.13);color:var(--success)}
.btn-warning{background:rgba(217,119,6,.13);color:var(--warning)}
.filter-select{width:auto;min-width:140px}
.table-box{
  background:var(--panel);border:1px solid var(--border);
  border-radius:13px;overflow:hidden;box-shadow:var(--shadow)
}
.table-top{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);
  flex-wrap:wrap
}
.table-top strong{font-size:14px}
.table-top span{font-size:12px;color:var(--muted)}
.table-scroll{width:100%;overflow-x:auto}
table{width:100%;min-width:1120px;border-collapse:collapse}
thead{background:var(--panel2)}
th{
  text-align:left;padding:14px 12px;font-size:11px;
  text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
  white-space:nowrap;border-bottom:1px solid var(--border)
}
td{
  padding:13px 12px;font-size:12px;border-bottom:1px solid var(--border);
  white-space:nowrap;vertical-align:middle
}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
.serial{font-weight:800;color:var(--muted)}
.customer-name{font-weight:750;color:var(--text)}
.customer-email{color:var(--muted)}
.bill{font-weight:800;color:var(--primary)}
.date{color:var(--muted)}
.actions{display:flex;gap:5px;align-items:center}
.action-btn{padding:7px 9px;font-size:11px}
.status{
  display:inline-block;padding:5px 8px;border-radius:20px;
  font-size:10px;font-weight:800
}
.status-active{background:rgba(19,138,88,.13);color:var(--success)}
.status-due{background:rgba(217,119,6,.13);color:var(--warning)}
.status-inactive{background:rgba(120,130,145,.15);color:var(--muted)}
.empty,.loading{
  padding:45px 15px;text-align:center;color:var(--muted);font-size:13px
}
.pagination{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;padding:13px 16px;border-top:1px solid var(--border);
  flex-wrap:wrap
}
.pagination-info{font-size:12px;color:var(--muted)}
.page-buttons{display:flex;gap:5px}
.page-buttons button{padding:7px 11px}
.page-buttons button.active{background:var(--primary);color:white}
.message{
  display:none;margin-bottom:13px;padding:11px 14px;border-radius:9px;
  font-size:13px;font-weight:650
}
.message.show{display:block}
.message.success{background:rgba(19,138,88,.13);color:var(--success)}
.message.error{background:rgba(220,53,69,.13);color:var(--danger)}
.modal-backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);
  z-index:1000;align-items:center;justify-content:center;padding:15px
}
.modal-backdrop.show{display:flex}
.modal{
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  background:var(--panel);color:var(--text);border:1px solid var(--border);
  border-radius:15px;box-shadow:0 20px 70px rgba(0,0,0,.3)
}
.modal-head{
  padding:17px 20px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center
}
.modal-head h3{margin:0;font-size:17px}
.close-btn{background:var(--panel2);color:var(--text);font-size:18px;padding:5px 10px}
.modal-body{padding:19px 20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field label{
  display:block;font-size:11px;font-weight:750;color:var(--muted);
  margin-bottom:6px
}
.field.full{grid-column:1/-1}
.modal-foot{
  display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;
  border-top:1px solid var(--border)
}
@media(max-width:650px){
  body{padding:12px}
  .heading h2{font-size:20px}
  .toolbar{padding:10px}
  .search-wrap{flex-basis:100%}
  .filter-select{flex:1}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .modal-backdrop{padding:8px}
}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="heading">
      <h2>👥 Total Customer</h2>
      <p>Manage all customers, billing and customer activities.</p>
    </div>
    <div class="header-right">
      <div class="total-pill">Total Customers <strong id="totalCount">0</strong></div>
      <button class="btn-primary" onclick="loadCustomers()">↻ Refresh</button>
    </div>
  </div>

  <div id="message" class="message"></div>

  <div class="toolbar">
    <div class="search-wrap">
      <input id="searchInput" type="search"
        placeholder="Search by name, IP, mobile or email..."
        onkeydown="if(event.key==='Enter') applyFilters()">
      <button class="btn-primary" onclick="applyFilters()">Search</button>
    </div>

    <select id="statusFilter" class="filter-select" onchange="applyFilters()">
      <option value="all">All Customers</option>
      <option value="active">Active</option>
      <option value="due">Due</option>
      <option value="inactive">Inactive</option>
    </select>

    <select id="pageSize" class="filter-select" onchange="changePageSize()">
      <option value="25">25 Per Page</option>
      <option value="50">50 Per Page</option>
      <option value="100">100 Per Page</option>
      <option value="all">Show All</option>
    </select>
  </div>

  <div class="table-box">
    <div class="table-top">
      <strong>Customer List</strong>
      <span id="resultCount">Loading customer records...</span>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Serial</th>
            <th>IP</th>
            <th>Name</th>
            <th>Mobile Number</th>
            <th>Email</th>
            <th>Bill</th>
            <th>Billing Date</th>
            <th>Creation Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="customerRows">
          <tr><td colspan="9" class="loading">Loading customers...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <div class="pagination-info" id="paginationInfo">Showing 0 customers</div>
      <div class="page-buttons" id="pageButtons"></div>
    </div>
  </div>
</div>

<!-- EDIT CUSTOMER MODAL -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Edit Customer</h3>
      <button class="close-btn" onclick="closeModal('editModal')">×</button>
    </div>
    <div class="modal-body">
      <form id="editForm">
        <input type="hidden" id="editId">
        <div class="form-grid">
          <div class="field">
            <label>Customer Name</label>
            <input id="editName" required>
          </div>
          <div class="field">
            <label>Mobile Number</label>
            <input id="editPhone">
          </div>
          <div class="field">
            <label>IP Address</label>
            <input id="editIP">
          </div>
          <div class="field">
            <label>Email</label>
            <input id="editEmail" type="email">
          </div>
          <div class="field">
            <label>Customer Bill</label>
            <input id="editBill" type="number" min="0">
          </div>
          <div class="field">
            <label>Billing Date</label>
            <input id="editBillingDate" type="date">
          </div>
          <div class="field">
            <label>Area</label>
            <input id="editArea">
          </div>
          <div class="field">
            <label>Status</label>
            <select id="editStatus">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="due">Due</option>
            </select>
          </div>
          <div class="field full">
            <label>Address</label>
            <textarea id="editAddress" rows="2"></textarea>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn-light" onclick="closeModal('editModal')">Cancel</button>
      <button class="btn-primary" id="saveEditBtn" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- ADD DUE MODAL -->
<div class="modal-backdrop" id="dueModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Add Customer Due</h3>
      <button class="close-btn" onclick="closeModal('dueModal')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="dueCustomerId">
      <div class="form-grid">
        <div class="field">
          <label>Customer Name</label>
          <input id="dueCustomerName" disabled>
        </div>
        <div class="field">
          <label>Due Amount</label>
          <input id="dueAmount" type="number" min="1" placeholder="Enter amount">
        </div>
        <div class="field full">
          <label>Due Reason</label>
          <textarea id="dueReason" rows="3" placeholder="Write due reason..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-light" onclick="closeModal('dueModal')">Cancel</button>
      <button class="btn-primary" id="saveDueBtn" onclick="saveDue()">Save Due</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ONE ONLINE - GOOGLE SHEETS CUSTOMER LIST
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxrhL_45Ey9QHICYzpNdsYRapqRZv36fzyEORs02MCnlAuju8yF-s5bDOfxY_l5qNrG/exec";

let allCustomers = [];
let filteredCustomers = [];
let currentPage = 1;
let pageSize = 25;
let busy = false;

/* ---------- THEME SYNC ---------- */
function applyTheme(){
  let theme = "light";
  try {
    theme = localStorage.getItem("one_online_theme") || "light";
  } catch(e){}
  if(!["light","dark","funny"].includes(theme)) theme = "light";
  document.body.setAttribute("data-theme",theme);
}
applyTheme();
window.addEventListener("storage",e=>{
  if(e.key==="one_online_theme") applyTheme();
});
window.addEventListener("focus",applyTheme);
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden) applyTheme();
});

/* ---------- HELPERS ---------- */
function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function number(value){
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}
function showMessage(message,type="success"){
  const box=document.getElementById("message");
  box.textContent=message;
  box.className="message show "+type;
  window.clearTimeout(showMessage.timer);
  showMessage.timer=window.setTimeout(()=>box.className="message",5000);
}
function getValue(obj,...keys){
  for(const key of keys){
    if(obj && obj[key] !== undefined && obj[key] !== null) return obj[key];
  }
  return "";
}
function customerId(c){
  return String(getValue(c,"id","customerId","customer_id","code","customerCode","si"));
}
function customerName(c){
  return getValue(c,"name","customerName","customer_name","Customer Name");
}
function customerStatus(c){
  const raw=String(getValue(c,"status","renewStatus","renew_status","renew")||"active").toLowerCase();
  if(raw.includes("inactive") || raw==="off" || raw==="false") return "inactive";
  if(raw.includes("due")) return "due";
  return "active";
}
function formatDate(value){
  if(!value) return "—";
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return esc(value);
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
function dateInput(value){
  if(!value) return "";
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return String(value).slice(0,10);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* ---------- API ---------- */
async function apiGet(action){
  const url=API_URL+"?action="+encodeURIComponent(action)+"&t="+Date.now();
  const response=await fetch(url,{method:"GET",redirect:"follow"});
  if(!response.ok) throw new Error("Server error: "+response.status);
  const result=await response.json();
  if(result.success===false || result.ok===false){
    throw new Error(result.message || result.error || "Request failed");
  }
  return result;
}
async function apiPost(action,data){
  const response=await fetch(API_URL,{
    method:"POST",
    redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action,data})
  });
  if(!response.ok) throw new Error("Server error: "+response.status);
  const result=await response.json();
  if(result.success===false || result.ok===false){
    throw new Error(result.message || result.error || "Request failed");
  }
  return result;
}

/* ---------- LOAD CUSTOMERS ---------- */
async function loadCustomers(){
  if(busy) return;
  busy=true;
  document.getElementById("customerRows").innerHTML=
    '<tr><td colspan="9" class="loading">Loading customers...</td></tr>';

  try{
    const result=await apiGet("getCustomers");
    let rows =
      Array.isArray(result) ? result :
      result.customers || result.data || result.records || [];

    if(!Array.isArray(rows)) rows=[];
    allCustomers=rows.filter(c=>!c.deletedAt && !c.deleted_at && !c.deleted);
    document.getElementById("totalCount").textContent=allCustomers.length;
    applyFilters();
  }catch(error){
    document.getElementById("customerRows").innerHTML=
      '<tr><td colspan="9" class="empty">Could not load customers. '+esc(error.message)+'</td></tr>';
    document.getElementById("resultCount").textContent="Loading failed";
    showMessage("Customer loading failed: "+error.message,"error");
  }finally{
    busy=false;
  }
}

/* ---------- SEARCH / FILTER ---------- */
function applyFilters(){
  const q=document.getElementById("searchInput").value.trim().toLowerCase();
  const status=document.getElementById("statusFilter").value;

  filteredCustomers=allCustomers.filter(c=>{
    const searchable=[
      customerName(c),
      getValue(c,"ip","IP"),
      getValue(c,"phone","mobile","mobileNumber","Mobile Number"),
      getValue(c,"email","customerEmail","Email"),
      getValue(c,"area","Area")
    ].join(" ").toLowerCase();

    const matchSearch=!q || searchable.includes(q);
    const matchStatus=status==="all" || customerStatus(c)===status;
    return matchSearch && matchStatus;
  });

  currentPage=1;
  renderTable();
}
function changePageSize(){
  const value=document.getElementById("pageSize").value;
  pageSize=value==="all" ? "all" : Number(value);
  currentPage=1;
  renderTable();
}

/* ---------- RENDER TABLE ---------- */
function renderTable(){
  const tbody=document.getElementById("customerRows");
  const total=filteredCustomers.length;
  const perPage=pageSize==="all" ? Math.max(total,1) : pageSize;
  const pages=Math.max(1,Math.ceil(total/perPage));
  if(currentPage>pages) currentPage=pages;

  const start=(currentPage-1)*perPage;
  const visible=filteredCustomers.slice(start,start+perPage);

  document.getElementById("resultCount").textContent=
    total+" matching customer(s)";

  if(!visible.length){
    tbody.innerHTML='<tr><td colspan="9" class="empty">No customer found.</td></tr>';
  }else{
    tbody.innerHTML=visible.map((c,index)=>{
      const id=customerId(c);
      const name=customerName(c);
      const ip=getValue(c,"ip","IP");
      const phone=getValue(c,"phone","mobile","mobileNumber","Mobile Number");
      const email=getValue(c,"email","customerEmail","Email");
      const bill=getValue(c,"customerBill","customer_bill","bill","Customer Bill");
      const billingDate=getValue(c,"billingDate","billing_date","Billing Date");
      const created=getValue(c,"createDate","createdAt","created_at","creationDate","Creation Date");
      const status=customerStatus(c);

      const badge=status==="active"
        ? '<span class="status status-active">ACTIVE</span>'
        : status==="due"
        ? '<span class="status status-due">DUE</span>'
        : '<span class="status status-inactive">INACTIVE</span>';

      return `<tr>
        <td class="serial">${start+index+1}</td>
        <td>${esc(ip||"—")}</td>
        <td><span class="customer-name">${esc(name||"Unnamed")}</span><br>${badge}</td>
        <td>${esc(phone||"—")}</td>
        <td class="customer-email">${esc(email||"—")}</td>
        <td class="bill">৳${number(bill).toLocaleString("en-BD")}</td>
        <td class="date">${formatDate(billingDate)}</td>
        <td class="date">${formatDate(created)}</td>
        <td>
          <div class="actions">
            <button class="btn-light action-btn" onclick="openEdit('${esc(id)}')">Edit</button>
            <button class="btn-success action-btn" onclick="collectCustomer('${esc(id)}')">Collect</button>
            <button class="btn-warning action-btn" onclick="renewCustomer('${esc(id)}')">Renew</button>
            <button class="btn-danger action-btn" onclick="deleteCustomer('${esc(id)}')">Delete</button>
            <button class="btn-primary action-btn" onclick="openDue('${esc(id)}')">Add Due</button>
          </div>
        </td>
      </tr>`;
    }).join("");
  }

  const first=total ? start+1 : 0;
  const last=Math.min(start+perPage,total);
  document.getElementById("paginationInfo").textContent=
    `Showing ${first}–${last} of ${total} customers`;

  renderPagination(pages);
}
function renderPagination(pages){
  const box=document.getElementById("pageButtons");
  if(pages<=1){box.innerHTML="";return;}
  let html=`<button class="btn-light" ${currentPage===1?"disabled":""}
    onclick="goPage(${currentPage-1})">‹</button>`;
  let from=Math.max(1,currentPage-2);
  let to=Math.min(pages,from+4);
  from=Math.max(1,to-4);
  for(let i=from;i<=to;i++){
    html+=`<button class="${i===currentPage?"active":"btn-light"}"
      onclick="goPage(${i})">${i}</button>`;
  }
  html+=`<button class="btn-light" ${currentPage===pages?"disabled":""}
    onclick="goPage(${currentPage+1})">›</button>`;
  box.innerHTML=html;
}
function goPage(page){
  currentPage=page;
  renderTable();
}

/* ---------- EDIT ---------- */
function findCustomer(id){
  return allCustomers.find(c=>customerId(c)===String(id));
}
function openEdit(id){
  const c=findCustomer(id);
  if(!c){showMessage("Customer not found.","error");return;}
  document.getElementById("editId").value=id;
  document.getElementById("editName").value=customerName(c)||"";
  document.getElementById("editPhone").value=getValue(c,"phone","mobile","mobileNumber")||"";
  document.getElementById("editIP").value=getValue(c,"ip","IP")||"";
  document.getElementById("editEmail").value=getValue(c,"email","customerEmail")||"";
  document.getElementById("editBill").value=getValue(c,"customerBill","customer_bill","bill")||0;
  document.getElementById("editBillingDate").value=dateInput(getValue(c,"billingDate","billing_date"));
  document.getElementById("editArea").value=getValue(c,"area","Area")||"";
  document.getElementById("editAddress").value=getValue(c,"address","Address")||"";
  document.getElementById("editStatus").value=customerStatus(c);
  openModal("editModal");
}
async function saveEdit(){
  const id=document.getElementById("editId").value;
  const data={
    id,
    name:document.getElementById("editName").value.trim(),
    phone:document.getElementById("editPhone").value.trim(),
    ip:document.getElementById("editIP").value.trim(),
    email:document.getElementById("editEmail").value.trim(),
    customerBill:number(document.getElementById("editBill").value),
    billingDate:document.getElementById("editBillingDate").value,
    area:document.getElementById("editArea").value.trim(),
    address:document.getElementById("editAddress").value.trim(),
    status:document.getElementById("editStatus").value
  };
  if(!data.name){showMessage("Customer name is required.","error");return;}
  await runAction("saveEditBtn","Saving...",async()=>{
    await apiPost("updateCustomer",data);
    closeModal("editModal");
    showMessage("Customer updated successfully.");
    await loadCustomers();
  });
}

/* ---------- COLLECT ---------- */
async function collectCustomer(id){
  const c=findCustomer(id);
  if(!c)return;
  const name=customerName(c)||"this customer";
  if(!confirm(`Collect payment from ${name}?\n\nBilling date will advance by one calendar month and the action will be recorded in Customer History.`))return;

  await runAction(null,null,async()=>{
    await apiPost("collectCustomer",{
      id,
      amount:number(getValue(c,"customerBill","customer_bill","bill")),
      oldBillingDate:getValue(c,"billingDate","billing_date")
    });
    showMessage("Payment collected. Billing date updated.");
    await loadCustomers();
  });
}

/* ---------- RENEW ---------- */
async function renewCustomer(id){
  const c=findCustomer(id);
  if(!c)return;
  if(!confirm(`Renew customer: ${customerName(c)}?`))return;

  await runAction(null,null,async()=>{
    await apiPost("renewCustomer",{id});
    showMessage("Customer renewed successfully.");
    await loadCustomers();
  });
}

/* ---------- DELETE ---------- */
async function deleteCustomer(id){
  const c=findCustomer(id);
  if(!c)return;
  if(!confirm(`Delete ${customerName(c)}?\n\nThe customer should be moved to Deleted Customer, not permanently erased.`))return;

  await runAction(null,null,async()=>{
    await apiPost("deleteCustomer",{id});
    showMessage("Customer moved to deleted records.");
    await loadCustomers();
  });
}

/* ---------- ADD DUE ---------- */
function openDue(id){
  const c=findCustomer(id);
  if(!c)return;
  document.getElementById("dueCustomerId").value=id;
  document.getElementById("dueCustomerName").value=customerName(c)||"";
  document.getElementById("dueAmount").value="";
  document.getElementById("dueReason").value="";
  openModal("dueModal");
}
async function saveDue(){
  const data={
    id:document.getElementById("dueCustomerId").value,
    amount:number(document.getElementById("dueAmount").value),
    reason:document.getElementById("dueReason").value.trim()
  };
  if(data.amount<=0){showMessage("Enter a valid due amount.","error");return;}
  await runAction("saveDueBtn","Saving...",async()=>{
    await apiPost("addDue",data);
    closeModal("dueModal");
    showMessage("Due entry saved successfully.");
    await loadCustomers();
  });
}

/* ---------- MODAL / ACTION HELPER ---------- */
function openModal(id){document.getElementById(id).classList.add("show");}
function closeModal(id){document.getElementById(id).classList.remove("show");}
document.querySelectorAll(".modal-backdrop").forEach(el=>{
  el.addEventListener("click",e=>{
    if(e.target===el)el.classList.remove("show");
  });
});
async function runAction(buttonId,loadingText,callback){
  const btn=buttonId?document.getElementById(buttonId):null;
  if(btn){btn.disabled=true;btn.textContent=loadingText;}
  try{
    await callback();
  }catch(error){
    showMessage(error.message || "Action failed.","error");
  }finally{
    if(btn){btn.disabled=false;btn.textContent=buttonId==="saveEditBtn"?"Save Changes":"Save Due";}
  }
}

/* ---------- START ---------- */
loadCustomers();
</script>
