
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">
  <title>ONE ONLINE | Management System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f0f5f3;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 35px 25px;
      background: white;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 35px #00000012;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #087f5b;
      color: white;
      font-size: 35px;
      font-weight: bold;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      margin-top: 22px;
      padding: 9px 16px;
      border-radius: 30px;
      background: #dcfce7;
      color: #166534;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">O</div>
    <h1>ONE ONLINE</h1>
    <p>Management System</p>
    <div class="status">Website Connected Successfully</div>
  </main>
</body>
</html>
