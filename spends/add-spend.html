<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spend Add | ONE ONLINE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --primary:#087f5b;
  --primary-dark:#066548;
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#748094;
  --border:#e5eaf0;
  --input:#ffffff;
  --shadow:0 8px 30px rgba(20,35,60,.07);
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:25px;
  transition:background .2s,color .2s;
}

.container{
  max-width:850px;
  margin:0 auto;
}

.page-header{
  margin-bottom:25px;
}

.page-header h1{
  font-size:25px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:12px;
}

.page-header h1 i{
  color:var(--primary);
}

.page-header p{
  color:var(--muted);
  font-size:13px;
  margin-top:8px;
  line-height:1.6;
}

.form-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:30px;
  box-shadow:var(--shadow);
  transition:background .2s,border-color .2s;
}

.form-title{
  display:flex;
  align-items:center;
  gap:12px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
  margin-bottom:25px;
}

.form-icon{
  width:45px;
  height:45px;
  flex-shrink:0;
  border-radius:12px;
  background:rgba(8,127,91,.11);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.form-title h2{
  font-size:17px;
  font-weight:800;
}

.form-title p{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.form-group{
  margin-bottom:22px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:9px;
  color:var(--text);
}

.required{
  color:#e03131;
}

.form-control{
  width:100%;
  height:48px;
  border:1px solid var(--border);
  border-radius:9px;
  padding:0 14px;
  font-family:inherit;
  font-size:14px;
  color:var(--text);
  background:var(--input);
  outline:none;
  transition:.2s;
}

textarea.form-control{
  height:115px;
  padding:13px 14px;
  resize:vertical;
  line-height:1.6;
}

.form-control:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(8,127,91,.10);
}

.form-control::placeholder{
  color:var(--muted);
  opacity:.8;
}

.amount-wrap{
  position:relative;
}

.amount-wrap .currency{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  font-size:14px;
  font-weight:700;
  color:var(--muted);
}

.amount-wrap input{
  padding-left:38px;
}

.form-footer{
  display:flex;
  justify-content:flex-end;
  gap:12px;
  border-top:1px solid var(--border);
  padding-top:22px;
  margin-top:10px;
}

.btn{
  height:46px;
  padding:0 22px;
  border:none;
  border-radius:9px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.btn-reset{
  background:var(--border);
  color:var(--text);
}

.btn-reset:hover{
  opacity:.8;
}

.btn-save{
  background:var(--primary);
  color:#fff;
  min-width:150px;
}

.btn-save:hover{
  background:var(--primary-dark);
  transform:translateY(-1px);
}

.btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

.message{
  display:none;
  padding:13px 15px;
  border-radius:9px;
  margin-bottom:20px;
  font-size:13px;
  line-height:1.5;
}

.message.success{
  display:block;
  background:#e8f7ef;
  color:#087443;
  border:1px solid #b7e5ca;
}

.message.error{
  display:block;
  background:#fff0f0;
  color:#c92a2a;
  border:1px solid #ffc9c9;
}

/* WHITE MODE */
body.white-mode,
body[data-theme="white"],
body[data-theme="light"]{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#748094;
  --border:#e5eaf0;
  --input:#ffffff;
  --primary:#087f5b;
  --primary-dark:#066548;
}

/* DARK MODE */
body.dark-mode,
body[data-theme="dark"]{
  --bg:#111827;
  --card:#1f2937;
  --text:#f3f4f6;
  --muted:#aab4c4;
  --border:#374151;
  --input:#111827;
  --primary:#10b981;
  --primary-dark:#059669;
  --shadow:0 8px 30px rgba(0,0,0,.18);
}

/* FUNNY MODE */
body.funny-mode,
body[data-theme="funny"]{
  --bg:#fff0fa;
  --card:#ffffff;
  --text:#382047;
  --muted:#8b6c98;
  --border:#f0d8f5;
  --input:#ffffff;
  --primary:#a855f7;
  --primary-dark:#9333ea;
  --shadow:0 8px 30px rgba(168,85,247,.08);
}

@media(max-width:600px){
  body{
    padding:15px;
  }

  .page-header h1{
    font-size:21px;
  }

  .form-card{
    padding:20px 16px;
  }

  .form-footer{
    flex-direction:column-reverse;
  }

  .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="page-header">
    <h1>
      <i class="fa-solid fa-wallet"></i>
      Add Spend
    </h1>
    <p>Add and manage your company expenses from one place.</p>
  </div>

  <div class="form-card">

    <div class="form-title">
      <div class="form-icon">
        <i class="fa-solid fa-file-invoice-dollar"></i>
      </div>
      <div>
        <h2>New Expense Entry</h2>
        <p>Enter the expense information below</p>
      </div>
    </div>

    <div id="messageBox" class="message" role="status"></div>

    <form id="spendForm">

      <div class="form-group">
        <label for="spendTitle">
          Add Title <span class="required">*</span>
        </label>
        <input
          type="text"
          id="spendTitle"
          class="form-control"
          placeholder="Enter expense title"
          required
          maxlength="150"
        >
      </div>

      <div class="form-group">
        <label for="spendAmount">
          Amount (৳) <span class="required">*</span>
        </label>

        <div class="amount-wrap">
          <span class="currency">৳</span>
          <input
            type="number"
            id="spendAmount"
            class="form-control"
            placeholder="Enter amount"
            min="0.01"
            step="0.01"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="spendDate">
          Expense Date <span class="required">*</span>
        </label>
        <input
          type="date"
          id="spendDate"
          class="form-control"
          required
        >
      </div>

      <div class="form-group">
        <label for="spendComment">Comment</label>
        <textarea
          id="spendComment"
          class="form-control"
          placeholder="Write expense details or comments..."
          maxlength="2000"
        ></textarea>
      </div>

      <div class="form-footer">

        <button type="reset" class="btn btn-reset" id="resetBtn">
          <i class="fa-solid fa-rotate-left"></i>
          Reset
        </button>

        <button type="submit" class="btn btn-save" id="saveBtn">
          <i class="fa-solid fa-floppy-disk"></i>
          Save Spend
        </button>

      </div>

    </form>

  </div>
</div>

<script>
/* ==================================
   INDEX THEME SUPPORT
================================== */

function applyTheme(theme){

  document.body.classList.remove(
    "dark-mode",
    "white-mode",
    "funny-mode"
  );

  const normalized = String(theme || "white").toLowerCase();

  if(normalized.includes("dark")){
    document.body.classList.add("dark-mode");
    document.body.dataset.theme = "dark";
  }
  else if(normalized.includes("funny")){
    document.body.classList.add("funny-mode");
    document.body.dataset.theme = "funny";
  }
  else{
    document.body.classList.add("white-mode");
    document.body.dataset.theme = "white";
  }
}

/* Initial theme fallback */
applyTheme("white");

/* Receive theme from Index */
window.addEventListener("message",function(event){

  const data = event.data;

  if(!data) return;

  if(typeof data === "string"){
    const value = data.toLowerCase();

    if(value.includes("theme")){
      applyTheme(value);
    }
    return;
  }

  const theme =
    data.theme ||
    data.currentTheme ||
    data.payload?.theme ||
    data.user?.theme;

  if(theme){
    applyTheme(theme);
  }

  if(data.type === "THEME_CHANGE" && data.theme){
    applyTheme(data.theme);
  }

});

/* ==================================
   SPEND FORM
================================== */

const form = document.getElementById("spendForm");
const saveBtn = document.getElementById("saveBtn");
const messageBox = document.getElementById("messageBox");
const dateInput = document.getElementById("spendDate");

function setTodayDate(){

  const now = new Date();

  const localDate = new Date(
    now.getTime() - now.getTimezoneOffset() * 60000
  ).toISOString().split("T")[0];

  dateInput.value = localDate;
}

setTodayDate();

function showMessage(message,type){

  messageBox.className = "message " + type;
  messageBox.textContent = message;
  messageBox.style.display = "block";

  messageBox.scrollIntoView({
    behavior:"smooth",
    block:"nearest"
  });
}

function hideMessage(){

  messageBox.className = "message";
  messageBox.style.display = "none";
}

document.getElementById("resetBtn").addEventListener("click",function(){

  setTimeout(function(){
    setTodayDate();
    hideMessage();
  },0);

});

/* ==================================
   SAVE SPEND
================================== */

form.addEventListener("submit",function(e){

  e.preventDefault();
  hideMessage();

  const payload = {

    title:document.getElementById("spendTitle").value.trim(),

    amount:Number(
      document.getElementById("spendAmount").value
    ),

    expenseDate:dateInput.value,

    comment:document.getElementById("spendComment").value.trim()

  };

  if(!payload.title){
    showMessage("Please enter expense title.","error");
    return;
  }

  if(!Number.isFinite(payload.amount) || payload.amount <= 0){
    showMessage("Please enter a valid amount.","error");
    return;
  }

  if(!payload.expenseDate){
    showMessage("Please select expense date.","error");
    return;
  }

  if(
    typeof google === "undefined" ||
    !google.script ||
    !google.script.run
  ){

    showMessage(
      "Backend connection is not available. Please connect the Spend Add API in Code.gs.",
      "error"
    );

    return;
  }

  saveBtn.disabled = true;

  saveBtn.innerHTML =
    '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

  google.script.run

    .withSuccessHandler(function(response){

      saveBtn.disabled = false;

      saveBtn.innerHTML =
        '<i class="fa-solid fa-floppy-disk"></i> Save Spend';

      if(response && response.success){

        showMessage(
          response.message || "Expense saved successfully!",
          "success"
        );

        form.reset();
        setTodayDate();

      }else{

        showMessage(
          response && response.message
            ? response.message
            : "Could not save expense. Please try again.",
          "error"
        );

      }

    })

    .withFailureHandler(function(error){

      saveBtn.disabled = false;

      saveBtn.innerHTML =
        '<i class="fa-solid fa-floppy-disk"></i> Save Spend';

      showMessage(
        error && error.message
          ? error.message
          : "Something went wrong while saving.",
        "error"
      );

    })

    .addSpend(payload);

});
</script>

</body>
</html>
