
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spend Add | ONE ONLINE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* =====================================
   ONE ONLINE INDEX THEME VARIABLES
===================================== */

:root{
  --bg:#f4f6fa;
  --surface:#ffffff;
  --surface2:#f8fafc;
  --text:#172033;
  --muted:#78869a;
  --border:#e5eaf1;
  --primary:#087f5b;
  --primary-soft:#e7f5ef;
  --danger:#dc3545;
  --shadow:0 8px 28px rgba(20,35,55,.07);
}

/* DARK THEME - SAME AS INDEX */
body[data-theme="dark"]{
  --bg:#0b1220;
  --surface:#111c2e;
  --surface2:#17243a;
  --text:#edf4ff;
  --muted:#91a2ba;
  --border:#26364d;
  --primary:#10b981;
  --primary-soft:#123b32;
  --danger:#f87171;
  --shadow:0 8px 28px rgba(0,0,0,.2);
}

/* LIGHT THEME */
body[data-theme="light"]{
  --bg:#f4f6fa;
  --surface:#ffffff;
  --surface2:#f8fafc;
  --text:#172033;
  --muted:#78869a;
  --border:#e5eaf1;
  --primary:#087f5b;
  --primary-soft:#e7f5ef;
  --danger:#dc3545;
}

/* FUNNY THEME - OPTIONAL */
body[data-theme="funny"]{
  --bg:#fff0fa;
  --surface:#ffffff;
  --surface2:#fff7fd;
  --text:#382047;
  --muted:#8b6c98;
  --border:#f0d8f5;
  --primary:#a855f7;
  --primary-soft:#f3e8ff;
  --danger:#e11d48;
  --shadow:0 8px 28px rgba(168,85,247,.08);
}

/* =====================================
   GENERAL
===================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  color-scheme:light;
}

body[data-theme="dark"]{
  color-scheme:dark;
}

body{
  font-family:'Inter',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:25px;
  font-size:14px;
  transition:background .2s,color .2s;
}

.container{
  width:100%;
  max-width:850px;
  margin:0 auto;
}

/* =====================================
   PAGE HEADER
===================================== */

.page-header{
  margin-bottom:25px;
}

.page-header h1{
  font-size:25px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--text);
}

.page-header h1 i{
  color:var(--primary);
}

.page-header p{
  color:var(--muted);
  font-size:13px;
  margin-top:8px;
  line-height:1.6;
}

/* =====================================
   FORM CARD
===================================== */

.form-card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:30px;
  box-shadow:var(--shadow);
  transition:background .2s,border-color .2s;
}

.form-title{
  display:flex;
  align-items:center;
  gap:12px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
  margin-bottom:25px;
}

.form-icon{
  width:45px;
  height:45px;
  min-width:45px;
  border-radius:12px;
  background:var(--primary-soft);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.form-title h2{
  font-size:17px;
  font-weight:800;
  color:var(--text);
}

.form-title p{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

/* =====================================
   INPUT FIELDS
===================================== */

.form-group{
  margin-bottom:22px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:9px;
  color:var(--text);
}

.required{
  color:var(--danger);
}

.form-control{
  width:100%;
  height:48px;
  border:1px solid var(--border);
  border-radius:9px;
  padding:0 14px;
  font-family:inherit;
  font-size:14px;
  color:var(--text);
  background:var(--surface2);
  outline:none;
  transition:.2s;
}

.form-control:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(8,127,91,.10);
}

.form-control::placeholder{
  color:var(--muted);
  opacity:.8;
}

textarea.form-control{
  height:115px;
  padding:13px 14px;
  resize:vertical;
  line-height:1.6;
}

.amount-wrap{
  position:relative;
}

.amount-wrap .currency{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  font-size:14px;
  font-weight:700;
  color:var(--muted);
}

.amount-wrap input{
  padding-left:38px;
}

/* =====================================
   BUTTONS
===================================== */

.form-footer{
  display:flex;
  justify-content:flex-end;
  gap:12px;
  border-top:1px solid var(--border);
  padding-top:22px;
  margin-top:10px;
}

.btn{
  height:46px;
  padding:0 22px;
  border:none;
  border-radius:9px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.btn-reset{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
}

.btn-reset:hover{
  opacity:.8;
}

.btn-save{
  background:var(--primary);
  color:#ffffff;
  min-width:150px;
}

.btn-save:hover{
  opacity:.9;
  transform:translateY(-1px);
}

.btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

/* =====================================
   MESSAGE
===================================== */

.message{
  display:none;
  padding:13px 15px;
  border-radius:9px;
  margin-bottom:20px;
  font-size:13px;
  line-height:1.5;
}

.message.success{
  display:block;
  background:#e8f7ef;
  color:#087443;
  border:1px solid #b7e5ca;
}

.message.error{
  display:block;
  background:#fff0f0;
  color:#c92a2a;
  border:1px solid #ffc9c9;
}

/* =====================================
   MOBILE RESPONSIVE
===================================== */

@media(max-width:600px){

  body{
    padding:15px;
  }

  .page-header h1{
    font-size:21px;
  }

  .form-card{
    padding:20px 16px;
  }

  .form-footer{
    flex-direction:column-reverse;
  }

  .btn{
    width:100%;
  }

}
</style>
</head>

<body data-theme="light">

<div class="container">

  <!-- PAGE HEADER -->
  <div class="page-header">

    <h1>
      <i class="fa-solid fa-wallet"></i>
      Add Spend
    </h1>

    <p>
      Add and manage your company expenses from one place.
    </p>

  </div>

  <!-- FORM CARD -->
  <div class="form-card">

    <div class="form-title">

      <div class="form-icon">
        <i class="fa-solid fa-file-invoice-dollar"></i>
      </div>

      <div>
        <h2>New Expense Entry</h2>
        <p>Enter the expense information below</p>
      </div>

    </div>

    <!-- MESSAGE -->
    <div
      id="messageBox"
      class="message"
      role="status"
      aria-live="polite">
    </div>

    <!-- SPEND FORM -->
    <form id="spendForm">

      <!-- TITLE -->
      <div class="form-group">

        <label for="spendTitle">
          Add Title <span class="required">*</span>
        </label>

        <input
          type="text"
          id="spendTitle"
          class="form-control"
          placeholder="Enter expense title"
          required
          maxlength="150"
        >

      </div>

      <!-- AMOUNT -->
      <div class="form-group">

        <label for="spendAmount">
          Amount (৳) <span class="required">*</span>
        </label>

        <div class="amount-wrap">

          <span class="currency">৳</span>

          <input
            type="number"
            id="spendAmount"
            class="form-control"
            placeholder="Enter amount"
            min="0.01"
            step="0.01"
            required
          >

        </div>

      </div>

      <!-- EXPENSE DATE -->
      <div class="form-group">

        <label for="spendDate">
          Expense Date <span class="required">*</span>
        </label>

        <input
          type="date"
          id="spendDate"
          class="form-control"
          required
        >

      </div>

      <!-- COMMENT -->
      <div class="form-group">

        <label for="spendComment">
          Comment
        </label>

        <textarea
          id="spendComment"
          class="form-control"
          placeholder="Write expense details or comments..."
          maxlength="2000"
        ></textarea>

      </div>

      <!-- FOOTER BUTTONS -->
      <div class="form-footer">

        <button
          type="reset"
          class="btn btn-reset"
          id="resetBtn">

          <i class="fa-solid fa-rotate-left"></i>
          Reset

        </button>

        <button
          type="submit"
          class="btn btn-save"
          id="saveBtn">

          <i class="fa-solid fa-floppy-disk"></i>
          Save Spend

        </button>

      </div>

    </form>

  </div>

</div>

<script>

/* ==========================================
   ONE ONLINE INDEX THEME INTEGRATION
   Actual Index:
   localStorage key = one_online_theme
   body[data-theme] = light / dark
   iframe = pageFrame
========================================== */

(function(){

  "use strict";

  const THEME_KEY = "one_online_theme";

  function normalizeTheme(theme){

    theme = String(theme || "light").toLowerCase();

    if(theme === "dark") return "dark";
    if(theme === "funny") return "funny";

    return "light";

  }

  function applyTheme(theme){

    theme = normalizeTheme(theme);

    document.body.setAttribute("data-theme",theme);

  }

  /* Read theme directly from Parent Index */
  function readParentTheme(){

    try{

      if(
        window.parent &&
        window.parent !== window &&
        window.parent.document &&
        window.parent.document.body
      ){

        const parentTheme =
          window.parent.document.body.getAttribute("data-theme");

        if(parentTheme){
          return parentTheme;
        }

      }

    }catch(error){

      // Parent access unavailable: use saved theme.

    }

    try{

      return localStorage.getItem(THEME_KEY) || "light";

    }catch(error){

      return "light";

    }

  }

  /* Apply current Index theme */
  function syncTheme(){

    applyTheme(readParentTheme());

  }

  /* Initial theme */
  syncTheme();

  /* Listen for localStorage changes from Index */
  window.addEventListener("storage",function(event){

    if(event.key === THEME_KEY){

      applyTheme(event.newValue || "light");

    }

  });

  /* Observe Index body theme changes directly */
  try{

    if(
      window.parent &&
      window.parent !== window &&
      window.parent.document &&
      window.parent.document.body
    ){

      const parentBody = window.parent.document.body;

      const observer = new MutationObserver(function(){

        const theme =
          parentBody.getAttribute("data-theme") || "light";

        applyTheme(theme);

      });

      observer.observe(parentBody,{

        attributes:true,
        attributeFilter:["data-theme"]

      });

    }

  }catch(error){

    // Storage and focus listeners remain available.

  }

  /* Refresh when iframe becomes active */
  window.addEventListener("focus",syncTheme);

  document.addEventListener("visibilitychange",function(){

    if(!document.hidden){

      syncTheme();

    }

  });

  /* Refresh when returning to the page */
  window.addEventListener("pageshow",syncTheme);

})();


/* ==========================================
   SPEND FORM SYSTEM
========================================== */

const form = document.getElementById("spendForm");

const saveBtn = document.getElementById("saveBtn");

const messageBox = document.getElementById("messageBox");

const dateInput = document.getElementById("spendDate");


/* TODAY'S DATE */
function setTodayDate(){

  const now = new Date();

  const localDate = new Date(

    now.getTime() - now.getTimezoneOffset() * 60000

  ).toISOString().split("T")[0];

  dateInput.value = localDate;

}

setTodayDate();


/* SHOW MESSAGE */
function showMessage(message,type){

  messageBox.className = "message " + type;

  messageBox.textContent = message;

  messageBox.style.display = "block";

  messageBox.scrollIntoView({

    behavior:"smooth",
    block:"nearest"

  });

}


/* HIDE MESSAGE */
function hideMessage(){

  messageBox.className = "message";

  messageBox.textContent = "";

  messageBox.style.display = "none";

}


/* RESET FORM */
document.getElementById("resetBtn").addEventListener("click",function(){

  setTimeout(function(){

    setTodayDate();

    hideMessage();

  },0);

});


/* ==========================================
   SAVE SPEND
========================================== */

form.addEventListener("submit",function(e){

  e.preventDefault();

  hideMessage();

  const payload = {

    title:document.getElementById("spendTitle").value.trim(),

    amount:Number(
      document.getElementById("spendAmount").value
    ),

    expenseDate:dateInput.value,

    comment:document.getElementById("spendComment").value.trim()

  };


  /* VALIDATION */

  if(!payload.title){

    showMessage(
      "Please enter expense title.",
      "error"
    );

    return;

  }


  if(
    !Number.isFinite(payload.amount) ||
    payload.amount <= 0
  ){

    showMessage(
      "Please enter a valid amount.",
      "error"
    );

    return;

  }


  if(!payload.expenseDate){

    showMessage(
      "Please select expense date.",
      "error"
    );

    return;

  }


  /* CHECK GOOGLE APPS SCRIPT */

  if(
    typeof google === "undefined" ||
    !google.script ||
    !google.script.run
  ){

    showMessage(
      "Backend connection is not available. Please connect the Spend Add API in Code.gs.",
      "error"
    );

    return;

  }


  /* LOADING */

  saveBtn.disabled = true;

  saveBtn.innerHTML =
    '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';


  /* SEND DATA TO BACKEND */

  google.script.run

    .withSuccessHandler(function(response){

      saveBtn.disabled = false;

      saveBtn.innerHTML =
        '<i class="fa-solid fa-floppy-disk"></i> Save Spend';


      if(response && response.success){

        showMessage(

          response.message || "Expense saved successfully!",

          "success"

        );

        form.reset();

        setTodayDate();

      }else{

        showMessage(

          response && response.message
            ? response.message
            : "Could not save expense. Please try again.",

          "error"

        );

      }

    })

    .withFailureHandler(function(error){

      saveBtn.disabled = false;

      saveBtn.innerHTML =
        '<i class="fa-solid fa-floppy-disk"></i> Save Spend';

      showMessage(

        error && error.message
          ? error.message
          : "Something went wrong while saving.",

        "error"

      );

    })

    .addSpend(payload);

});

</script>

</body>
</html>
