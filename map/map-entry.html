<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Map | ONE ONLINE</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#0b1220;
  --panel:#111c2e;
  --panel2:#172338;
  --text:#e8f0fc;
  --muted:#8fa2bd;
  --line:#26364d;
  --primary:#1685ff;
  --green:#16a36a;
  --red:#ef4444;
}
body{
  margin:0;
  padding:22px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
.container{max-width:850px;margin:auto}
.header{margin-bottom:22px}
.header h2{margin:0 0 7px;font-size:23px}
.header p{margin:0;color:var(--muted);font-size:13px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  padding:20px;
  margin-bottom:16px;
}
.card h3{margin:0 0 17px;font-size:16px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.field{margin-bottom:14px}
.field label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:7px;
}
input,select{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:8px;
  outline:none;
  font-size:14px;
}
input:focus,select:focus{border-color:var(--primary)}
.full{grid-column:1/-1}
.help{font-size:11px;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:10px;margin-top:8px}
button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:700;
  font-size:13px;
}
.save{background:var(--primary);color:white;flex:1}
.reset{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.status{font-size:13px;margin-top:13px;min-height:18px}
.success{color:#22c55e}
.error{color:#f87171}
.hidden{display:none!important}
.note{
  background:var(--panel2);
  padding:11px;
  border-radius:8px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}
@media(max-width:600px){
  body{padding:13px}
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .card{padding:15px}
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h2>🗺️ Add Map Location</h2>
    <p>Add Customer, Pull, Switch and connect locations.</p>
  </div>

  <!-- LOCATION FORM -->
  <div class="card">
    <h3>📍 Location Information</h3>

    <div class="grid">

      <div class="field">
        <label>Location Type *</label>
        <select id="type" onchange="typeChanged()">
          <option value="Customer">Customer</option>
          <option value="Pull">Pull</option>
          <option value="Switch">Switch</option>
          <option value="Main Box">Main Box</option>
        </select>
      </div>

      <div class="field">
        <label>Name *</label>
        <input id="name" placeholder="Enter name">
      </div>

      <div class="field">
        <label>IP Address</label>
        <input id="ip" placeholder="Example: 192.168.1.1">
      </div>

      <div class="field" id="codeField">
        <label>Customer Code *</label>
        <input id="code" placeholder="Example: C-001">
      </div>

      <div class="field full">
        <label>Google Maps Location URL *</label>
        <input id="mapUrl" placeholder="Paste Google Maps URL here">
        <div class="help">Google Maps থেকে location link copy করে এখানে paste করুন।</div>
      </div>

    </div>
  </div>

  <!-- CONNECTION FORM -->
  <div class="card">
    <h3>🔗 From → To Connection</h3>

    <div class="grid">

      <div class="field">
        <label>From</label>
        <select id="from">
          <option value="">Select From</option>
        </select>
      </div>

      <div class="field">
        <label>To</label>
        <select id="to">
          <option value="">Select To</option>
          <option value="__NEW__">New Location (This Form)</option>
        </select>
      </div>

    </div>

    <div class="note">
      From হলো যেখান থেকে সংযোগ আসবে। To হলো যেখানে সংযোগ যাবে।
      Connection না করতে চাইলে দুটোই খালি রাখুন।
    </div>
  </div>

  <!-- SAVE -->
  <div class="card">
    <div class="actions">
      <button class="save" id="saveBtn" onclick="saveLocation()">SAVE LOCATION</button>
      <button class="reset" onclick="resetForm()">RESET</button>
    </div>
    <div id="status" class="status"></div>
  </div>

</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbxmDzfnY3LpvfvHjC4usnZiBT4BX4KZIjVoCGcSULikoTKQaC_mj7cbG_zUaiTyZ4sb8w/exec";

const CACHE_KEY = "ONE_ONLINE_MAP_DATA_V1";

let mapData = {
  locations:[],
  connections:[],
  settings:{},
  customTypes:[]
};

let loading = false;

// --------------------------------
// LOAD EXISTING MAP DATA
// --------------------------------
async function loadMapData(){
  setStatus("Loading map data...");

  try{
    const response = await fetch(API_URL + "?action=getMapData");
    const result = await response.json();

    const data = result.data || result;

    mapData.locations = Array.isArray(data.locations) ? data.locations : [];
    mapData.connections = Array.isArray(data.connections) ? data.connections : [];
    mapData.settings = data.settings || {};
    mapData.customTypes = data.customTypes || [];

    localStorage.setItem(CACHE_KEY, JSON.stringify(mapData));

    populateConnections();
    setStatus("Map data loaded.", true);

  }catch(error){
    console.error(error);

    // Use previously saved cache if available
    try{
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}");

      mapData.locations = cached.locations || [];
      mapData.connections = cached.connections || [];
      mapData.settings = cached.settings || {};
      mapData.customTypes = cached.customTypes || [];

      populateConnections();
      setStatus("Loaded saved local data. Please check your connection.", false);

    }catch(e){
      setStatus("Could not load map data.", false);
    }
  }
}

// --------------------------------
// FROM / TO DROPDOWNS
// --------------------------------
function locationLabel(item){
  const type = item.type || item.Type || "";
  const name = item.name || item.Name || "";
  const code = item.code || item.Code || "";

  return [
    type,
    name,
    code ? "(" + code + ")" : ""
  ].filter(Boolean).join(" - ");
}

function getLocationId(item){
  return String(item.id || item.ID || "");
}

function populateConnections(){
  const from = document.getElementById("from");
  const to = document.getElementById("to");

  from.innerHTML = '<option value="">Select From</option>';
  to.innerHTML =
    '<option value="">Select To</option>' +
    '<option value="__NEW__">New Location (This Form)</option>';

  mapData.locations.forEach(item=>{
    const id = getLocationId(item);
    if(!id) return;

    const label = locationLabel(item);

    const a = document.createElement("option");
    a.value = id;
    a.textContent = label;
    from.appendChild(a);

    const b = document.createElement("option");
    b.value = id;
    b.textContent = label;
    to.appendChild(b);
  });
}

// --------------------------------
// TYPE CHANGE
// --------------------------------
function typeChanged(){
  const type = document.getElementById("type").value;
  const codeField = document.getElementById("codeField");

  // Customer uses Code.
  // Pull / Switch / Main Box use Name.
  codeField.classList.toggle("hidden", type !== "Customer");

  if(type !== "Customer"){
    document.getElementById("code").value = "";
  }
}

// --------------------------------
// GOOGLE MAPS URL COORDINATES
// --------------------------------
function getCoordinates(url){
  if(!url) return null;

  let patterns = [
    /@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/,
    /[?&]q=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/,
    /[?&]ll=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/,
    /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/
  ];

  for(const pattern of patterns){
    const match = url.match(pattern);

    if(match){
      const lat = Number(match[1]);
      const lng = Number(match[2]);

      if(
        Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        lat >= -90 && lat <= 90 &&
        lng >= -180 && lng <= 180
      ){
        return {lat,lng};
      }
    }
  }

  return null;
}

// --------------------------------
// SAVE DATA
// --------------------------------
async function saveLocation(){
  if(loading) return;

  const type = document.getElementById("type").value;
  const name = document.getElementById("name").value.trim();
  const ip = document.getElementById("ip").value.trim();
  const code = document.getElementById("code").value.trim();
  const mapUrl = document.getElementById("mapUrl").value.trim();

  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;

  if(!name){
    setStatus("Please enter a name.", false);
    return;
  }

  if(type === "Customer" && !code){
    setStatus("Please enter Customer Code.", false);
    return;
  }

  if(!mapUrl){
    setStatus("Please paste Google Maps URL.", false);
    return;
  }

  const coords = getCoordinates(mapUrl);

  if(!coords){
    setStatus("Could not read coordinates from this URL. Use a Google Maps URL containing coordinates.", false);
    return;
  }

  if((from && !to) || (!from && to)){
    setStatus("Please select both From and To, or leave both empty.", false);
    return;
  }

  if(from && to === "__NEW__" && !from){
    setStatus("Please select a From location.", false);
    return;
  }

  const newId = "MAP-" + Date.now();

  const now = new Date().toISOString();

  const newLocation = {
    id:newId,
    type:type,
    name:name,
    ip:ip,
    code:type === "Customer" ? code : "",
    latitude:coords.lat,
    longitude:coords.lng,
    icon:"",
    color:"",
    notes:"",
    createdAt:now,
    updatedAt:now,
    data:{
      mapUrl:mapUrl,
      code:type === "Customer" ? code : ""
    }
  };

  // Keep all existing records.
  const locations = [...mapData.locations, newLocation];
  const connections = [...mapData.connections];

  // Add connection only when From and To are selected.
  if(from && to){
    const targetId = to === "__NEW__" ? newId : to;

    if(from === targetId){
      setStatus("From and To cannot be the same location.", false);
      return;
    }

    connections.push({
      id:"CON-" + Date.now(),
      from:from,
      to:targetId,
      type:"Fiber",
      name:"",
      createdAt:now
    });
  }

  const payload = {
    action:"saveMapData",
    locations:locations,
    connections:connections,
    settings:mapData.settings,
    customTypes:mapData.customTypes
  };

  loading = true;
  document.getElementById("saveBtn").disabled = true;
  document.getElementById("saveBtn").textContent = "SAVING...";

  setStatus("Saving location...");

  try{
    const response = await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify(payload)
    });

    const result = await response.json();

    if(result.success === false || result.status === "error"){
      throw new Error(result.message || "Save failed.");
    }

    // Update local data only after successful response.
    mapData.locations = locations;
    mapData.connections = connections;

    localStorage.setItem(CACHE_KEY, JSON.stringify(mapData));

    setStatus("Location saved successfully!", true);

    resetForm(false);
    populateConnections();

  }catch(error){
    console.error(error);
    setStatus("Save failed: " + error.message, false);

  }finally{
    loading = false;
    document.getElementById("saveBtn").disabled = false;
    document.getElementById("saveBtn").textContent = "SAVE LOCATION";
  }
}

// --------------------------------
// RESET
// --------------------------------
function resetForm(clearStatus=true){
  document.getElementById("type").value = "Customer";
  document.getElementById("name").value = "";
  document.getElementById("ip").value = "";
  document.getElementById("code").value = "";
  document.getElementById("mapUrl").value = "";
  document.getElementById("from").value = "";
  document.getElementById("to").value = "";

  typeChanged();

  if(clearStatus) setStatus("");
}

// --------------------------------
// STATUS
// --------------------------------
function setStatus(message,success=null){
  const el = document.getElementById("status");
  el.textContent = message;
  el.className = "status";

  if(success === true) el.classList.add("success");
  if(success === false) el.classList.add("error");
}

// INITIALIZE
typeChanged();
loadMapData();

</script>
</body>
</html>
