
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE ONLINE | Network Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1220;
  --panel:#111c2e;
  --panel2:#17253a;
  --line:#293a52;
  --text:#edf4ff;
  --muted:#91a3bc;
  --primary:#1685f8;
  --green:#16a36a;
  --red:#e34c5b;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{
  width:100%;height:100%;
  display:flex;flex-direction:column;
}
.topbar{
  min-height:65px;background:#101b2c;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 16px;z-index:1000;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#087fdb,#16a36a);
  font-size:21px;font-weight:800;flex-shrink:0;
}
.brand h2{font-size:15px;margin:0;white-space:nowrap}
.brand small{display:block;font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:1px}
.top-actions{display:flex;align-items:center;gap:7px}
.btn{
  border:1px solid var(--line);background:var(--panel2);
  color:var(--text);border-radius:9px;padding:9px 12px;
  font-size:12px;font-weight:700;
}
.btn:hover{filter:brightness(1.16)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:white}
.btn.icon{font-size:16px;padding:8px 11px}
.app-body{display:flex;flex:1;min-height:0}
.sidebar{
  width:330px;max-width:90vw;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:800;
  transition:width .2s,margin .2s;
}
.sidebar.closed{width:0;overflow:hidden;border:0}
.side-head{padding:15px;border-bottom:1px solid var(--line)}
.side-head h3{font-size:14px;margin:0 0 12px}
.search-wrap{position:relative}
.search-wrap input{
  width:100%;padding:11px 12px 11px 35px;
  background:#0b1727;color:white;border:1px solid #34465f;
  border-radius:9px;outline:none;
}
.search-wrap span{position:absolute;left:12px;top:10px;color:var(--muted)}
.side-content{padding:13px;overflow:auto;flex:1}
.section-title{
  font-size:10px;font-weight:800;color:#8195af;
  letter-spacing:1px;margin:8px 0 10px;
}
.filter-list{display:grid;gap:7px}
.filter-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 10px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel2);
}
.filter-item input{accent-color:var(--primary)}
.filter-item label{flex:1;font-size:12px;cursor:pointer}
.filter-item small{color:var(--muted);font-size:10px}
.result-list{display:grid;gap:7px}
.result-item{
  padding:10px;border:1px solid var(--line);
  border-radius:9px;background:#142238;cursor:pointer;
}
.result-item:hover{border-color:var(--primary);background:#19304b}
.result-item strong{display:block;font-size:12px}
.result-item small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.map-area{flex:1;min-width:0;position:relative;background:#dce5ea}
#map{width:100%;height:100%;background:#dce5ea}
.map-top-controls{
  position:absolute;top:12px;left:12px;right:12px;
  z-index:600;display:flex;justify-content:space-between;
  align-items:flex-start;gap:8px;pointer-events:none;
}
.map-top-controls>*{pointer-events:auto}
.map-control-group{
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;
}
.map-control{
  background:#101d30ed;color:white;
  border:1px solid #ffffff30;border-radius:9px;
  padding:9px 11px;font-size:11px;font-weight:700;
  box-shadow:0 3px 12px #0003;
}
.map-control select{
  background:transparent;color:white;border:0;outline:0;
  font-weight:700;max-width:120px;
}
.map-control option{background:#101d30;color:white}
.zoom-control{
  position:absolute;right:13px;top:80px;z-index:600;
  display:grid;gap:5px;
}
.zoom-control button{
  width:38px;height:38px;background:#101d30ed;
  color:white;border:1px solid #ffffff30;
  border-radius:9px;font-size:20px;font-weight:700;
  box-shadow:0 3px 12px #0003;
}
.map-status{
  position:absolute;bottom:14px;left:14px;z-index:600;
  background:#101d30e8;color:white;padding:8px 11px;
  border-radius:8px;font-size:10px;
  box-shadow:0 3px 12px #0003;
  max-width:calc(100% - 80px);
}
.legend{
  position:absolute;bottom:14px;right:14px;z-index:600;
  background:#101d30e8;color:white;padding:11px 12px;
  border-radius:10px;font-size:10px;
  box-shadow:0 3px 12px #0003;max-width:170px;
}
.legend-title{font-weight:800;margin-bottom:7px}
.legend-item{display:flex;align-items:center;gap:7px;margin-top:5px}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.marker-icon{
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:2px solid white;
  box-shadow:0 3px 10px #0009;
  font-size:19px;line-height:1;
}
.marker-label{
  background:#101d30ed;color:white;border:1px solid #ffffff40;
  border-radius:5px;padding:3px 6px;font-size:10px;font-weight:700;
  box-shadow:0 2px 7px #0005;
}
.leaflet-tooltip.marker-label:before{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{
  background:#101d30;color:#eef5ff;
}
.leaflet-popup-content{
  margin:14px;min-width:220px;max-width:310px;
  max-height:55vh;overflow:auto;
}
.popup-title{font-size:16px;font-weight:800;margin-bottom:5px}
.popup-subtitle{font-size:11px;color:#83c3ff;margin-bottom:12px;font-weight:700}
.popup-table{width:100%;border-collapse:collapse;font-size:11px}
.popup-table td{
  padding:6px 3px;border-bottom:1px solid #293b52;
  vertical-align:top;overflow-wrap:anywhere;
}
.popup-table td:first-child{color:#91a8c3;width:40%}
.popup-actions{display:flex;gap:6px;margin-top:12px}
.popup-actions button{
  flex:1;border:0;background:#1765a7;color:white;
  border-radius:7px;padding:8px;font-size:11px;font-weight:700;
}
.empty{font-size:11px;color:var(--muted);padding:12px 4px;line-height:1.6}
#toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  z-index:5000;background:#172a40;border:1px solid #3b5877;
  color:white;border-radius:10px;padding:11px 16px;
  display:none;box-shadow:0 8px 30px #0008;
  font-size:12px;max-width:90%;text-align:center;
}
#toast.show{display:block}
.mobile-close{display:none}
@media(max-width:760px){
  .topbar{min-height:57px;padding:8px 10px}
  .logo{width:35px;height:35px}
  .brand h2{font-size:12px}
  .brand small{font-size:8px}
  .top-actions .btn{padding:8px;font-size:10px}
  .sidebar{
    position:absolute;top:57px;bottom:0;left:0;
    width:min(330px,88vw);max-width:88vw;
    box-shadow:8px 0 25px #0005;
  }
  .sidebar.closed{width:0}
  .map-top-controls{top:9px;left:9px;right:9px}
  .map-control{padding:8px;font-size:10px}
  .zoom-control{top:65px;right:9px}
  .zoom-control button{width:35px;height:35px}
  .legend{bottom:12px;right:9px;max-width:140px;padding:9px}
  .map-status{bottom:12px;left:9px;font-size:9px}
  .mobile-close{display:block}
}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
  <div class="brand">
    <button class="btn icon" onclick="toggleSidebar()" title="Menu">☰</button>
    <div class="logo">O</div>
    <div>
      <h2>ONE ONLINE</h2>
      <small>NETWORK MAP</small>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn" onclick="reloadMap()">↻ Refresh</button>
    <button class="btn primary" onclick="fitAll()">Fit Map</button>
  </div>
</header>

<div class="app-body">

  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <h3>Find Network Location</h3>
      <div class="search-wrap">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Search customer, pull, IP, phone...">
      </div>
    </div>

    <div class="side-content">
      <div class="section-title">POINT TYPE FILTER</div>
      <div class="filter-list" id="filterList">
        <div class="empty">Loading point types...</div>
      </div>

      <div class="section-title" style="margin-top:20px">SEARCH RESULTS</div>
      <div class="result-list" id="searchResults">
        <div class="empty">Search for a location to see results.</div>
      </div>

      <div class="section-title" style="margin-top:20px">MAP INFORMATION</div>
      <div class="filter-item">
        <label>Total Locations</label><small id="totalLocations">0</small>
      </div>
      <div class="filter-item">
        <label>Connections</label><small id="totalConnections">0</small>
      </div>
      <div class="filter-item">
        <label>Area Lock</label><small id="areaStatus">OFF</small>
      </div>
    </div>
  </aside>

  <main class="map-area">
    <div id="map"></div>

    <div class="map-top-controls">
      <div class="map-control-group">
        <button class="map-control mobile-close" onclick="toggleSidebar()">☰ Menu</button>
        <div class="map-control">
          <select id="mapType" onchange="changeMapType(this.value)">
            <option value="road">Road Map</option>
            <option value="satellite">Satellite</option>
            <option value="terrain">Terrain</option>
          </select>
        </div>
        <button class="map-control" onclick="toggleLabels()">🏷 Labels</button>
        <button class="map-control" onclick="toggleConnections()">〰 Wires</button>
      </div>
    </div>

    <div class="zoom-control">
      <button onclick="map.zoomIn()">+</button>
      <button onclick="map.zoomOut()">−</button>
      <button onclick="fitAll()" style="font-size:13px">⌖</button>
    </div>

    <div class="map-status" id="mapStatus">Loading network map...</div>

    <div class="legend">
      <div class="legend-title">MAP LEGEND</div>
      <div id="legendItems"></div>
    </div>
  </main>
</div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ========================================
   ONE ONLINE NETWORK MAP
   Uses the separate Map Database API
======================================== */

const MAP_API = "https://script.google.com/macros/s/AKfycbxmDzfnY3LpvfvHjC4usnZiBT4BX4KZIjVoCGcSULikoTKQaC_mj7cbG_zUaiTyZ4sb8w/exec";
const CACHE_KEY = "ONE_ONLINE_MAP_DATA_V1";

const DEFAULT_SETTINGS = {
  mapType:"road",
  centerLat:23.8103,
  centerLng:90.4125,
  zoomLevel:13,
  markerSize:36,
  showMarkerLabels:true,
  showWires:true,
  hiddenTypes:[],
  wireColor:"#f59e0b",
  wireWeight:3,
  wireOpacity:.95,
  wireStyle:"solid",
  fiberColor:"#2563eb",
  fiberWeight:4,
  fiberOpacity:1,
  fiberStyle:"solid",
  dropColor:"#16a34a",
  dropWeight:2,
  dropOpacity:.95,
  dropStyle:"solid",
  lockedArea:{enabled:false,points:[]},
  _customTypes:[]
};

const DEFAULT_TYPES=[
  {name:"Customer",icon:"👤",color:"#2563eb"},
  {name:"Pole",icon:"🗼",color:"#f59e0b"},
  {name:"Switch",icon:"🔀",color:"#16a36a"},
  {name:"Pull",icon:"📍",color:"#9333ea"}
];

let map;
let data={
  locations:[],
  connections:[],
  settings:{...DEFAULT_SETTINGS},
  customTypes:[]
};

let markerLayer;
let connectionLayer;
let areaLayer;
let maskLayer;
let markerRefs=new Map();
let activeTile=null;
let showLabels=true;
let showWires=true;
let visibleTypes=new Set();

const $=id=>document.getElementById(id);

function toast(message){
  const el=$("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>el.classList.remove("show"),3000);
}

function setStatus(message){
  $("mapStatus").textContent=message;
}

function getValue(obj,...keys){
  for(const key of keys){
    if(obj && obj[key]!==undefined && obj[key]!==null && obj[key]!=="") return obj[key];
  }
  return "";
}

function idOf(loc){return String(getValue(loc,"id","ID","Id"))}
function typeOf(loc){return String(getValue(loc,"type","Type")||"Other")}
function nameOf(loc){return String(getValue(loc,"name","Name")||typeOf(loc))}
function latOf(loc){return Number(getValue(loc,"lat","latitude","Latitude"))}
function lngOf(loc){return Number(getValue(loc,"lng","longitude","Longitude"))}

function validLocation(loc){
  return idOf(loc)!=="" &&
    Number.isFinite(latOf(loc)) &&
    Number.isFinite(lngOf(loc));
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function displayValue(value){
  if(value===null || value===undefined || value==="") return "—";
  if(typeof value==="object") return JSON.stringify(value);
  return String(value);
}

function normalizeData(raw){
  if(raw && raw.data && !raw.locations) raw=raw.data;
  raw=raw||{};

  const locations=raw.locations||raw.Locations||[];
  const connections=raw.connections||raw.Connections||[];
  const settings=raw.settings||raw.Settings||{};

  const merged={...DEFAULT_SETTINGS,...settings};
  merged.lockedArea={
    ...DEFAULT_SETTINGS.lockedArea,
    ...(settings.lockedArea||{})
  };
  merged.lockedArea.points=Array.isArray(merged.lockedArea.points)
    ? merged.lockedArea.points : [];

  const types=raw.customTypes||raw.custom_types||settings._customTypes||[];

  data={
    locations:Array.isArray(locations)?locations:[],
    connections:Array.isArray(connections)?connections:[],
    settings:merged,
    customTypes:Array.isArray(types)&&types.length
      ?types:DEFAULT_TYPES.map(x=>({...x}))
  };

  showLabels=merged.showMarkerLabels!==false;
  showWires=merged.showWires!==false;
  visibleTypes=new Set(data.customTypes.map(t=>String(t.name).toLowerCase()));
}

/* ========================================
   MAP LAYERS
======================================== */

const TILE_LAYERS={
  road:L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:22,
      maxNativeZoom:19,
      attribution:"© OpenStreetMap contributors"
    }
  ),
  satellite:L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom:22,
      maxNativeZoom:19,
      attribution:"Tiles © Esri"
    }
  ),
  terrain:L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    {
      maxZoom:22,
      maxNativeZoom:17,
      attribution:"© OpenTopoMap"
    }
  )
};

function initMap(){
  map=L.map("map",{
    center:[23.8103,90.4125],
    zoom:13,
    minZoom:3,
    maxZoom:22,
    zoomControl:false,
    scrollWheelZoom:true,
    doubleClickZoom:true,
    touchZoom:true,
    preferCanvas:true,
    worldCopyJump:true
  });

  markerLayer=L.layerGroup().addTo(map);
  connectionLayer=L.layerGroup().addTo(map);
  areaLayer=L.layerGroup().addTo(map);
  maskLayer=L.layerGroup().addTo(map);

  changeMapType("road");

  map.on("zoomend",()=>{
    renderMarkers();
  });

  map.on("moveend",()=>{
    updateMapStatus();
  });
}

function changeMapType(type){
  if(!TILE_LAYERS[type]) type="road";

  if(activeTile) map.removeLayer(activeTile);
  activeTile=TILE_LAYERS[type];
  activeTile.addTo(map);

  $("mapType").value=type;
}

function applyMapView(){
  const s=data.settings;
  const lat=Number(s.centerLat);
  const lng=Number(s.centerLng);
  const zoom=Math.min(22,Math.max(3,Number(s.zoomLevel)||13));

  map.setView([
    Number.isFinite(lat)?lat:23.8103,
    Number.isFinite(lng)?lng:90.4125
  ],zoom);

  changeMapType(s.mapType||"road");
}

/* ========================================
   AREA LOCK AND OUTSIDE MASK
======================================== */

function validAreaPoints(){
  const points=data.settings.lockedArea?.points||[];
  return points.map(p=>({
    lat:Number(p.lat),
    lng:Number(p.lng)
  })).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng));
}

function reversePoints(points){
  return [...points].reverse().map(p=>[p.lat,p.lng]);
}

function applyAreaLock(){
  areaLayer.clearLayers();
  maskLayer.clearLayers();

  const area=data.settings.lockedArea||{};
  const points=validAreaPoints();

  if(!area.enabled || points.length<3){
    map.setMaxBounds(null);
    $("areaStatus").textContent="OFF";
    return;
  }

  $("areaStatus").textContent="ON";

  const bounds=L.latLngBounds(points.map(p=>[p.lat,p.lng]));

  // Boundary outline.
  L.polygon(points.map(p=>[p.lat,p.lng]),{
    color:"#12c98a",
    weight:3,
    opacity:1,
    fillColor:"#12c98a",
    fillOpacity:.07,
    dashArray:"8 5"
  }).addTo(areaLayer);

  // Mask the outside of the selected polygon.
  const world=[
    [-89.9,-360],
    [-89.9,360],
    [89.9,360],
    [89.9,-360]
  ];

  const inner=reversePoints(points);

  L.polygon([world,inner],{
    stroke:false,
    fillColor:"#09111f",
    fillOpacity:.58,
    interactive:false
  }).addTo(maskLayer);

  // Keep map panning inside the boundary's rectangular bounds.
  // The outside polygon remains masked.
  map.setMaxBounds(bounds.pad(.04));
  map.options.maxBoundsViscosity=1;

  // If the current view is outside the area, move to the area.
  if(!bounds.contains(map.getCenter())){
    map.fitBounds(bounds,{padding:[35,35]});
  }

  const currentZoom=map.getZoom();
  if(currentZoom<Math.min(13,Number(data.settings.zoomLevel)||13)){
    map.fitBounds(bounds,{padding:[35,35]});
  }
}

/* ========================================
   POINT TYPE AND MARKERS
======================================== */

function typeConfig(type){
  return data.customTypes.find(t=>
    String(t.name).toLowerCase()===String(type).toLowerCase()
  )||DEFAULT_TYPES.find(t=>
    String(t.name).toLowerCase()===String(type).toLowerCase()
  )||{name:type,icon:"📍",color:"#64748b"};
}

function markerSize(){
  const base=Math.max(18,Math.min(70,Number(data.settings.markerSize)||36));
  const zoom=map.getZoom();
  return Math.max(18,Math.min(62,base*Math.pow(2,(zoom-13)*.13)));
}

function markerIcon(loc){
  const type=typeOf(loc);
  const cfg=typeConfig(type);
  const size=markerSize();
  const icon=getValue(loc,"icon","Icon")||cfg.icon||"📍";
  const color=getValue(loc,"color","Color")||cfg.color||"#2563eb";

  return L.divIcon({
    className:"",
    html:`<div class="marker-icon" style="
      width:${size}px;height:${size}px;
      background:${escapeHtml(color)};
      font-size:${size*.53}px
    ">${escapeHtml(icon)}</div>`,
    iconSize:[size,size],
    iconAnchor:[size/2,size/2],
    popupAnchor:[0,-size/2]
  });
}

function isTypeVisible(type){
  const hidden=(data.settings.hiddenTypes||[])
    .map(x=>String(x).toLowerCase());

  return !hidden.includes(String(type).toLowerCase()) &&
    visibleTypes.has(String(type).toLowerCase());
}

function renderMarkers(){
  if(!markerLayer) return;

  markerLayer.clearLayers();
  markerRefs.clear();

  data.locations.forEach(loc=>{
    if(!validLocation(loc)) return;
    if(!isTypeVisible(typeOf(loc))) return;

    const marker=L.marker(
      [latOf(loc),lngOf(loc)],
      {icon:markerIcon(loc),riseOnHover:true}
    );

    marker.bindPopup(()=>buildPopup(loc),{
      maxWidth:340,
      autoPan:true
    });

    if(showLabels){
      marker.bindTooltip(escapeHtml(nameOf(loc)),{
        permanent:true,
        direction:"top",
        offset:[0,-13],
        className:"marker-label"
      });
    }

    marker.on("click",()=>{
      setStatus("Selected: "+nameOf(loc));
    });

    marker.addTo(markerLayer);
    markerRefs.set(idOf(loc),marker);
  });

  renderConnections();
}

/* ========================================
   FULL LOCATION INFORMATION
======================================== */

function allLocationFields(loc){
  let fields={...loc};

  const raw=getValue(loc,"dataJson","Data JSON","data_json");

  if(raw){
    try{
      const extra=typeof raw==="string"?JSON.parse(raw):raw;
      if(extra&&typeof extra==="object"){
        fields={...fields,...extra};
      }
    }catch(e){}
  }
  return fields;
}

function buildPopup(loc){
  const fields=allLocationFields(loc);
  const cfg=typeConfig(typeOf(loc));

  const hiddenKeys=new Set([
    "dataJson","data_json","Data JSON"
  ]);

  const rows=Object.entries(fields)
    .filter(([key])=>!hiddenKeys.has(key))
    .map(([key,value])=>`
      <tr>
        <td>${escapeHtml(key)}</td>
        <td>${escapeHtml(displayValue(value))}</td>
      </tr>
    `).join("");

  const lat=latOf(loc);
  const lng=lngOf(loc);
  const mapsUrl="https://www.google.com/maps?q="+encodeURIComponent(lat+","+lng);

  return `
    <div class="popup-title">${escapeHtml(nameOf(loc))}</div>
    <div class="popup-subtitle">
      ${escapeHtml(cfg.icon||"📍")} ${escapeHtml(typeOf(loc))}
    </div>
    <table class="popup-table">
      ${rows||"<tr><td colspan='2'>No additional information found.</td></tr>"}
    </table>
    <div class="popup-actions">
      <button onclick="openGoogleMap(${lat},${lng})">Open Google Maps</button>
      <button onclick="copyCoordinates(${lat},${lng})">Copy Location</button>
    </div>
  `;
}

function openGoogleMap(lat,lng){
  window.open(
    "https://www.google.com/maps?q="+encodeURIComponent(lat+","+lng),
    "_blank"
  );
}

function copyCoordinates(lat,lng){
  const value=lat+","+lng;
  if(navigator.clipboard){
    navigator.clipboard.writeText(value)
      .then(()=>toast("Coordinates copied."));
  }else{
    toast(value);
  }
}

/* ========================================
   CONNECTION LINES
======================================== */

function getConnectionStyle(conn){
  const type=String(getValue(conn,"type","Type")||"wire").toLowerCase();
  const s=data.settings;

  let color=s.wireColor;
  let weight=s.wireWeight;
  let opacity=s.wireOpacity;
  let style=s.wireStyle;

  if(type.includes("fiber")){
    color=s.fiberColor;
    weight=s.fiberWeight;
    opacity=s.fiberOpacity;
    style=s.fiberStyle;
  }else if(type.includes("drop")){
    color=s.dropColor;
    weight=s.dropWeight;
    opacity=s.dropOpacity;
    style=s.dropStyle;
  }

  let dashArray=null;
  if(style==="dashed") dashArray="10 7";
  if(style==="dotted") dashArray="2 7";

  return {
    color:color||"#f59e0b",
    weight:Number(weight)||3,
    opacity:Number(opacity),
    dashArray,
    lineCap:"round"
  };
}

function renderConnections(){
  if(!connectionLayer) return;
  connectionLayer.clearLayers();

  if(!showWires || data.settings.showWires===false) return;

  data.connections.forEach(conn=>{
    const from=String(getValue(conn,"from","From"));
    const to=String(getValue(conn,"to","To"));

    const a=data.locations.find(x=>idOf(x)===from);
    const b=data.locations.find(x=>idOf(x)===to);

    if(!a||!b||!validLocation(a)||!validLocation(b)) return;
    if(!isTypeVisible(typeOf(a))||!isTypeVisible(typeOf(b))) return;

    const line=L.polyline(
      [[latOf(a),lngOf(a)],[latOf(b),lngOf(b)]],
      getConnectionStyle(conn)
    );

    const label=getValue(conn,"name","Name")||"Network Connection";

    line.bindTooltip(
      escapeHtml(label)+
      "<br>"+escapeHtml(nameOf(a))+" → "+escapeHtml(nameOf(b))
    );

    line.addTo(connectionLayer);
  });
}

/* ========================================
   SEARCH
======================================== */

function searchableText(loc){
  const fields=allLocationFields(loc);
  return Object.entries(fields).map(([k,v])=>k+" "+displayValue(v)).join(" ").toLowerCase();
}

function searchLocations(query){
  const box=$("searchResults");
  const q=query.trim().toLowerCase();

  if(!q){
    box.innerHTML='<div class="empty">Search for a location to see results.</div>';
    return;
  }

  const matches=data.locations.filter(loc=>
    searchableText(loc).includes(q)
  ).slice(0,60);

  if(!matches.length){
    box.innerHTML='<div class="empty">No matching location found.</div>';
    return;
  }

  box.innerHTML=matches.map(loc=>{
    const cfg=typeConfig(typeOf(loc));
    return `
      <div class="result-item" data-point-id="${escapeHtml(idOf(loc))}">
        <strong>${escapeHtml(cfg.icon||"📍")} ${escapeHtml(nameOf(loc))}</strong>
        <small>${escapeHtml(typeOf(loc))} · ${escapeHtml(idOf(loc))}</small>
      </div>
    `;
  }).join("");

  box.querySelectorAll("[data-point-id]").forEach(el=>{
    el.addEventListener("click",()=>{
      const loc=data.locations.find(x=>idOf(x)===el.dataset.pointId);
      if(!loc||!validLocation(loc)) return;

      if(!isTypeVisible(typeOf(loc))){
        visibleTypes.add(typeOf(loc).toLowerCase());
        renderFilters();
        renderMarkers();
      }

      map.setView([latOf(loc),lngOf(loc)],18);
      const marker=markerRefs.get(idOf(loc));
      if(marker) marker.openPopup();

      if(window.innerWidth<760){
        $("sidebar").classList.add("closed");
      }
    });
  });
}

/* ========================================
   TYPE FILTERS AND LEGEND
======================================== */

function renderFilters(){
  const box=$("filterList");
  const hidden=(data.settings.hiddenTypes||[])
    .map(x=>String(x).toLowerCase());

  box.innerHTML=data.customTypes.map(t=>{
    const type=String(t.name).toLowerCase();
    const count=data.locations.filter(x=>
      typeOf(x).toLowerCase()===type
    ).length;

    const checked=visibleTypes.has(type)&&!hidden.includes(type);

    return `
      <div class="filter-item">
        <input type="checkbox" data-type="${escapeHtml(type)}" ${checked?"checked":""}>
        <label>${escapeHtml(t.icon||"📍")} ${escapeHtml(t.name)}</label>
        <small>${count}</small>
      </div>
    `;
  }).join("");

  box.querySelectorAll("[data-type]").forEach(input=>{
    input.addEventListener("change",()=>{
      const type=input.dataset.type;
      if(input.checked) visibleTypes.add(type);
      else visibleTypes.delete(type);
      renderMarkers();
    });
  });

  $("legendItems").innerHTML=data.customTypes.map(t=>`
    <div class="legend-item">
      <span class="legend-dot" style="background:${escapeHtml(t.color||"#64748b")}"></span>
      <span>${escapeHtml(t.icon||"📍")} ${escapeHtml(t.name)}</span>
    </div>
  `).join("");
}

/* ========================================
   CONTROLS
======================================== */

function fitAll(){
  const points=data.locations.filter(loc=>
    validLocation(loc)&&isTypeVisible(typeOf(loc))
  );

  if(points.length){
    const bounds=L.latLngBounds(points.map(p=>[latOf(p),lngOf(p)]));
    map.fitBounds(bounds,{padding:[45,45],maxZoom:17});
  }else{
    const area=validAreaPoints();
    if(area.length>=3) map.fitBounds(L.latLngBounds(area));
    else toast("No visible map locations found.");
  }
}

function toggleSidebar(){
  $("sidebar").classList.toggle("closed");
  setTimeout(()=>map.invalidateSize(),250);
}

function toggleLabels(){
  showLabels=!showLabels;
  renderMarkers();
  toast(showLabels?"Marker labels enabled":"Marker labels hidden");
}

function toggleConnections(){
  showWires=!showWires;
  renderConnections();
  toast(showWires?"Connections visible":"Connections hidden");
}

function updateMapStatus(){
  if(!map) return;
  $("mapStatus").textContent=
    "Zoom "+map.getZoom()+" · "+data.locations.length+" locations";
}

/* ========================================
   DATA LOADING
======================================== */

async function fetchRemote(){
  const response=await fetch(MAP_API+"?action=getMapData",{
    method:"GET",
    cache:"no-store"
  });
  if(!response.ok) throw new Error("Server response "+response.status);
  return await response.json();
}

function renderAll(){
  renderFilters();
  renderMarkers();
  applyAreaLock();

  $("totalLocations").textContent=data.locations.length;
  $("totalConnections").textContent=data.connections.length;

  updateMapStatus();
}

async function loadData(){
  // Load local data immediately if available.
  try{
    const cached=localStorage.getItem(CACHE_KEY);
    if(cached){
      normalizeData(JSON.parse(cached));
      renderAll();
      setStatus("Showing cached map data...");
    }
  }catch(e){
    console.warn("Cache unavailable",e);
  }

  // Fetch fresh map data from Google Sheets.
  try{
    const remote=await fetchRemote();
    normalizeData(remote);

    localStorage.setItem(CACHE_KEY,JSON.stringify(data));

    renderAll();
    applyMapView();
    applyAreaLock();

    setStatus("Live map data connected");
  }catch(error){
    console.error(error);
    setStatus("Offline mode · Cached data");
    toast("Could not connect to map database. Showing cached data if available.");
  }
}

async function reloadMap(){
  setStatus("Refreshing map...");
  await loadData();
  toast("Map refresh completed.");
}

/* ========================================
   INITIAL START
======================================== */

function start(){
  initMap();

  $("searchInput").addEventListener("input",e=>{
    searchLocations(e.target.value);
  });

  loadData().then(()=>{
    setTimeout(()=>{
      map.invalidateSize();
    },300);
  });

  window.addEventListener("resize",()=>{
    setTimeout(()=>map.invalidateSize(),150);
  });
}

start();
</script>
