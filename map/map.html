
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ONE ONLINE | Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#0b1220;
 font-family:Arial,sans-serif;
}

#map{
 width:100%;
 height:100%;
 background:#0b1220;
}

/* Transparent marker */
.map-marker{
 display:flex;
 align-items:center;
 justify-content:center;
 background:transparent!important;
 border:0!important;
 border-radius:0!important;
 box-shadow:none!important;
 filter:drop-shadow(0 1px 2px rgba(0,0,0,.65));
 overflow:visible;
}

.marker-symbol{
 display:flex;
 align-items:center;
 justify-content:center;
 background:transparent;
 line-height:1;
 white-space:nowrap;
 transform-origin:center;
}

/* Marker labels */
.leaflet-tooltip.marker-label{
 background:rgba(10,18,32,.92);
 color:#fff;
 border:1px solid rgba(255,255,255,.2);
 border-radius:5px;
 padding:4px 7px;
 font-size:11px;
 font-weight:700;
 box-shadow:0 2px 7px #0005;
}

.leaflet-tooltip.marker-label:before{
 border-top-color:rgba(10,18,32,.92);
}

/* Connection direction arrow */
.connection-arrow{
 width:20px;
 height:20px;
 display:flex;
 justify-content:center;
 align-items:center;
 background:transparent;
 color:white;
 font-size:17px;
 font-weight:900;
 text-shadow:0 1px 3px #000,0 0 4px #000;
}

/* Area boundary */
.area-boundary{
 pointer-events:none;
}

/* Outside locked area */
.area-outside-mask{
 pointer-events:none;
}

/* Hide unnecessary Leaflet controls */
.leaflet-control-attribution{
 font-size:9px!important;
 opacity:.7;
}

.leaflet-control-zoom{
 border:0!important;
 box-shadow:0 2px 8px #0005!important;
}

.leaflet-control-zoom a{
 background:#111c2e!important;
 color:#fff!important;
 border-color:#34445c!important;
}

.leaflet-control-zoom a:hover{
 background:#26364d!important;
}

.leaflet-container{
 background:#0b1220;
}

/* Loading indicator */
#loading{
 position:fixed;
 z-index:2000;
 left:50%;
 top:14px;
 transform:translateX(-50%);
 background:rgba(12,22,38,.9);
 color:#fff;
 border:1px solid #334155;
 border-radius:20px;
 padding:7px 13px;
 font-size:11px;
 pointer-events:none;
 transition:opacity .3s;
}

#loading.hide{
 opacity:0;
 visibility:hidden;
}

/* Error message */
#errorBox{
 display:none;
 position:fixed;
 z-index:2001;
 left:12px;
 right:12px;
 bottom:15px;
 padding:12px;
 color:#fff;
 background:#991b1b;
 border-radius:9px;
 font-size:12px;
 text-align:center;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="loading">Loading map...</div>
<div id="errorBox"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";

/* =====================================================
   ONE ONLINE MAP
   Uses the same Map Database as map-setting.html
===================================================== */

const MAP_API =
"https://script.google.com/macros/s/AKfycbxmDzfnY3LpvfvHjC4usnZiBT4BX4KZIjVoCGcSULikoTKQaC_mj7cbG_zUaiTyZ4sb8w/exec";

const CACHE_KEY = "ONE_ONLINE_MAP_DATA_V1";

const DEFAULT_SETTINGS = {
 mapType:"road",
 centerLat:23.8103,
 centerLng:90.4125,
 zoomLevel:13,
 markerSize:36,
 showMarkerLabels:true,
 showWires:true,
 hiddenTypes:[],

 wireColor:"#f59e0b",
 wireWeight:3,
 wireOpacity:.95,
 wireStyle:"solid",

 fiberColor:"#2563eb",
 fiberWeight:4,
 fiberOpacity:1,
 fiberStyle:"solid",

 dropColor:"#16a34a",
 dropWeight:2,
 dropOpacity:.95,
 dropStyle:"solid",

 lockedArea:{
  enabled:false,
  points:[]
 },

 _customTypes:[]
};

const DEFAULT_TYPES = [
 {name:"Customer",icon:"👤",color:"#2563eb"},
 {name:"Pole",icon:"🗼",color:"#f59e0b"},
 {name:"Switch",icon:"🔀",color:"#16a34a"},
 {name:"Pull",icon:"📍",color:"#9333ea"}
];

let map;
let mapData = {
 locations:[],
 connections:[],
 settings:{},
 customTypes:[]
};

let settings = {...DEFAULT_SETTINGS};
let types = [];

let tileLayers = {};
let markerLayers = [];
let connectionLayers = [];
let areaLayers = [];

let markerRecords = [];
let currentLockedBounds = null;
let currentMinZoom = 2;

let refreshTimer = null;
let isFirstRender = true;

const $ = id => document.getElementById(id);


/* =====================================================
   HELPERS
===================================================== */

function safeJSON(value,fallback){
 try{
  return JSON.parse(value);
 }catch(e){
  return fallback;
 }
}

function normalizeData(raw){

 if(raw?.data && !raw.locations){
  raw = raw.data;
 }

 return {
  locations:Array.isArray(raw?.locations)
   ? raw.locations : [],

  connections:Array.isArray(raw?.connections)
   ? raw.connections : [],

  settings:raw?.settings &&
   typeof raw.settings === "object"
   ? raw.settings : {},

  customTypes:Array.isArray(raw?.customTypes)
   ? raw.customTypes : []
 };
}

function validColor(value){
 return /^#[0-9a-f]{6}$/i.test(value || "")
  ? value
  : "#64748b";
}

function numberValue(value,fallback=null){
 if(value===null || value===undefined || value===""){
  return fallback;
 }

 const n=Number(value);
 return Number.isFinite(n)?n:fallback;
}

function firstValue(obj,keys,fallback=""){
 for(const key of keys){
  if(obj && obj[key]!==undefined &&
     obj[key]!==null && obj[key]!==""){
   return obj[key];
  }
 }
 return fallback;
}

function parseExtraData(location){

 let data =
  location?.data ??
  location?.Data ??
  location?.dataJson ??
  location?.["Data JSON"];

 if(typeof data==="string"){
  data=safeJSON(data,{});
 }

 return data && typeof data==="object"
  ? data
  : {};
}

function getLocationInfo(location){

 const extra=parseExtraData(location);

 const lat=numberValue(firstValue(location,[
  "lat","latitude","Latitude","LAT"
 ],firstValue(extra,[
  "lat","latitude","Latitude"
 ],null)));

 const lng=numberValue(firstValue(location,[
  "lng","lon","longitude","Longitude","LNG"
 ],firstValue(extra,[
  "lng","lon","longitude","Longitude"
 ],null)));

 const id=String(firstValue(location,[
  "id","ID","locationId","Location ID"
 ],firstValue(extra,["id","ID"],"")));

 const name=String(firstValue(location,[
  "name","Name","customerName","Customer Name"
 ],firstValue(extra,[
  "name","Name","customerName","Customer Name"
 ],"Unnamed")));

 const type=String(firstValue(location,[
  "type","Type","category","Category"
 ],firstValue(extra,[
  "type","Type","category"
 ],"Customer")));

 const locationNumber=String(firstValue(location,[
  "locationNumber","Location Number","location_number"
 ],firstValue(extra,[
  "locationNumber","Location Number"
 ],"")));

 const icon=String(firstValue(location,[
  "icon","Icon"
 ],firstValue(extra,["icon","Icon"],"")));

 const color=String(firstValue(location,[
  "color","Color"
 ],firstValue(extra,["color","Color"],"")));

 return {
  raw:location,
  extra,
  id,
  name,
  type,
  locationNumber,
  lat,
  lng,
  icon,
  color
 };
}

function validCoordinates(lat,lng){
 return Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        Math.abs(lat)<=90 &&
        Math.abs(lng)<=180 &&
        !(lat===0 && lng===0);
}

function normalizeTypeName(value){
 return String(value||"").trim().toLowerCase();
}

function setLoading(show){
 $("loading").classList.toggle("hide",!show);
}

function showError(message){
 $("errorBox").textContent=message;
 $("errorBox").style.display="block";

 setTimeout(()=>{
  $("errorBox").style.display="none";
 },6000);
}


/* =====================================================
   POINT TYPE SETTINGS
===================================================== */

function buildTypes(){

 types=DEFAULT_TYPES.map(x=>({...x}));

 const custom=[
  ...(mapData.customTypes||[]),
  ...(settings._customTypes||[])
 ];

 custom.forEach(item=>{

  const name=item.name||item.type;
  if(!name)return;

  const newType={
   name:String(name),
   icon:String(item.icon||"📍"),
   color:validColor(item.color)
  };

  const index=types.findIndex(t=>
   normalizeTypeName(t.name)===
   normalizeTypeName(newType.name)
  );

  if(index>=0){
   types[index]=newType;
  }else{
   types.push(newType);
  }
 });
}

function getTypeSettings(typeName){

 const index=types.findIndex(t=>
  normalizeTypeName(t.name)===
  normalizeTypeName(typeName)
 );

 return index>=0
  ? types[index]
  : {name:typeName,icon:"📍",color:"#64748b"};
}

function isTypeHidden(typeName){

 const hidden=Array.isArray(settings.hiddenTypes)
  ? settings.hiddenTypes
  : [];

 return hidden.some(x=>
  normalizeTypeName(x)===
  normalizeTypeName(typeName)
 );
}


/* =====================================================
   MAP INITIALIZATION
===================================================== */

function initMap(){

 if(map)return;

 map=L.map("map",{
  zoomControl:true,
  attributionControl:true,
  preferCanvas:true,
  zoomAnimation:true,
  fadeAnimation:false,
  markerZoomAnimation:false,
  inertia:true,
  worldCopyJump:false
 });

 tileLayers.road=L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:21,
   minZoom:2,
   keepBuffer:3,
   updateWhenIdle:true,
   updateWhenZooming:false,
   attribution:"&copy; OpenStreetMap"
  }
 );

 tileLayers.satellite=L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
   maxZoom:20,
   minZoom:2,
   keepBuffer:3,
   updateWhenIdle:true,
   updateWhenZooming:false,
   attribution:"Tiles &copy; Esri"
  }
 );

 tileLayers.terrain=L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
   maxZoom:17,
   minZoom:2,
   keepBuffer:3,
   updateWhenIdle:true,
   updateWhenZooming:false,
   attribution:"&copy; OpenTopoMap"
  }
 );

 getCurrentTileLayer().addTo(map);

 map.on("zoomend",updateMarkerSizes);

 map.on("moveend",()=>{
  if(currentLockedBounds){
   enforceAreaBounds();
  }
 });

 map.setView(
  [
   numberValue(settings.centerLat,23.8103),
   numberValue(settings.centerLng,90.4125)
  ],
  numberValue(settings.zoomLevel,13)
 );

 setTimeout(()=>{
  map.invalidateSize(true);
 },100);
}

function getCurrentTileLayer(){
 return tileLayers[settings.mapType] || tileLayers.road;
}

function changeMapLayer(){

 if(!map)return;

 Object.values(tileLayers).forEach(layer=>{
  if(map.hasLayer(layer)){
   map.removeLayer(layer);
  }
 });

 getCurrentTileLayer().addTo(map);
}


/* =====================================================
   AREA LOCK
===================================================== */

function getValidAreaPoints(){

 const area=settings.lockedArea;

 if(!area || area.enabled!==true){
  return [];
 }

 if(!Array.isArray(area.points) || area.points.length<3){
  return [];
 }

 const points=area.points.map(p=>({
  lat:Number(p.lat),
  lng:Number(p.lng)
 }));

 if(points.some(p=>
  !Number.isFinite(p.lat) ||
  !Number.isFinite(p.lng) ||
  Math.abs(p.lat)>90 ||
  Math.abs(p.lng)>180
 )){
  return [];
 }

 return points;
}

function clearAreaLayers(){

 areaLayers.forEach(layer=>{
  if(map && map.hasLayer(layer)){
   map.removeLayer(layer);
  }
 });

 areaLayers=[];
 currentLockedBounds=null;
}

function getAreaBounds(points){

 return L.latLngBounds(
  points.map(p=>[p.lat,p.lng])
 );
}

function getPolygonCenter(points){

 let lat=0;
 let lng=0;

 points.forEach(p=>{
  lat+=p.lat;
  lng+=p.lng;
 });

 return L.latLng(
  lat/points.length,
  lng/points.length
 );
}

function drawAreaLock(){

 clearAreaLayers();

 if(!map)return;

 const points=getValidAreaPoints();

 if(!points.length){

  map.setMaxBounds(
   L.latLngBounds([[-85,-180],[85,180]])
  );

  map.setMinZoom(2);

  return;
 }

 const areaLatLngs=points.map(p=>[
  p.lat,p.lng
 ]);

 const bounds=getAreaBounds(points);

 currentLockedBounds=bounds;

 /*
  Outside mask:
  Map outside the selected polygon is hidden.
  The background remains blank/dark.
 */

 const worldRing=[
  [-85,-180],
  [-85,180],
  [85,180],
  [85,-180]
 ];

 const outsideMask=L.polygon(
  [
   worldRing,
   areaLatLngs
  ],
  {
   stroke:false,
   fill:true,
   fillColor:"#0b1220",
   fillOpacity:1,
   fillRule:"evenodd",
   interactive:false,
   className:"area-outside-mask"
  }
 ).addTo(map);

 areaLayers.push(outsideMask);

 /* Selected area boundary */

 const boundary=L.polygon(
  areaLatLngs,
  {
   color:"#16a34a",
   weight:2,
   opacity:.95,
   fill:false,
   interactive:false,
   className:"area-boundary"
  }
 ).addTo(map);

 areaLayers.push(boundary);

 /*
  Prevent moving outside the selected area's
  rectangular bounds. The polygon mask hides
  the remaining outside portions.
 */

 map.setMaxBounds(bounds);
 map.options.maxBoundsViscosity=1;

 /*
  Calculate minimum zoom so the selected
  boundary cannot be zoomed out of.
 */

 const calculatedZoom=map.getBoundsZoom(
  bounds,
  false
 );

 currentMinZoom=Math.max(
  2,
  Math.min(calculatedZoom,20)
 );

 map.setMinZoom(currentMinZoom);

 if(isFirstRender){

  map.fitBounds(bounds,{
   padding:[10,10],
   maxZoom:numberValue(settings.zoomLevel,13)
  });

  isFirstRender=false;

 }else{

  const currentZoom=map.getZoom();

  if(currentZoom<currentMinZoom){
   map.fitBounds(bounds,{
    padding:[10,10]
   });
  }else{
   enforceAreaBounds();
  }
 }
}

function enforceAreaBounds(){

 if(!map || !currentLockedBounds)return;

 const center=map.getCenter();

 if(!currentLockedBounds.contains(center)){
  map.panInsideBounds(
   currentLockedBounds,
   {animate:false}
  );
 }
}

function refreshAreaLock(){

 if(!map)return;

 const lockedPoints=getValidAreaPoints();

 if(lockedPoints.length){
  drawAreaLock();
 }else{
  clearAreaLayers();

  map.setMaxBounds(
   L.latLngBounds([[-85,-180],[85,180]])
  );

  map.setMinZoom(2);

  isFirstRender=true;

  map.setView(
   [
    numberValue(settings.centerLat,23.8103),
    numberValue(settings.centerLng,90.4125)
   ],
   numberValue(settings.zoomLevel,13)
  );
 }
}


/* =====================================================
   MARKER SIZE
===================================================== */

function calculateMarkerSize(){

 const base=numberValue(settings.markerSize,36);
 const zoom=map ? map.getZoom() : 13;

 /*
  Controlled zoom scaling.
  Keeps symbols readable without becoming
  excessively large or tiny.
 */

 const scale=Math.pow(
  2,
  (zoom-13)*0.25
 );

 return Math.max(
  11,
  Math.min(44,base*scale)
 );
}

function createMarkerIcon(info,size){

 const typeSettings=getTypeSettings(info.type);

 const icon=info.icon || typeSettings.icon || "📍";

 const color=validColor(
  info.color || typeSettings.color
 );

 return L.divIcon({
  className:"map-marker",
  html:`
   <div class="marker-symbol"
    style="
     width:${size}px;
     height:${size}px;
     font-size:${size}px;
     color:${color};
    ">
    ${escapeHTML(icon)}
   </div>
  `,
  iconSize:[size,size],
  iconAnchor:[size/2,size/2]
 });
}

function escapeHTML(value){

 return String(value??"").replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c])
 );
}


/* =====================================================
   MARKER LOOKUP
===================================================== */

const locationLookup=new Map();

function addLookup(key,info){

 if(key===undefined || key===null || key===""){
  return;
 }

 const normalized=String(key).trim();

 if(!normalized)return;

 locationLookup.set(normalized,info);
}

function buildLocationLookup(){

 locationLookup.clear();

 markerRecords.forEach(info=>{

  addLookup(info.id,info);
  addLookup(info.name,info);
  addLookup(info.locationNumber,info);

  addLookup(info.raw?.ID,info);
  addLookup(info.raw?.Name,info);
  addLookup(info.raw?.["Location Number"],info);
 });
}

function findConnectionLocation(value){

 if(value===undefined || value===null){
  return null;
 }

 const key=String(value).trim();

 return locationLookup.get(key) || null;
}


/* =====================================================
   MARKERS
===================================================== */

function clearMarkerLayers(){

 markerLayers.forEach(layer=>{
  if(map.hasLayer(layer)){
   map.removeLayer(layer);
  }
 });

 markerLayers=[];
 markerRecords=[];
 locationLookup.clear();
}

function renderMarkers(){

 clearMarkerLayers();

 const locations=mapData.locations||[];

 const lockedPoints=getValidAreaPoints();

 const areaBounds=lockedPoints.length
  ? getAreaBounds(lockedPoints)
  : null;

 locations.forEach(location=>{

  const info=getLocationInfo(location);

  if(!validCoordinates(info.lat,info.lng)){
   return;
  }

  if(isTypeHidden(info.type)){
   return;
  }

  if(areaBounds &&
     !areaBounds.contains([info.lat,info.lng])){
   return;
  }

  const marker=L.marker(
   [info.lat,info.lng],
   {
    icon:createMarkerIcon(
     info,
     calculateMarkerSize()
    ),
    keyboard:false,
    riseOnHover:true
   }
  );

  if(settings.showMarkerLabels!==false){

   const label=info.name+
    (info.locationNumber
     ? " | "+info.locationNumber
     : "");

   marker.bindTooltip(
    escapeHTML(label),
    {
     permanent:true,
     direction:"top",
     offset:[0,-8],
     className:"marker-label"
    }
   );
  }

  marker.addTo(map);

  markerLayers.push(marker);

  markerRecords.push({
   ...info,
   marker
  });
 });

 buildLocationLookup();
}

function updateMarkerSizes(){

 if(!map)return;

 const size=calculateMarkerSize();

 markerRecords.forEach(info=>{

  info.marker.setIcon(
   createMarkerIcon(info,size)
  );
 });
}


/* =====================================================
   CONNECTION SETTINGS
===================================================== */

function getConnectionStyle(connection){

 const rawType=String(
  firstValue(connection,[
   "lineType",
   "connectionType",
   "type",
   "Type",
   "category"
  ],"wire")
 ).toLowerCase();

 let key="wire";

 if(rawType.includes("fiber") ||
    rawType.includes("ফাইবার")){
  key="fiber";
 }

 if(rawType.includes("drop") ||
    rawType.includes("customer")){
  key="drop";
 }

 const color=validColor(
  settings[key+"Color"] ||
  DEFAULT_SETTINGS[key+"Color"]
 );

 const weight=Math.max(
  1,
  Math.min(
   15,
   numberValue(
    settings[key+"Weight"],
    DEFAULT_SETTINGS[key+"Weight"]
   )
  )
 );

 const opacity=Math.max(
  0,
  Math.min(
   1,
   numberValue(
    settings[key+"Opacity"],
    DEFAULT_SETTINGS[key+"Opacity"]
   )
  )
 );

 const style=settings[key+"Style"]||"solid";

 let dashArray=null;

 if(style==="dashed"){
  dashArray="8 7";
 }else if(style==="dotted"){
  dashArray="2 7";
 }

 return {
  key,
  color,
  weight,
  opacity,
  dashArray
 };
}


/* =====================================================
   CONNECTION ARROWS
===================================================== */

function calculateBearing(a,b){

 const lat1=a.lat*Math.PI/180;
 const lat2=b.lat*Math.PI/180;
 const dLng=(b.lng-a.lng)*Math.PI/180;

 const y=Math.sin(dLng)*Math.cos(lat2);

 const x=
  Math.cos(lat1)*Math.sin(lat2)-
  Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLng);

 return (
  Math.atan2(y,x)*180/Math.PI+360
 )%360;
}

function createArrowMarker(a,b,color){

 const middle=L.latLng(
  (a.lat+b.lat)/2,
  (a.lng+b.lng)/2
 );

 const bearing=calculateBearing(a,b);

 const icon=L.divIcon({
  className:"connection-arrow",
  html:`
   <div style="
    color:${validColor(color)};
    transform:rotate(${bearing}deg);
   ">▲</div>
  `,
  iconSize:[20,20],
  iconAnchor:[10,10]
 });

 return L.marker(middle,{
  icon,
  interactive:false,
  keyboard:false,
  zIndexOffset:500
 });
}


/* =====================================================
   CONNECTION RENDERING
===================================================== */

function clearConnectionLayers(){

 connectionLayers.forEach(layer=>{
  if(map.hasLayer(layer)){
   map.removeLayer(layer);
  }
 });

 connectionLayers=[];
}

function getConnectionEndpoints(connection){

 const from=firstValue(connection,[
  "from","From","source","Source",
  "fromId","fromID","start","startId"
 ],null);

 const to=firstValue(connection,[
  "to","To","target","Target",
  "toId","toID","end","endId"
 ],null);

 return {
  from:findConnectionLocation(from),
  to:findConnectionLocation(to)
 };
}

function renderConnections(){

 clearConnectionLayers();

 if(settings.showWires===false){
  return;
 }

 const connections=mapData.connections||[];

 const lockedPoints=getValidAreaPoints();

 const areaBounds=lockedPoints.length
  ? getAreaBounds(lockedPoints)
  : null;

 connections.forEach(connection=>{

  const endpoints=getConnectionEndpoints(connection);

  const a=endpoints.from;
  const b=endpoints.to;

  if(!a || !b)return;

  if(!validCoordinates(a.lat,a.lng) ||
     !validCoordinates(b.lat,b.lng)){
   return;
  }

  if(areaBounds &&
     (!areaBounds.contains([a.lat,a.lng]) ||
      !areaBounds.contains([b.lat,b.lng]))){
   return;
  }

  /*
   Hide connections when either connected
   point type is hidden.
  */

  if(isTypeHidden(a.type)||isTypeHidden(b.type)){
   return;
  }

  const style=getConnectionStyle(connection);

  const line=L.polyline(
   [
    [a.lat,a.lng],
    [b.lat,b.lng]
   ],
   {
    color:style.color,
    weight:style.weight,
    opacity:style.opacity,
    dashArray:style.dashArray,
    lineCap:"round",
    lineJoin:"round",
    interactive:false
   }
  ).addTo(map);

  connectionLayers.push(line);

  /*
   Direction arrow:
   from -> to
  */

  const arrow=createArrowMarker(
   a,b,style.color
  ).addTo(map);

  connectionLayers.push(arrow);
 });
}


/* =====================================================
   RENDER ALL MAP DATA
===================================================== */

function renderMap(){

 if(!map)return;

 buildTypes();

 changeMapLayer();

 refreshAreaLock();

 renderMarkers();

 renderConnections();

 setTimeout(()=>{
  map.invalidateSize(true);
 },80);
}


/* =====================================================
   DATA LOADING
===================================================== */

function loadCache(){

 const cached=safeJSON(
  localStorage.getItem(CACHE_KEY),
  null
 );

 if(!cached)return false;

 mapData=normalizeData(cached);

 settings={
  ...DEFAULT_SETTINGS,
  ...(mapData.settings||{})
 };

 buildTypes();

 return true;
}

async function fetchMapData(){

 const response=await fetch(
  MAP_API+"?action=getMapData",
  {
   method:"GET",
   cache:"no-store"
  }
 );

 if(!response.ok){
  throw new Error("Map API HTTP "+response.status);
 }

 const raw=await response.json();

 const fresh=normalizeData(raw);

 mapData=fresh;

 settings={
  ...DEFAULT_SETTINGS,
  ...(mapData.settings||{})
 };

 buildTypes();

 localStorage.setItem(
  CACHE_KEY,
  JSON.stringify(mapData)
 );

 return true;
}

async function loadMap(){

 setLoading(true);

 /*
  First show local cache.
  Do not wait for Google Apps Script.
 */

 const hasCache=loadCache();

 initMap();

 if(hasCache){
  renderMap();
  setLoading(false);
 }

 try{

  await fetchMapData();

  renderMap();

  setLoading(false);

 }catch(error){

  console.error("Map load error:",error);

  if(!hasCache){
   showError(
    "Map data load হয়নি। Internet/API connection পরীক্ষা করুন।"
   );
  }else{
   console.warn(
    "Using previously saved map cache."
   );
  }

  setLoading(false);
 }
}


/* =====================================================
   AUTO REFRESH
===================================================== */

async function refreshMapData(){

 if(document.visibilityState!=="visible"){
  return;
 }

 try{

  await fetchMapData();

  renderMap();

 }catch(error){

  console.warn(
   "Background map refresh failed:",
   error
  );
 }
}

document.addEventListener(
 "visibilitychange",
 ()=>{
  if(document.visibilityState==="visible"){
   setTimeout(refreshMapData,500);
  }
 }
);


/* =====================================================
   START
===================================================== */

if(typeof L==="undefined"){

 showError("Leaflet Map Library load হয়নি। Internet connection পরীক্ষা করুন।");

}else{

 loadMap();

 /*
  Background refresh every 60 seconds.
  Cached map remains visible while refreshing.
 */

 refreshTimer=setInterval(
  refreshMapData,
  60000
 );
}

</script>
