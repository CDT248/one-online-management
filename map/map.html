
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ONE ONLINE | Network Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden}
body{background:#e5e7eb;font-family:Arial,sans-serif}
#map{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#e5e7eb}
.leaflet-container{width:100%;height:100%;font-family:Arial,sans-serif}
.map-marker{display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 7px #0006;font-size:19px;line-height:1}
.map-label{background:#fff;color:#172033;border:1px solid #d1d5db;border-radius:5px;padding:3px 6px;font-size:11px;font-weight:700;box-shadow:0 1px 4px #0003;white-space:nowrap}
.leaflet-tooltip.map-label:before{display:none}
.leaflet-popup-content-wrapper{border-radius:9px}
.leaflet-popup-content{font-size:13px;line-height:1.6;margin:10px 13px}
.leaflet-popup-content b{font-size:14px}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f3f4f6;color:#374151;font-size:14px;z-index:2000}
.loading.hide{display:none}
</style>
</head>
<body>
<div id="map"></div>
<div class="loading" id="loading">Loading Network Map...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-polylinedecorator@1.7.0/dist/leaflet.polylineDecorator.js"></script>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxmDzfnY3LpvfvHjC4usnZiBT4BX4KZIjVoCGcSULikoTKQaC_mj7cbG_zUaiTyZ4sb8w/exec";
const STORAGE_KEY="ONE_ONLINE_MAP_DATA_V1";

let db={locations:[],connections:[],settings:{},customTypes:[]};
let map=null;
let markerLayers=[];
let connectionLayers=[];
let areaLayer=null;

const value=(obj,keys,fallback="")=>{
 for(const key of keys){
  if(obj&&obj[key]!==undefined&&obj[key]!==null&&obj[key]!=="")return obj[key];
 }
 return fallback;
};

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,ch=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[ch]));
}

function locationType(item){
 return String(value(item,["type","Type","locationType","Location Type"],"Other"));
}
function locationName(item){
 return String(value(item,["name","Name","customerName","Customer Name"],"Unnamed"));
}
function locationId(item){
 return String(value(item,["id","ID","locationId","Location ID","locationNumber","Location Number"],""));
}
function latitude(item){
 return Number(value(item,["lat","latitude","Latitude"],NaN));
}
function longitude(item){
 return Number(value(item,["lng","longitude","Longitude","long"],NaN));
}
function isValidLocation(item){
 return Number.isFinite(latitude(item))&&Number.isFinite(longitude(item));
}
function getExtraData(item){
 if(item.data&&typeof item.data==="object")return item.data;
 try{return JSON.parse(item["Data JSON"]||item.dataJson||"{}")}
 catch(e){return {}}
}
function getCustomType(type){
 return db.customTypes.find(x=>
  String(x.name||x.type||"").toLowerCase()===String(type).toLowerCase()
 )||{};
}
function getTypeIcon(item){
 const type=locationType(item);
 const custom=getCustomType(type);
 return value(item,["icon","Icon"],custom.icon||({
  Customer:"👤",Pole:"🗼",Switch:"🔀"
 }[type]||"📍"));
}
function getTypeColor(item){
 const custom=getCustomType(locationType(item));
 return value(item,["color","Color"],custom.color||({
  Customer:"#168b70",Pole:"#e59b25",Switch:"#3287e8"
 }[locationType(item)]||"#168b70"));
}

function normalizeData(response){
 const data=response&&response.data?response.data:response||{};
 db.locations=Array.isArray(data.locations)?data.locations:[];
 db.connections=Array.isArray(data.connections)?data.connections:[];
 db.settings=data.settings&&typeof data.settings==="object"?data.settings:{};
 db.customTypes=Array.isArray(data.customTypes)?data.customTypes:
  (Array.isArray(db.settings._customTypes)?db.settings._customTypes:[]);
}

function createMap(){
 const s=db.settings;
 const centerLat=Number(s.centerLat)||22.3569;
 const centerLng=Number(s.centerLng)||91.7832;
 const zoom=Number(s.zoomLevel)||12;

 map=L.map("map",{
  zoomControl:false,
  attributionControl:false,
  scrollWheelZoom:true,
  doubleClickZoom:true,
  touchZoom:true,
  dragging:true,
  tap:true
 }).setView([centerLat,centerLng],zoom);

 const layers={
  road:L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
   maxZoom:20
  }),
  satellite:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{
   maxZoom:19
  }),
  terrain:L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{
   maxZoom:17
  })
 };

 let selected=String(s.mapType||"road").toLowerCase();
 if(selected==="esri")selected="satellite";
 if(!layers[selected])selected="road";
 layers[selected].addTo(map);
}

function clearMapLayers(){
 markerLayers.forEach(layer=>map.removeLayer(layer));
 connectionLayers.forEach(layer=>map.removeLayer(layer));
 markerLayers=[];
 connectionLayers=[];
 if(areaLayer){
  map.removeLayer(areaLayer);
  areaLayer=null;
 }
}

function getAreaPoints(){
 const s=db.settings;
 const area=s.lockedArea||s.areaLock||{};
 if(Array.isArray(area.points)){
  return area.points.map(p=>[
   Number(p.lat??p[0]),Number(p.lng??p[1])
  ]).filter(p=>p.every(Number.isFinite));
 }
 if(area.southWest&&area.northEast){
  const sw=area.southWest,ne=area.northEast;
  return [
   [Number(sw.lat),Number(sw.lng)],
   [Number(sw.lat),Number(ne.lng)],
   [Number(ne.lat),Number(ne.lng)],
   [Number(ne.lat),Number(sw.lng)]
  ];
 }
 if(Array.isArray(s.lockedAreaPoints)){
  return s.lockedAreaPoints.map(p=>[
   Number(p.lat??p[0]),Number(p.lng??p[1])
  ]).filter(p=>p.every(Number.isFinite));
 }
 return [];
}

function insidePolygon(lat,lng,points){
 const area=db.settings.lockedArea||db.settings.areaLock||{};
 if(!area.enabled||points.length<3)return true;

 let inside=false;
 for(let i=0,j=points.length-1;i<points.length;j=i++){
  const xi=points[i][1],yi=points[i][0];
  const xj=points[j][1],yj=points[j][0];
  const cross=((yi>lat)!==(yj>lat))&&
   (lng<(xj-xi)*(lat-yi)/(yj-yi)+xi);
  if(cross)inside=!inside;
 }
 return inside;
}

function drawAreaBoundary(){
 const area=db.settings.lockedArea||db.settings.areaLock||{};
 const points=getAreaPoints();
 if(area.enabled&&points.length>=3){
  areaLayer=L.polygon(points,{
   color:area.color||"#eab308",
   weight:Number(area.weight)||3,
   opacity:.95,
   fill:false,
   dashArray:"8 6",
   interactive:false
  }).addTo(map);
 }
}

function getPopup(item){
 const extra=getExtraData(item);
 const phone=value(item,["phone","Phone"],extra.phone||"—");
 const address=value(item,["address","Address"],extra.address||"—");
 const locationNumber=value(item,["locationNumber","Location Number"],"—");

 return `
 <b>${escapeHTML(locationName(item))}</b><br>
 Type: ${escapeHTML(locationType(item))}<br>
 Location No: ${escapeHTML(locationNumber)}<br>
 Phone: ${escapeHTML(phone)}<br>
 Address: ${escapeHTML(address)}
 `;
}

function drawMarkers(){
 const hidden=Array.isArray(db.settings.hiddenTypes)?db.settings.hiddenTypes:[];
 const areaPoints=getAreaPoints();
 const markerSize=Math.max(20,Math.min(64,Number(db.settings.markerSize)||34));

 db.locations.filter(isValidLocation).forEach(item=>{
  const type=locationType(item);

  if(hidden.includes(type))return;
  if(!insidePolygon(latitude(item),longitude(item),areaPoints))return;

  const icon=L.divIcon({
   className:"",
   html:`<div class="map-marker" style="
    width:${markerSize}px;
    height:${markerSize}px;
    background:${escapeHTML(getTypeColor(item))};
   ">${escapeHTML(getTypeIcon(item))}</div>`,
   iconSize:[markerSize,markerSize],
   iconAnchor:[markerSize/2,markerSize/2]
  });

  const marker=L.marker([latitude(item),longitude(item)],{
   icon,
   keyboard:false
  }).addTo(map);

  marker.bindPopup(getPopup(item));

  if(db.settings.showMarkerLabels!==false){
   marker.bindTooltip(escapeHTML(locationName(item)),{
    permanent:true,
    direction:"top",
    offset:[0,-markerSize/2-5],
    className:"map-label"
   });
  }
  markerLayers.push(marker);
 });
}

function findLocation(key){
 return db.locations.find(item=>{
  const values=[
   locationId(item),
   locationName(item),
   String(value(item,["locationNumber","Location Number"],""))
  ];
  return values.some(v=>v!==""&&String(v)===String(key));
 });
}

function getConnectionStyle(type){
 const s=db.settings;
 const key=String(type||"Wire").toLowerCase();
 const defaults={
  wire:{color:"#f59e0b",weight:3,opacity:.9,style:"solid"},
  fiber:{color:"#16a3fa",weight:4,opacity:.95,style:"solid"},
  drop:{color:"#d946ef",weight:2,opacity:.9,style:"dashed"}
 };
 const d=defaults[key]||defaults.wire;
 const style=s[key+"Style"]||d.style;
 return {
  color:s[key+"Color"]||d.color,
  weight:Number(s[key+"Weight"])||d.weight,
  opacity:Number(s[key+"Opacity"]??d.opacity),
  dashArray:style==="dashed"?"8 7":style==="dotted"?"2 7":null
 };
}

function drawConnections(){
 if(db.settings.showWires===false)return;

 db.connections.forEach(connection=>{
  const type=String(value(connection,["type","Type"],"Wire"));
  const key=type.toLowerCase();

  if(db.settings[key+"Visible"]===false)return;

  const from=findLocation(value(connection,["from","From","fromId","source"],""));
  const to=findLocation(value(connection,["to","To","toId","target"],""));

  if(!from||!to||!isValidLocation(from)||!isValidLocation(to))return;

  const style=getConnectionStyle(type);
  const points=[
   [latitude(from),longitude(from)],
   [latitude(to),longitude(to)]
  ];

  const line=L.polyline(points,style).addTo(map);
  line.bindPopup(`
   <b>${escapeHTML(value(connection,["name","Name"],type+" Connection"))}</b><br>
   ${escapeHTML(locationName(from))} → ${escapeHTML(locationName(to))}<br>
   Type: ${escapeHTML(type)}
  `);
  connectionLayers.push(line);

  if(db.settings.showConnectionArrows!==false&&L.polylineDecorator){
   const arrow=L.polylineDecorator(line,{
    patterns:[{
     offset:"50%",
     repeat:0,
     symbol:L.Symbol.arrowHead({
      pixelSize:10,
      polygon:true,
      pathOptions:{
       color:style.color,
       fillOpacity:1,
       weight:1
      }
     })
    }]
   }).addTo(map);
   connectionLayers.push(arrow);
  }
 });
}

function renderMap(){
 clearMapLayers();
 drawAreaBoundary();
 drawConnections();
 drawMarkers();

 const allLayers=[...markerLayers,...connectionLayers.filter(x=>typeof x.getBounds==="function")];

 if(allLayers.length){
  const group=L.featureGroup(allLayers);
  const bounds=group.getBounds();
  if(bounds.isValid()){
   map.fitBounds(bounds.pad(.12),{maxZoom:16});
  }
 }else{
  map.setView([
   Number(db.settings.centerLat)||22.3569,
   Number(db.settings.centerLng)||91.7832
  ],Number(db.settings.zoomLevel)||12);
 }

 setTimeout(()=>map.invalidateSize(),250);
}

async function loadMap(){
 try{
  const response=await fetch(API_URL+"?action=getMapData&t="+Date.now());
  if(!response.ok)throw new Error("Server error");
  normalizeData(await response.json());
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
 }catch(error){
  const saved=localStorage.getItem(STORAGE_KEY);
  if(saved){
   normalizeData(JSON.parse(saved));
  }else{
   document.getElementById("loading").textContent="Map data could not be loaded.";
   return;
  }
 }

 createMap();
 renderMap();
 document.getElementById("loading").classList.add("hide");
}

loadMap();
</script>
</body>
</html>
