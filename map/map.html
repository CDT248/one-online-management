
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network Map | ONE ONLINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --bg:#0b1220;
  --panel:#111c2e;
  --panel2:#172338;
  --text:#e8f0fc;
  --muted:#91a2bb;
  --line:#283950;
  --primary:#168b68;
}
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{overflow:hidden}

button,input,select{font:inherit}
button{cursor:pointer}

/* PAGE */

.map-page{
  width:100%;
  height:100%;
  min-height:400px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */

.map-header{
  min-height:72px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
  gap:12px;
  flex-wrap:wrap;
  z-index:600;
}

.header-left{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.map-brand{
  font-size:18px;
  font-weight:800;
  white-space:nowrap;
}

.map-brand span{color:#21bd91}

/* COUNTS */

.map-counts{
  display:flex;
  align-items:center;
  gap:8px;
}

.count-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 11px;
  border-radius:8px;
  background:var(--panel2);
  border:1px solid var(--line);
  min-width:90px;
}

.count-icon{
  width:29px;
  height:29px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:7px;
  font-size:15px;
}

.count-item small{
  display:block;
  font-size:10px;
  color:var(--muted);
}

.count-item strong{
  display:block;
  font-size:17px;
  margin-top:2px;
}

.count-pole .count-icon{
  background:#2563eb30;
  color:#60a5fa;
}

.count-customer .count-icon{
  background:#16a36a30;
  color:#34d399;
}

.count-box .count-icon{
  background:#db8b2030;
  color:#fbbf24;
}

/* BUTTONS */

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 13px;
  background:#168b68;
  color:white;
  font-weight:600;
  font-size:12px;
  white-space:nowrap;
}

.btn.blue{background:#2879d4}
.btn.orange{background:#b87919}
.btn.secondary{background:#293b53}
.btn.danger{background:#bd3942}
.btn:hover{filter:brightness(1.12)}

.btn.small{
  padding:8px 10px;
  font-size:12px;
}

/* MAP */

.map-area{
  flex:1;
  min-height:0;
  position:relative;
  width:100%;
  background:#dce6e9;
}

#map{
  width:100%;
  height:100%;
  background:#dce6e9;
}

/* MAP HINT */

.map-hint{
  position:absolute;
  z-index:500;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111c2ef2;
  color:white;
  border-radius:9px;
  padding:11px 16px;
  font-size:12px;
  display:none;
  text-align:center;
  max-width:90%;
}

/* MARKERS */

.marker{
  width:35px;
  height:35px;
  border-radius:50%;
  border:3px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:17px;
  box-shadow:0 2px 8px #0007;
}

.pole-marker{background:#2563eb}
.customer-marker{background:#16a36a}
.box-marker{background:#db8b20}

/* MODALS */

.modal{
  display:none;
  position:fixed;
  z-index:3000;
  inset:0;
  background:#000b;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{display:flex}

.modal-content{
  width:100%;
  max-width:490px;
  max-height:90%;
  overflow-y:auto;
  background:#111c2e;
  border:1px solid #35465e;
  border-radius:15px;
  padding:20px;
  box-shadow:0 20px 60px #0008;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.modal-head h3{
  margin:0;
  font-size:19px;
}

.close{
  border:0;
  background:#293950;
  color:white;
  width:32px;
  height:32px;
  border-radius:8px;
}

.form-group{margin-bottom:13px}

.form-group label{
  display:block;
  font-size:12px;
  color:#b5c5d9;
  margin-bottom:6px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:11px;
  background:#1c2b41;
  color:white;
  border:1px solid #3a4b62;
  border-radius:8px;
  outline:none;
}

.form-group input:focus,
.form-group select:focus{
  border-color:#1cba8a;
}

.form-group select option{
  background:#1c2b41;
  color:white;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.form-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.form-actions button{flex:1}

.info-line{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.info-line span{color:var(--muted)}

.info-line strong{
  text-align:right;
  overflow-wrap:anywhere;
}

.info-actions{
  display:flex;
  gap:8px;
  margin-top:16px;
  flex-wrap:wrap;
}

.info-actions button{flex:1}

.menu-option{
  width:100%;
  margin-bottom:10px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#1c2b41;
  color:white;
  text-align:left;
  font-weight:700;
}

.menu-option:hover{border-color:#168b68}

.menu-option small{
  display:block;
  color:#9eb0c6;
  margin-top:5px;
  font-weight:400;
}

.section-label{
  font-size:11px;
  font-weight:700;
  color:#91a2bb;
  letter-spacing:1px;
  margin:17px 0 7px;
}

.empty{
  color:var(--muted);
  font-size:12px;
  padding:10px 0;
}

/* MOBILE */

@media(max-width:950px){

  .map-header{
    align-items:flex-start;
  }

  .header-left{
    gap:10px;
  }

}

@media(max-width:650px){

  .map-header{
    padding:9px;
    gap:9px;
  }

  .header-left{
    width:100%;
    justify-content:space-between;
  }

  .map-brand{
    font-size:15px;
  }

  .map-counts{
    gap:5px;
  }

  .count-item{
    min-width:0;
    padding:6px;
    gap:5px;
  }

  .count-icon{
    width:24px;
    height:24px;
    font-size:12px;
  }

  .count-item small{font-size:9px}
  .count-item strong{font-size:14px}

  .header-actions{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
  }

  .header-actions .btn{
    padding:9px 4px;
    font-size:10px;
    white-space:normal;
  }

  .form-row{
    grid-template-columns:1fr;
  }

  .modal-content{
    padding:16px;
  }
}
</style>
</head>

<body>

<div class="map-page">

  <!-- HEADER -->
  <header class="map-header">

    <div class="header-left">

      <div class="map-brand">
        <span>ONE</span> ONLINE | NETWORK MAP
      </div>

      <!-- TOTAL COUNTS -->
      <div class="map-counts">

        <div class="count-item count-pole">
          <div class="count-icon">⚡</div>
          <div>
            <small>POLES</small>
            <strong id="poleCount">0</strong>
          </div>
        </div>

        <div class="count-item count-customer">
          <div class="count-icon">👤</div>
          <div>
            <small>CUSTOMERS</small>
            <strong id="customerCount">0</strong>
          </div>
        </div>

        <div class="count-item count-box">
          <div class="count-icon">▣</div>
          <div>
            <small>SUB BOX</small>
            <strong id="boxCount">0</strong>
          </div>
        </div>

      </div>

    </div>

    <!-- ALL ACTION BUTTONS IN HEADER -->
    <div class="header-actions">

      <button class="btn secondary" onclick="resetView()">
        ↗ Reset Map
      </button>

      <button class="btn" onclick="startAddPole()">
        + Pole
      </button>

      <button class="btn blue" onclick="startAddCustomer()">
        + Customer
      </button>

      <button class="btn orange" onclick="startAddBox()">
        + Sub Box
      </button>

    </div>

  </header>

  <!-- CLEAN MAP -->
  <main class="map-area">

    <div id="map"></div>

    <div class="map-hint" id="mapHint"></div>

  </main>

</div>

<!-- POLE MODAL -->

<div class="modal" id="poleModal">
 <div class="modal-content">

  <div class="modal-head">
   <h3 id="poleModalTitle">Add New Pole</h3>
   <button class="close" onclick="closeModal('poleModal')">✕</button>
  </div>

  <form id="poleForm">

   <input type="hidden" id="poleId">

   <div class="form-group">
    <label>Pole Name / Number</label>
    <input id="poleName" required placeholder="Example: POLE-001">
   </div>

   <div class="form-group">
    <label>Pole Address</label>
    <input id="poleAddress" placeholder="Pole Address">
   </div>

   <div class="form-row">
    <div class="form-group">
     <label>Latitude</label>
     <input id="poleLat" type="number" step="any" required>
    </div>

    <div class="form-group">
     <label>Longitude</label>
     <input id="poleLng" type="number" step="any" required>
    </div>
   </div>

   <div class="form-actions">
    <button type="button" class="btn secondary" onclick="closeModal('poleModal')">Cancel</button>
    <button class="btn">Save Pole</button>
   </div>

  </form>

 </div>
</div>

<!-- CUSTOMER MODAL -->

<div class="modal" id="customerModal">
 <div class="modal-content">

  <div class="modal-head">
   <h3 id="customerModalTitle">Add Customer</h3>
   <button class="close" onclick="closeModal('customerModal')">✕</button>
  </div>

  <form id="customerForm">

   <input type="hidden" id="customerId">

   <div class="form-group">
    <label>Customer Name</label>
    <input id="customerName" required placeholder="Customer Name">
   </div>

   <div class="form-row">
    <div class="form-group">
     <label>Customer IP</label>
     <input id="customerIP" placeholder="192.168.1.10">
    </div>

    <div class="form-group">
     <label>Connection Type</label>
     <select id="customerType">
      <option value="Fiber">Fiber</option>
      <option value="UTP Cable">UTP Cable</option>
      <option value="Wireless">Wireless</option>
     </select>
    </div>
   </div>

   <div class="form-group">
    <label>Customer Address</label>
    <input id="customerAddress" placeholder="Customer Address">
   </div>

   <div class="form-group">
    <label>Connect Through</label>
    <select id="customerSourceType" onchange="updateCustomerSourceOptions()">
     <option value="pole">Pole</option>
     <option value="box">Sub Box</option>
    </select>
   </div>

   <div class="form-group">
    <label>Connected Pole / Sub Box</label>
    <select id="customerSource" required></select>
   </div>

   <div class="form-row">
    <div class="form-group">
     <label>Latitude</label>
     <input id="customerLat" type="number" step="any" required>
    </div>

    <div class="form-group">
     <label>Longitude</label>
     <input id="customerLng" type="number" step="any" required>
    </div>
   </div>

   <div class="form-actions">
    <button type="button" class="btn secondary" onclick="closeModal('customerModal')">Cancel</button>
    <button class="btn">Save Customer</button>
   </div>

  </form>

 </div>
</div>

<!-- SUB BOX MODAL -->

<div class="modal" id="boxModal">
 <div class="modal-content">

  <div class="modal-head">
   <h3 id="boxModalTitle">Add Sub Box</h3>
   <button class="close" onclick="closeModal('boxModal')">✕</button>
  </div>

  <form id="boxForm">

   <input type="hidden" id="boxId">

   <div class="form-group">
    <label>Box Name</label>
    <input id="boxName" required placeholder="Example: BOX-001">
   </div>

   <div class="form-row">
    <div class="form-group">
     <label>Fiber Name</label>
     <input id="fiberName" placeholder="Fiber Name">
    </div>

    <div class="form-group">
     <label>Fiber Code</label>
     <input id="fiberCode" placeholder="Fiber Code">
    </div>
   </div>

   <div class="form-group">
    <label>Fiber Meter</label>
    <input id="fiberMeter" type="number" min="0" placeholder="Fiber Meter">
   </div>

   <div class="form-group">
    <label>Connected Pole</label>
    <select id="boxPole" required></select>
   </div>

   <div class="form-row">
    <div class="form-group">
     <label>Latitude</label>
     <input id="boxLat" type="number" step="any" required>
    </div>

    <div class="form-group">
     <label>Longitude</label>
     <input id="boxLng" type="number" step="any" required>
    </div>
   </div>

   <div class="form-actions">
    <button type="button" class="btn secondary" onclick="closeModal('boxModal')">Cancel</button>
    <button class="btn">Save Sub Box</button>
   </div>

  </form>

 </div>
</div>

<!-- INFORMATION MODAL -->

<div class="modal" id="infoModal">
 <div class="modal-content">

  <div class="modal-head">
   <h3 id="infoTitle">Information</h3>
   <button class="close" onclick="closeModal('infoModal')">✕</button>
  </div>

  <div id="infoContent"></div>
  <div class="info-actions" id="infoActions"></div>

 </div>
</div>

<!-- ADD MENU -->

<div class="modal" id="addMenu">
 <div class="modal-content" style="max-width:350px">

  <div class="modal-head">
   <h3>Add to Pole</h3>
   <button class="close" onclick="closeModal('addMenu')">✕</button>
  </div>

  <button class="menu-option" onclick="openCustomerFromPole()">
   👤 Add Customer
   <small>Connect a customer to this pole</small>
  </button>

  <button class="menu-option" onclick="openBoxFromPole()">
   📦 Add Sub Box
   <small>Create a new fiber distribution box</small>
  </button>

 </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ====================================
   ONE ONLINE NETWORK MAP DEMO
==================================== */

const STORAGE_KEY="one_online_network_map_demo_v2";

let data={
  poles:[],
  customers:[],
  boxes:[]
};

let map;
let markers={};
let connectionLines=[];
let activePoleId=null;
let selectedInfo=null;
let addMode=null;

/* HELPERS */

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function saveData(){

  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  }catch(e){
    alert("Data Save করা যায়নি। Browser Storage চেক করুন।");
  }

  renderAll();
}

function loadData(){

  try{
    const saved=localStorage.getItem(STORAGE_KEY);

    if(saved){
      const parsed=JSON.parse(saved);

      if(Array.isArray(parsed.poles)&&
         Array.isArray(parsed.customers)&&
         Array.isArray(parsed.boxes)){
        data=parsed;
      }
    }

  }catch(e){
    console.error(e);
  }
}

function getEntity(type,id){

  if(type==="pole")return data.poles.find(x=>x.id===id);
  if(type==="customer")return data.customers.find(x=>x.id===id);
  if(type==="box")return data.boxes.find(x=>x.id===id);
}

/* MAP */

map=L.map("map").setView([22.3569,91.7832],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:20,
  attribution:"&copy; OpenStreetMap contributors"
}).addTo(map);

function markerIcon(type){

  let cls="pole-marker";
  let icon="⚡";

  if(type==="customer"){
    cls="customer-marker";
    icon="👤";
  }

  if(type==="box"){
    cls="box-marker";
    icon="▣";
  }

  return L.divIcon({
    className:"",
    html:`<div class="marker ${cls}">${icon}</div>`,
    iconSize:[35,35],
    iconAnchor:[17,17]
  });
}

/* MARKERS */

function clearMapObjects(){

  Object.values(markers).forEach(m=>map.removeLayer(m));
  markers={};

  connectionLines.forEach(l=>map.removeLayer(l));
  connectionLines=[];
}

function addMarker(type,item){

  const marker=L.marker([Number(item.lat),Number(item.lng)],{
    draggable:true,
    icon:markerIcon(type)
  }).addTo(map);

  marker.on("click",()=>{
    if(addMode)return;
    showInfo(type,item.id);
  });

  marker.on("dragend",e=>{

    const pos=e.target.getLatLng();
    const entity=getEntity(type,item.id);

    if(!entity)return;

    entity.lat=pos.lat;
    entity.lng=pos.lng;

    saveData();
  });

  markers[type+"_"+item.id]=marker;
}

/* CONNECTIONS */

function connectionColor(type){

  if(type==="UTP Cable")return "#e59a27";
  if(type==="Wireless")return "#a855f7";

  return "#16a36a";
}

function renderConnections(){

  data.boxes.forEach(b=>{

    const pole=getEntity("pole",b.poleId);
    if(!pole)return;

    const line=L.polyline([
      [pole.lat,pole.lng],
      [b.lat,b.lng]
    ],{
      color:"#16a36a",
      weight:3,
      opacity:.9
    }).addTo(map);

    connectionLines.push(line);
  });

  data.customers.forEach(c=>{

    let source=null;

    if(c.sourceType==="box"){
      source=getEntity("box",c.sourceId);
    }else{
      source=getEntity("pole",c.sourceId);
    }

    if(!source)return;

    const line=L.polyline([
      [source.lat,source.lng],
      [c.lat,c.lng]
    ],{
      color:connectionColor(c.type),
      weight:2.5,
      opacity:.9,
      dashArray:c.type==="Wireless"?"7,7":null
    }).addTo(map);

    connectionLines.push(line);
  });
}

/* RENDER */

function renderAll(){

  if(!map)return;

  clearMapObjects();

  data.poles.forEach(p=>addMarker("pole",p));
  data.boxes.forEach(b=>addMarker("box",b));
  data.customers.forEach(c=>addMarker("customer",c));

  renderConnections();
  updateStats();
}

/* MAP CLICK */

map.on("click",e=>{

  if(!addMode)return;

  const pos=e.latlng;

  if(addMode==="pole"){

    resetPoleForm();

    document.getElementById("poleLat").value=pos.lat.toFixed(7);
    document.getElementById("poleLng").value=pos.lng.toFixed(7);

    openModal("poleModal");
  }

  if(addMode==="customer"){

    resetCustomerForm();

    document.getElementById("customerLat").value=pos.lat.toFixed(7);
    document.getElementById("customerLng").value=pos.lng.toFixed(7);

    openModal("customerModal");
  }

  if(addMode==="box"){

    resetBoxForm();

    document.getElementById("boxLat").value=pos.lat.toFixed(7);
    document.getElementById("boxLng").value=pos.lng.toFixed(7);

    openModal("boxModal");
  }

  cancelAddMode();
});

/* ADD MODES */

function startAddPole(){

  addMode="pole";
  showHint("Pole বসানোর জন্য Map-এর যেকোনো জায়গায় ক্লিক করুন");
}

function startAddCustomer(){

  if(!data.poles.length){
    alert("প্রথমে একটি Pole Add করুন।");
    return;
  }

  addMode="customer";
  showHint("Customer Location নির্বাচন করতে Map-এ ক্লিক করুন");
}

function startAddBox(){

  if(!data.poles.length){
    alert("প্রথমে একটি Pole Add করুন।");
    return;
  }

  addMode="box";
  showHint("Sub Box Location নির্বাচন করতে Map-এ ক্লিক করুন");
}

function showHint(msg){

  const h=document.getElementById("mapHint");

  h.textContent=msg;
  h.style.display="block";
}

function cancelAddMode(){

  addMode=null;
  document.getElementById("mapHint").style.display="none";
}

/* MODAL */

function openModal(id){
  document.getElementById(id).classList.add("show");
}

function closeModal(id){

  document.getElementById(id).classList.remove("show");

  if(["poleModal","customerModal","boxModal"].includes(id)){
    cancelAddMode();
  }
}

document.querySelectorAll(".modal").forEach(modal=>{

  modal.addEventListener("click",e=>{

    if(e.target===modal){
      closeModal(modal.id);
    }

  });
});

/* POLE */

function resetPoleForm(){

  document.getElementById("poleForm").reset();
  document.getElementById("poleId").value="";

  document.getElementById("poleModalTitle").textContent="Add New Pole";
}

document.getElementById("poleForm").addEventListener("submit",e=>{

  e.preventDefault();

  const id=document.getElementById("poleId").value;
  const old=getEntity("pole",id);

  const item={
    id:id||uid(),
    name:document.getElementById("poleName").value.trim(),
    address:document.getElementById("poleAddress").value.trim(),
    lat:Number(document.getElementById("poleLat").value),

/* CUSTOMER */

function updateCustomerSourceOptions(){

  const type=document.getElementById("customerSourceType").value;
  const select=document.getElementById("customerSource");

  select.innerHTML="";

  if(type==="pole"){

    data.poles.forEach(p=>{
      select.innerHTML+=`<option value="${esc(p.id)}">${esc(p.name)}</option>`;
    });

  }else{

    data.boxes.forEach(b=>{
      select.innerHTML+=`<option value="${esc(b.id)}">${esc(b.name)}</option>`;
    });

  }
}

function resetCustomerForm(){

  document.getElementById("customerModalTitle").textContent="Add Customer";

/* INFORMATION */

function infoRow(label,value){

  return `
    <div class="info-line">
      <span>${esc(label)}</span>
      <strong>${esc(value)}</strong>
    </div>
  `;
}

function showInfo(type,id){

  const item=getEntity(type,id);
  if(!item)return;

  selectedInfo={type,id};

  let html="";
  let actions="";

  if(type==="pole"){

    const customers=data.customers.filter(c=>c.poleId===id);
    const boxes=data.boxes.filter(b=>b.poleId===id);

    document.getElementById("infoTitle").textContent="Pole Information";

    html=`
      ${infoRow("Pole Name",item.name)}
      ${infoRow("Pole Address",item.address||"-")}
      ${infoRow("Latitude",item.lat)}
      ${infoRow("Longitude",item.lng)}
      ${infoRow("Total Customer",customers.length)}
      ${infoRow("Total Sub Box",boxes.length)}

      <div class="section-label">CONNECTED CUSTOMERS</div>

      ${customers.map(c=>`
        <div class="info-line">
          <strong>${esc(c.name)}</strong>
          <span>${esc(c.ip||"-")}</span>
        </div>
      `).join("")||'<div class="empty">No Customer Connected</div>'}

      <div class="section-label">CONNECTED SUB BOXES</div>

      ${boxes.map(b=>`
        <div class="info-line">
          <strong>${esc(b.name)}</strong>
          <span>${esc(b.fiberCode||"-")}</span>
        </div>
      `).join("")||'<div class="empty">No Sub Box Connected</div>'}
    `;

    actions=`
      <button class="btn" onclick="showAddMenu('${id}')">+ Add</button>
      <button class="btn blue" onclick="editPole('${id}')">Edit Pole</button>
      <button class="btn danger" onclick="deleteEntity('pole','${id}')">Delete</button>
    `;
  }

  if(type==="customer"){

    const source=getEntity(item.sourceType||"pole",item.sourceId||item.poleId);

    document.getElementById("infoTitle").textContent="Customer Information";

    html=`
      ${infoRow("Customer Name",item.name)}
      ${infoRow("Customer IP",item.ip||"-")}
      ${infoRow("Customer Address",item.address||"-")}
      ${infoRow("Connection Type",item.type)}
      ${infoRow("Connected Through",item.sourceType==="box"?"Sub Box":"Pole")}
      ${infoRow("Connected Device",source?source.name:"-")}
      ${infoRow("Latitude",item.lat)}
      ${infoRow("Longitude",item.lng)}
    `;

    actions=`
      <button class="btn blue" onclick="editCustomer('${id}')">Edit Customer</button>
      <button class="btn danger" onclick="deleteEntity('customer','${id}')">Delete</button>
    `;
  }

  if(type==="box"){

    const pole=getEntity("pole",item.poleId);

    const customers=data.customers.filter(c=>
      c.sourceType==="box"&&c.sourceId===id
    );

    document.getElementById("infoTitle").textContent="Sub Box Information";

    html=`
      ${infoRow("Box Name",item.name)}
      ${infoRow("Fiber Name",item.fiberName||"-")}
      ${infoRow("Fiber Code",item.fiberCode||"-")}
      ${infoRow("Fiber Meter",item.fiberMeter||"-")}
      ${infoRow("Connected Pole",pole?pole.name:"-")}
      ${infoRow("Total Customer",customers.length)}
      ${infoRow("Latitude",item.lat)}
      ${infoRow("Longitude",item.lng)}

      <div class="section-label">CONNECTED CUSTOMERS</div>

      ${customers.map(c=>`
        <div class="info-line">
          <strong>${esc(c.name)}</strong>
          <span>${esc(c.ip||"-")}</span>
        </div>
      `).join("")||'<div class="empty">No Customer Connected</div>'}
    `;

    actions=`
      <button class="btn" onclick="addCustomerToBox('${id}')">+ Customer</button>
      <button class="btn blue" onclick="editBox('${id}')">Edit Box</button>
      <button class="btn danger" onclick="deleteEntity('box','${id}')">Delete</button>
    `;
  }

  document.getElementById("infoContent").innerHTML=html;
  document.getElementById("infoActions").innerHTML=actions;

  if(type==="pole")activePoleId=id;
  else activePoleId=item.poleId;

  openModal("infoModal");
}

/* DELETE */

function deleteEntity(type,id){

  if(!confirm("আপনি কি নিশ্চিতভাবে এটি Delete করতে চান?"))return;

  if(type==="pole"){

    const linkedBoxes=data.boxes.some(b=>b.poleId===id);
    const linkedCustomers=data.customers.some(c=>c.poleId===id);

    if(linkedBoxes||linkedCustomers){
      alert("এই Pole-এর সাথে Customer অথবা Sub Box যুক্ত আছে। আগে Connection সরিয়ে নিন।");
      return;
    }

    data.poles=data.poles.filter(x=>x.id!==id);
  }

  if(type==="customer"){
    data.customers=data.customers.filter(x=>x.id!==id);
  }

  if(type==="box"){

    if(data.customers.some(c=>c.sourceType==="box"&&c.sourceId===id)){
      alert("এই Sub Box-এর সাথে Customer যুক্ত আছে। আগে Customer Connection পরিবর্তন করুন।");
      return;
    }

    data.boxes=data.boxes.filter(x=>x.id!==id);
  }

  closeModal("infoModal");
  saveData();
}

/* RESET MAP */

function resetView(){

  const all=[
    ...data.poles,
    ...data.boxes,
    ...data.customers
  ];

  if(all.length){

    const bounds=L.latLngBounds(
      all.map(x=>[Number(x.lat),Number(x.lng)])
    );

    map.fitBounds(bounds,{
      padding:[45,45],
      maxZoom:17
    });

  }else{

    map.setView([22.3569,91.7832],13);
  }
}
