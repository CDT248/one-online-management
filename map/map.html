
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ONE ONLINE | Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
#map{position:fixed;inset:0;width:100%;height:100%;background:#0b1220}
.map-marker{
 display:flex;align-items:center;justify-content:center;
 background:transparent!important;border:0!important;
 border-radius:0!important;box-shadow:none!important;
 line-height:1;padding:0;margin:0;
 filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));
}
.map-marker img{width:100%;height:100%;object-fit:contain;background:transparent}
.marker-label{
 background:rgba(15,23,42,.88);color:#fff;
 border:1px solid rgba(255,255,255,.25);
 border-radius:5px;padding:2px 6px;font-size:11px;
 font-weight:700;white-space:nowrap;box-shadow:0 2px 7px #0004
}
.leaflet-tooltip.marker-label:before{display:none}
.leaflet-control-attribution{font-size:9px!important}
.leaflet-popup-content-wrapper{border-radius:10px}
.leaflet-popup-content{margin:10px 13px;font-size:13px}
.loading{
 position:fixed;z-index:9999;inset:0;display:flex;
 align-items:center;justify-content:center;
 background:#0b1220;color:white;font:600 14px Arial;
 text-align:center;padding:20px
}
.loading.hide{display:none}
</style>
</head>
<body>
<div id="loading" class="loading">Loading Map...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.min.js"></script>

<script>
"use strict";

const MAP_API="https://script.google.com/macros/s/AKfycbxmDzfnY3LpvfvHjC4usnZiBT4BX4KZIjVoCGcSULikoTKQaC_mj7cbG_zUaiTyZ4sb8w/exec";
const CACHE_KEY="ONE_ONLINE_MAP_DATA_V1";

const DEFAULT_SETTINGS={
 mapType:"road",centerLat:23.8103,centerLng:90.4125,zoomLevel:13,
 markerSize:36,showMarkerLabels:true,showWires:true,hiddenTypes:[],
 wireColor:"#f59e0b",wireWeight:3,wireOpacity:.95,wireStyle:"solid",
 fiberColor:"#2563eb",fiberWeight:4,fiberOpacity:1,fiberStyle:"solid",
 dropColor:"#16a34a",dropWeight:2,dropOpacity:.95,dropStyle:"solid",
 lockedArea:{enabled:false,points:[]},_customTypes:[]
};

let map,markerLayer,connectionLayer,areaLayer,maskLayer;
let allData={locations:[],connections:[],settings:{},customTypes:[]};
let settings={...DEFAULT_SETTINGS};
let activeAreaBounds=null;
let areaMinZoom=null;
let areaLockActive=false;
let mapLayers={};

const $=id=>document.getElementById(id);

function safeJSON(v,f){try{return JSON.parse(v)}catch(e){return f}}

function normalizeData(raw){
 if(raw?.data&&!raw.locations)raw=raw.data;
 return {
  locations:Array.isArray(raw?.locations)?raw.locations:[],
  connections:Array.isArray(raw?.connections)?raw.connections:[],
  settings:raw?.settings&&typeof raw.settings==="object"?raw.settings:{},
  customTypes:Array.isArray(raw?.customTypes)?raw.customTypes:[]
 };
}

function getCache(){
 try{
  const v=localStorage.getItem(CACHE_KEY);
  return v?normalizeData(JSON.parse(v)):null;
 }catch(e){return null}
}

function saveCache(data){
 try{localStorage.setItem(CACHE_KEY,JSON.stringify(data))}catch(e){}
}

function applySettings(){
 settings={...DEFAULT_SETTINGS,...(allData.settings||{})};
 if(!Array.isArray(settings.hiddenTypes))settings.hiddenTypes=[];
 if(!Array.isArray(settings._customTypes))settings._customTypes=[];
 if(!settings.lockedArea)settings.lockedArea={enabled:false,points:[]};
}

function escapeHTML(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function showError(message){
 $("loading").textContent=message;
 $("loading").classList.remove("hide");
}

/* Create map */
function initMap(){
 map=L.map("map",{
  zoomControl:true,
  preferCanvas:true,
  zoomSnap:.5,
  zoomDelta:.5,
  maxZoom:21,
  minZoom:1,
  maxBoundsViscosity:1
 });

 mapLayers.road=L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:21,attribution:"&copy; OpenStreetMap"}
 );

 mapLayers.satellite=L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:20,attribution:"Tiles &copy; Esri"}
 );

 mapLayers.terrain=L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {maxZoom:17,attribution:"&copy; OpenTopoMap"}
 );

 map.createPane("outsideMaskPane");
 map.getPane("outsideMaskPane").style.zIndex=350;
 map.getPane("outsideMaskPane").style.pointerEvents="none";

 markerLayer=L.layerGroup().addTo(map);
 connectionLayer=L.layerGroup().addTo(map);
 areaLayer=L.layerGroup().addTo(map);
 maskLayer=L.layerGroup().addTo(map);

 map.setView([settings.centerLat,settings.centerLng],settings.zoomLevel);
 setMapLayer();

 map.on("zoomend",()=>{
  renderMarkers();
  enforceAreaView();
 });
 map.on("drag",()=>{
  if(areaLockActive&&activeAreaBounds){
   map.panInsideBounds(activeAreaBounds,{animate:false});
  }
 });
}

/* Map layer */
function setMapLayer(){
 if(!map)return;
 Object.values(mapLayers).forEach(layer=>{
  if(map.hasLayer(layer))map.removeLayer(layer);
 });
 (mapLayers[settings.mapType]||mapLayers.road).addTo(map);
}

/* Coordinates */
function getCoordinates(item){
 const lat=Number(item.latitude??item.lat??item.Latitude);
 const lng=Number(item.longitude??item.lng??item.Longitude);
 if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;
 if(lat===0&&lng===0)return null;
 return [lat,lng];
}

function getTypeName(item){
 return String(item.type||item.Type||"Customer");
}

function getTypeConfig(type){
 const custom=[...(allData.customTypes||[]),...(settings._customTypes||[])];
 const found=custom.find(x=>
  String(x.name||x.type||"").toLowerCase()===String(type).toLowerCase()
 );
 if(found)return found;

 const defaults={
  Customer:{icon:"👤",color:"#2563eb"},
  Pole:{icon:"🗼",color:"#f59e0b"},
  Switch:{icon:"🔀",color:"#16a34a"},
  Pull:{icon:"📍",color:"#9333ea"}
 };
 return defaults[type]||{icon:"📍",color:"#64748b"};
}

function getPointIcon(item){
 return item.icon||item.Icon||getTypeConfig(getTypeName(item)).icon||"📍";
}
function getPointName(item){
 return item.name||item.Name||item.customerName||"Unnamed";
}
function getPointNumber(item){
 return item.locationNumber||item.location_number||item["Location Number"]||item.number||"";
}

/* Dynamic icon size */
function getDynamicMarkerSize(){
 const base=Math.max(18,Math.min(64,Number(settings.markerSize)||36));
 const zoom=map.getZoom();
 const scale=Math.pow(2,(zoom-13)*.25);
 return Math.round(Math.max(11,Math.min(40,base*scale)));
}

/* Marker rendering */
function renderMarkers(){
 if(!markerLayer)return;
 markerLayer.clearLayers();

 const hidden=(settings.hiddenTypes||[]).map(x=>String(x).toLowerCase());
 const size=getDynamicMarkerSize();

 allData.locations.forEach(item=>{
  const type=getTypeName(item);
  if(hidden.includes(type.toLowerCase()))return;

  const coords=getCoordinates(item);
  if(!coords)return;

  /* Locked area থাকলে বাইরে Marker দেখাবে না */
  if(areaLockActive&&activeAreaBounds&&!activeAreaBounds.contains(coords))return;

  const icon=L.divIcon({
   className:"",
   html:`<div class="map-marker" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.78)}px">${escapeHTML(getPointIcon(item))}</div>`,
   iconSize:[size,size],
   iconAnchor:[size/2,size/2]
  });

  const marker=L.marker(coords,{icon});
  const name=getPointName(item);
  const number=getPointNumber(item);

  marker.bindPopup(`
   <div>
    <b>${escapeHTML(name)}</b><br>
    Type: ${escapeHTML(type)}
    ${number?`<br>Location Number: ${escapeHTML(number)}`:""}
    <br>Lat: ${coords[0]}<br>Lng: ${coords[1]}
   </div>
  `);

  if(settings.showMarkerLabels){
   marker.bindTooltip(escapeHTML(number||name),{
    permanent:true,direction:"bottom",
    offset:[0,Math.round(size/2)],className:"marker-label"
   });
  }
  marker.addTo(markerLayer);
 });
}

/* Connection style */
function getConnectionStyle(type){
 const t=String(type||"wire").toLowerCase();
 if(t.includes("fiber"))return {
  color:settings.fiberColor,weight:Number(settings.fiberWeight)||4,
  opacity:Number(settings.fiberOpacity)||1,style:settings.fiberStyle
 };
 if(t.includes("drop"))return {
  color:settings.dropColor,weight:Number(settings.dropWeight)||2,
  opacity:Number(settings.dropOpacity)||.95,style:settings.dropStyle
 };
 return {
  color:settings.wireColor,weight:Number(settings.wireWeight)||3,
  opacity:Number(settings.wireOpacity)||.95,style:settings.wireStyle
 };
}

function findLocation(id){
 return allData.locations.find(x=>String(x.id??x.ID)===String(id));
}

function renderConnections(){
 connectionLayer.clearLayers();
 if(settings.showWires===false)return;

 (allData.connections||[]).forEach(c=>{
  const from=findLocation(c.from??c.fromId);
  const to=findLocation(c.to??c.toId);
  if(!from||!to)return;

  const a=getCoordinates(from),b=getCoordinates(to);
  if(!a||!b)return;

  /* Locked area-এর বাইরের connection দেখাবে না */
  if(areaLockActive&&activeAreaBounds&&
     (!activeAreaBounds.contains(a)||!activeAreaBounds.contains(b)))return;

  const type=c.type||"Wire";
  const style=getConnectionStyle(type);
  const dash=style.style==="dashed"?"10 8":
             style.style==="dotted"?"2 7":null;

  const line=L.polyline([a,b],{
   color:style.color,weight:style.weight,opacity:style.opacity,
   dashArray:dash,lineCap:"round",lineJoin:"round"
  }).addTo(connectionLayer);

  line.bindPopup(`<b>${escapeHTML(c.name||type)}</b><br>${escapeHTML(type)}`);

  if(L.polylineDecorator){
   L.polylineDecorator(line,{
    patterns:[{
     offset:"75%",repeat:0,
     symbol:L.Symbol.arrowHead({
      pixelSize:10,polygon:true,
      pathOptions:{color:style.color,fillOpacity:style.opacity,weight:1}
     })
    }]
   }).addTo(connectionLayer);
  }
 });
}

/*
 Area outside mask.
 The world polygon has the selected area as a hole.
 This visually hides every region outside the locked polygon.
*/
function renderOutsideMask(points){
 maskLayer.clearLayers();
 if(!points||points.length<3)return;

 const outer=[
  [-85,-180],[-85,180],[85,180],[85,-180],[-85,-180]
 ];

 const hole=points.map(p=>[Number(p.lat),Number(p.lng)]).reverse();

 L.polygon([outer,hole],{
  pane:"outsideMaskPane",
  stroke:false,
  fill:true,
  fillColor:"#0b1220",
  fillOpacity:.98,
  fillRule:"evenodd",
  interactive:false
 }).addTo(maskLayer);
}

/* Area lock engine */
function disableAreaLock(){
 areaLockActive=false;
 activeAreaBounds=null;
 areaMinZoom=null;

 map.setMaxBounds(null);
 map.setMinZoom(1);

 maskLayer.clearLayers();
 areaLayer.clearLayers();

 map.options.maxBoundsViscosity=0;
}

function enableAreaLock(points){
 if(!Array.isArray(points)||points.length<3){
  disableAreaLock();
  return false;
 }

 const valid=points.map(p=>[
  Number(p.lat),Number(p.lng)
 ]).filter(p=>
  Number.isFinite(p[0])&&Number.isFinite(p[1])&&
  Math.abs(p[0])<=90&&Math.abs(p[1])<=180
 );

 if(valid.length<3){
  disableAreaLock();
  return false;
 }

 areaLockActive=true;
 activeAreaBounds=L.latLngBounds(valid);

 /*
  Fit the complete locked boundary into the visible map.
  This becomes the minimum allowed zoom level.
 */
 map.invalidateSize({animate:false});

 const fitZoom=map.getBoundsZoom(activeAreaBounds,false);
 areaMinZoom=Math.max(1,Math.min(21,fitZoom));

 map.setMaxBounds(activeAreaBounds);
 map.options.maxBoundsViscosity=1;

 map.setMinZoom(areaMinZoom);

 const currentZoom=map.getZoom();
 const targetZoom=Math.max(areaMinZoom,Math.min(currentZoom,21));

 /*
  Always start by showing the entire locked area.
 */
 map.fitBounds(activeAreaBounds,{
  padding:[4,4],
  animate:false,
  maxZoom:targetZoom
 });

 map.setMinZoom(areaMinZoom);
 map.setMaxBounds(activeAreaBounds);

 renderOutsideMask(valid);

 L.polygon(valid,{
  color:"#ef4444",
  weight:2,
  opacity:.95,
  fill:false,
  interactive:false,
  dashArray:"7 6"
 }).addTo(areaLayer);

 return true;
}

/* Keep viewport inside locked boundary */
function enforceAreaView(){
 if(!areaLockActive||!activeAreaBounds)return;

 if(map.getZoom()<areaMinZoom){
  map.setZoom(areaMinZoom,{animate:false});
 }

 map.panInsideBounds(activeAreaBounds,{animate:false});
}

/* Render area boundary only when unlocked */
function renderArea(){
 areaLayer.clearLayers();
 maskLayer.clearLayers();

 const area=settings.lockedArea||{};
 if(!area.enabled||!Array.isArray(area.points)||area.points.length<3){
  disableAreaLock();
  return;
 }
 enableAreaLock(area.points);
}

/* Full map rendering */
function renderMap(){
 if(!map)return;
 setMapLayer();
 renderArea();
 renderConnections();
 renderMarkers();
}

/* Settings */
function applyAndRender(){
 applySettings();
 renderMap();
}

/* Load Google Sheet */
async function loadData(){
 const cached=getCache();
 if(cached){
  allData=cached;
  applyAndRender();
 }

 try{
  const r=await fetch(MAP_API+"?action=getMapData&v="+Date.now(),{
   method:"GET",cache:"no-store"
  });
  if(!r.ok)throw new Error("API response error");
  allData=normalizeData(await r.json());
  saveCache(allData);
  applyAndRender();
 }catch(e){
  console.error(e);
  if(!cached)showError("Map data load করা যায়নি। Internet/API connection পরীক্ষা করুন।");
 }
 $("loading").classList.add("hide");
}

/* Start map */
initMap();
loadData();

/* Sync data updated from other pages */
window.addEventListener("storage",e=>{
 if(e.key===CACHE_KEY&&e.newValue){
  const updated=safeJSON(e.newValue,null);
  if(updated){
   allData=normalizeData(updated);
   applyAndRender();
  }
 }
});

/* Refresh from server periodically */
setInterval(loadData,60000);

/* Resize safety */
window.addEventListener("resize",()=>{
 if(!map)return;
 map.invalidateSize({animate:false});
 if(areaLockActive)enforceAreaView();
});
</script>
</body>
</html>
