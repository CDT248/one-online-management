<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE ONLINE | Network Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08111f;--panel:#101d30;--panel2:#172840;--line:#293b54;--text:#edf4ff;--muted:#91a4bf;--green:#10b981;--red:#fb626b;--shadow:0 12px 35px #0005}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}
.topbar{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:#0d192b;border-bottom:1px solid var(--line);z-index:500}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;white-space:nowrap}.brand-icon{width:34px;height:34px;border-radius:10px;background:#123d35;display:grid;place-items:center;font-size:18px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{border:1px solid #344963;background:#1a2b43;color:#e8f1ff;border-radius:8px;padding:8px 11px;font-size:11px;font-weight:700}
.btn:hover{filter:brightness(1.15)}.btn.primary{background:#087f5b;border-color:#0c9c70;color:#fff}.btn.danger{background:#44232d;border-color:#733541;color:#ffabb2}.btn.active{background:#075b47;border-color:#10b981}
.status{font-size:10px;color:#9eb1ca;white-space:nowrap}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#e5a23b;margin-right:6px}.status.ok:before{background:#10b981}.status.err:before{background:#fb626b}
.workspace{position:relative;flex:1;min-height:0;display:flex}
#map{height:100%;width:100%;background:#101d2e}
.panel{position:absolute;z-index:450;top:12px;left:12px;width:310px;max-height:calc(100% - 24px);overflow:auto;background:#0e1a2bF2;border:1px solid #34465e;border-radius:13px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.panel-head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head strong{font-size:12px}.panel-body{padding:12px}
.search{width:100%;height:36px;border:1px solid #34465e;border-radius:8px;background:#091525;color:#fff;padding:0 10px;font-size:11px;outline:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{background:#172840;border:1px solid #2b405c;border-radius:8px;padding:9px}.stat b{display:block;font-size:17px}.stat span{font-size:9px;color:var(--muted)}
.node-list{display:grid;gap:6px;margin-top:10px}.node-row{display:flex;align-items:center;gap:9px;padding:9px;background:#14243a;border:1px solid #293d58;border-radius:8px;cursor:pointer}.node-row:hover{border-color:#10b981}.node-emoji{width:29px;height:29px;display:grid;place-items:center;background:#20344e;border-radius:8px;font-size:16px;flex:none}.node-copy{min-width:0;flex:1}.node-copy b{display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node-copy small{font-size:9px;color:var(--muted)}
.empty{padding:18px;text-align:center;color:#8296b1;font-size:11px;border:1px dashed #34465e;border-radius:8px}
.map-tools{position:absolute;z-index:430;right:12px;top:12px;display:grid;gap:7px}.tool{width:39px;height:39px;border:1px solid #40536d;background:#102039ed;color:#fff;border-radius:9px;font-size:16px;box-shadow:0 5px 15px #0004}
.legend{position:absolute;z-index:420;right:12px;bottom:14px;background:#0e1a2bf0;border:1px solid #34465e;border-radius:10px;padding:10px 12px;max-width:210px;font-size:9px;box-shadow:var(--shadow)}.legend-title{font-weight:800;margin-bottom:7px}.legend-row{display:flex;align-items:center;gap:7px;margin:5px 0;color:#c8d5e7}.legend-dot{width:9px;height:9px;border-radius:50%}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#122139;color:#edf4ff}.leaflet-popup-content{margin:10px 12px;font-family:Inter,sans-serif;font-size:11px}.popup-title{font-weight:800;font-size:13px;margin-bottom:5px}.popup-meta{color:#b6c7dc;line-height:1.7}
.modal-bg{position:fixed;inset:0;z-index:1000;background:#000b;display:none;align-items:center;justify-content:center;padding:14px}.modal-bg.show{display:flex}.modal{width:min(480px,100%);max-height:92vh;overflow:auto;background:#122139;border:1px solid #3a506d;border-radius:14px;box-shadow:0 20px 70px #0009;padding:18px}.modal h3{font-size:16px;margin:0 0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;font-weight:700;color:#b9c9dd;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #354a66;background:#091729;color:#f1f6ff;border-radius:8px;padding:9px;font-size:11px;outline:none}.field textarea{min-height:65px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#10b981}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px;flex-wrap:wrap}
.details{font-size:11px;line-height:1.8;color:#c7d5e7}.details b{color:#fff}.toast{position:fixed;z-index:2000;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#17382f;color:#d7fff0;border:1px solid #26765c;padding:11px 16px;border-radius:9px;font-size:11px;font-weight:700;transition:.2s;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:absolute;inset:0;z-index:600;background:#08111fe8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:12px}.spinner{width:30px;height:30px;border:3px solid #344963;border-top-color:#10b981;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.leaflet-div-icon{background:transparent;border:0}.marker{width:31px;height:31px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 3px 10px #0008}.marker span{transform:rotate(45deg);font-size:15px}
@media(max-width:700px){.topbar{height:auto;min-height:56px;padding:8px;align-items:flex-start}.brand{font-size:11px}.top-actions{gap:5px}.btn{padding:7px 8px;font-size:9px}.status{display:none}.panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:38%;}.panel-head{padding:9px 11px}.panel-body{padding:9px}.stats{margin:7px 0}.node-list{grid-template-columns:1fr 1fr;gap:5px}.node-row{padding:6px}.node-emoji{width:25px;height:25px}.map-tools{top:8px;right:8px}.tool{width:34px;height:34px}.legend{right:8px;bottom:calc(38% + 18px);max-width:160px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div id="app">
<header class="topbar">
 <div class="brand"><div class="brand-icon">🗺️</div><div>ONE ONLINE<br><small style="font-size:9px;color:#91a4bf;font-weight:600">NETWORK MAP</small></div></div>
 <div class="top-actions">
  <span id="syncStatus" class="status">Connecting...</span>
  <button class="btn" id="viewModeBtn" onclick="toggleEditMode()">👁 View Mode</button>
  <button class="btn primary" onclick="openAddModal()">＋ Add Location</button>
  <button class="btn" onclick="openConnectionModal()">🔗 Connect</button>
  <button class="btn" onclick="undo()">↶ Undo</button>
  <button class="btn" onclick="redo()">↷ Redo</button>
  <button class="btn" onclick="openSettings()">⚙ Settings</button>
 </div>
</header>
<main class="workspace">
 <div id="map"></div>
 <aside class="panel">
  <div class="panel-head"><strong>📍 Network Locations</strong><button class="btn" style="padding:5px 8px" onclick="loadAll()">↻</button></div>
  <div class="panel-body">
   <input class="search" id="searchBox" placeholder="Search name, IP, code..." oninput="renderNodeList()">
   <div class="stats">
    <div class="stat"><b id="nodeCount">0</b><span>LOCATIONS</span></div>
    <div class="stat"><b id="lineCount">0</b><span>CONNECTIONS</span></div>
    <div class="stat"><b id="customerCount">0</b><span>CUSTOMERS</span></div>
   </div>
   <div id="nodeList" class="node-list"><div class="empty">Loading locations...</div></div>
  </div>
 </aside>
 <div class="map-tools">
  <button class="tool" title="Zoom in" onclick="map.zoomIn()">＋</button>
  <button class="tool" title="Zoom out" onclick="map.zoomOut()">−</button>
  <button class="tool" title="My view" onclick="goDefaultView()">⌖</button>
  <button class="tool" title="Map layers" onclick="cycleLayer()">🌍</button>
  <button class="tool" title="Refresh" onclick="loadAll()">↻</button>
 </div>
 <div class="legend" id="legend"><div class="legend-title">NETWORK LEGEND</div><div id="legendItems"></div></div>
 <div class="loading" id="loading"><div class="spinner"></div><b>Loading Network Map...</b><span style="color:#91a4bf">Connecting to Google Sheets</span></div>
</main>
</div>

<div class="modal-bg" id="nodeModal">
 <div class="modal">
  <h3 id="nodeModalTitle">Add Location</h3>
  <input type="hidden" id="editNodeId">
  <div class="form-grid">
   <div class="field"><label>Location Type *</label><select id="nodeType"></select></div>
   <div class="field"><label>Location Name *</label><input id="nodeName" placeholder="Example: Main Box 01"></div>
   <div class="field"><label>Customer IP</label><input id="nodeIP" placeholder="192.168.1.10"></div>
   <div class="field"><label>Box / Pole Code</label><input id="nodeCode" placeholder="BOX-001"></div>
   <div class="field"><label>Latitude *</label><input id="nodeLat" type="number" step="any" placeholder="22.3569"></div>
   <div class="field"><label>Longitude *</label><input id="nodeLng" type="number" step="any" placeholder="91.7832"></div>
   <div class="field full"><label>Address</label><input id="nodeAddress" placeholder="Location address"></div>
   <div class="field full"><label>Internet Source / Parent</label><select id="nodeParent"><option value="">No parent / independent</option></select></div>
   <div class="field full"><label>Note</label><textarea id="nodeNote" placeholder="Additional information"></textarea></div>
  </div>
  <div class="modal-actions">
   <button class="btn" onclick="chooseOnMap()">📌 Choose on Map</button>
   <button class="btn" onclick="closeModal('nodeModal')">Cancel</button>
   <button class="btn primary" onclick="saveNode()">Save Location</button>
  </div>
 </div>
</div>

<div class="modal-bg" id="detailModal">
 <div class="modal">
  <h3 id="detailTitle">Location Details</h3>
  <div id="detailContent" class="details"></div>
  <div class="modal-actions">
   <button class="btn" onclick="closeModal('detailModal')">Close</button>
   <button class="btn" id="detailEditBtn" onclick="editSelected()">✎ Edit</button>
   <button class="btn danger" id="detailDeleteBtn" onclick="deleteSelected()">Delete</button>
  </div>
 </div>
</div>

<div class="modal-bg" id="lineModal">
 <div class="modal">
  <h3>Connect Locations</h3>
  <div class="form-grid">
   <div class="field"><label>From *</label><select id="lineFrom"></select></div>
   <div class="field"><label>To *</label><select id="lineTo"></select></div>
   <div class="field full"><label>Connection Type</label><select id="lineType"></select></div>
  </div>
  <div class="modal-actions">
   <button class="btn" onclick="closeModal('lineModal')">Cancel</button>
   <button class="btn primary" onclick="saveConnection()">Save Connection</button>
  </div>
 </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

/* Apps Script HTML Service backend */
const BACKEND = {
  load: 'getMapBootstrap',
  saveData: 'saveMapData',
  saveSettings: 'saveMapSettings'
};

const DEFAULT_SETTINGS = {
 view:'road',
 types:[
  {id:'main_box',name:'Main Box',icon:'🗄️',color:'#e74c3c',enabled:true},
  {id:'sub_box',name:'Sub Box',icon:'📦',color:'#2878d0',enabled:true},
  {id:'pole',name:'Pole',icon:'🗼',color:'#e89b21',enabled:true},
  {id:'customer',name:'Customer',icon:'🏠',color:'#12a66a',enabled:true}
 ],
 connectionTypes:[
  {id:'direct',name:'Direct Link',color:'#a855f7',enabled:true},
  {id:'main_fiber',name:'Main Fiber',color:'#ff3030',enabled:true},
  {id:'switch_link',name:'Switch Link',color:'#2878d0',enabled:true},
  {id:'box_link',name:'Box Link',color:'#19d69a',enabled:true},
  {id:'wireless',name:'Wireless',color:'#e6a23c',enabled:true}
 ],
 wire:{color:'#19d69a',width:4,opacity:.95,speed:1.1,animated:true,dotted:true}
};

let map, nodeLayer, lineLayer, layers={}, currentLayer='road';
let nodes=[], connections=[], settings=structuredCloneSafe(DEFAULT_SETTINGS);
let editMode=false, selectedNodeId=null, chooseLocation=false;
let undoStack=[], redoStack=[], saveTimer=null, saving=false, saveAgain=false;
let openingView={lat:22.3569,lng:91.7832,zoom:13};

function structuredCloneSafe(v){return JSON.parse(JSON.stringify(v))}
function byId(id){return document.getElementById(id)}
function toast(msg){const el=byId('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove('show'),2600)}
function setStatus(msg,state=''){const el=byId('syncStatus');el.textContent=msg;el.className='status '+state}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function googleRun(fn,arg){
 return new Promise((resolve,reject)=>{
  if(!window.google||!google.script||!google.script.run){reject(new Error('Google Apps Script connection is unavailable. Open this page using the deployed Web App URL.'));return}
  const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
  if(typeof arg==='undefined') runner[fn](); else runner[fn](arg);
 });
}
function normalizeSettings(s){
 s=s||{};
 return {
  view:['road','satellite','hybrid','network'].includes(s.view)?s.view:'road',
  types:Array.isArray(s.types)?s.types:structuredCloneSafe(DEFAULT_SETTINGS.types),
  connectionTypes:Array.isArray(s.connectionTypes)?s.connectionTypes:structuredCloneSafe(DEFAULT_SETTINGS.connectionTypes),
  wire:Object.assign({},DEFAULT_SETTINGS.wire,s.wire||{})
 };
}

function initMap(){
 map=L.map('map',{zoomControl:false,preferCanvas:true,renderer:L.canvas({padding:.5})}).setView([22.3569,91.7832],13);
 layers.road=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'© OpenStreetMap © CARTO'});
 layers.satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});
 layers.hybrid=L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})
 ]);
 layers.network=L.layerGroup([]);
 layers.road.addTo(map);
 nodeLayer=L.layerGroup().addTo(map);
 lineLayer=L.layerGroup().addTo(map);
 map.on('click',e=>{
  // Map clicks are used by the one-time location picker below.
 });
}

function setLayer(name){
 if(!layers[name])name='road';
 Object.values(layers).forEach(l=>{if(map.hasLayer(l))map.removeLayer(l)});
 if(name==='network'){/* Network-only intentionally has no basemap. */}
 else layers[name].addTo(map);
 currentLayer=name;
 settings.view=name;
}
function cycleLayer(){const names=['road','satellite','hybrid','network'];setLayer(names[(names.indexOf(currentLayer)+1)%names.length]);queueSettingsSave({view:currentLayer});toast('Map style: '+currentLayer)}
function goDefaultView(){map.setView([openingView.lat,openingView.lng],openingView.zoom)}
function openSettings(){const base=location.href.split('?')[0];location.href=base+'?page=map_setting'}

function markerIcon(node){
 const t=settings.types.find(x=>x.id===node.type)||{};
 const color=t.color||'#10b981',emoji=t.icon||'📍';
 return L.divIcon({className:'',html:`<div class="marker" style="background:${esc(color)}"><span>${esc(emoji)}</span></div>`,iconSize:[31,31],iconAnchor:[15,29],popupAnchor:[0,-27]});
}
function getNode(id){return nodes.find(n=>String(n.id)===String(id))}
function nodeName(id){const n=getNode(id);return n?n.name:'Unknown'}
function connectionColor(line){const t=settings.connectionTypes.find(x=>x.id===line.type);return t?.color||settings.wire.color||'#19d69a'}

function renderAll(){
 nodeLayer.clearLayers();lineLayer.clearLayers();
 renderLines();renderMarkers();renderNodeList();renderLegend();updateStats();
}
function renderMarkers(){
 nodes.forEach(n=>{
  if(!Number.isFinite(Number(n.lat))||!Number.isFinite(Number(n.lng)))return;
  const marker=L.marker([Number(n.lat),Number(n.lng)],{icon:markerIcon(n),draggable:editMode});
  marker.bindPopup(`<div class="popup-title">${esc(n.name)}</div><div class="popup-meta">${esc(typeName(n.type))}<br>${n.ip?'IP: '+esc(n.ip)+'<br>':''}${n.code?'Code: '+esc(n.code)+'<br>':''}${n.address?esc(n.address):''}</div>`);
  marker.on('click',()=>showDetails(n.id));
  if(editMode){
   marker.on('dragend',e=>{
    const p=e.target.getLatLng();n.lat=p.lat;n.lng=p.lng;pushHistory();queueDataSave();renderAll();toast('Location moved');
   });
  }
  marker.addTo(nodeLayer);
 });
}
function renderLines(){
 connections.forEach(line=>{
  const a=getNode(line.from),b=getNode(line.to);if(!a||!b)return;
  const pts=[[Number(a.lat),Number(a.lng)]];
  (Array.isArray(line.points)?line.points:[]).forEach(p=>{if(Array.isArray(p)&&p.length>=2)pts.push([Number(p[0]),Number(p[1])])});
  pts.push([Number(b.lat),Number(b.lng)]);
  const color=connectionColor(line),w=Number(settings.wire.width)||4,opacity=Number(settings.wire.opacity??.95);
  const dotted=settings.wire.dotted!==false;
  const path=L.polyline(pts,{color,weight:w,opacity,dashArray:dotted?'3 9':null,lineCap:'round',lineJoin:'round'}).addTo(lineLayer);
  if(settings.wire.animated!==false && currentLayer!=='network'){
   const flow=L.polyline(pts,{color:'#ffffff',weight:Math.max(1,w*.45),opacity:.85,dashArray:'1 16',lineCap:'round'}).addTo(lineLayer);
   let offset=0;const speed=Math.max(.2,Number(settings.wire.speed)||1.1);
   const anim=()=>{if(!map||!map.hasLayer(lineLayer))return;offset-=speed;flow.setStyle({dashOffset:String(offset)});requestAnimationFrame(anim)};
   requestAnimationFrame(anim);
  }
  if(editMode){
   path.on('click',()=>{const action=prompt('Connection edit:\n1 = Add bend at line midpoint\n2 = Delete this connection\nCancel = Close');if(action==='1'){const mid=pts[Math.floor(pts.length/2)];line.points=line.points||[];line.points.push(mid);pushHistory();queueDataSave();renderAll()}else if(action==='2'){if(confirm('Delete this connection?')){connections=connections.filter(x=>x.id!==line.id);pushHistory();queueDataSave();renderAll()}}});
  }
 });
}
function typeName(id){return settings.types.find(t=>t.id===id)?.name||id||'Location'}
function renderLegend(){
 byId('legendItems').innerHTML=settings.types.filter(t=>t.enabled!==false).map(t=>`<div class="legend-row"><span class="legend-dot" style="background:${esc(t.color)}"></span>${esc(t.icon||'📍')} ${esc(t.name)}</div>`).join('')+
 '<div class="legend-row"><span style="width:20px;border-top:3px dashed #19d69a"></span>Connection</div>';
}
function updateStats(){
 byId('nodeCount').textContent=nodes.length;
 byId('lineCount').textContent=connections.length;
 byId('customerCount').textContent=nodes.filter(n=>n.type==='customer').length;
}
function renderNodeList(){
 const q=(byId('searchBox').value||'').toLowerCase();
 const arr=nodes.filter(n=>[n.name,n.ip,n.code,n.address].join(' ').toLowerCase().includes(q));
 if(!arr.length){byId('nodeList').innerHTML='<div class="empty">No locations found.</div>';return}
 byId('nodeList').innerHTML=arr.map(n=>{
  const t=settings.types.find(x=>x.id===n.type)||{};
  return `<div class="node-row" onclick="focusNode('${esc(n.id)}')"><div class="node-emoji">${esc(t.icon||'📍')}</div><div class="node-copy"><b>${esc(n.name)}</b><small>${esc(t.name||n.type)} ${n.ip?'· '+esc(n.ip):''}</small></div></div>`;
 }).join('');
}
function focusNode(id){const n=getNode(id);if(!n)return;map.setView([n.lat,n.lng],17);showDetails(id)}

function showDetails(id){
 selectedNodeId=id;const n=getNode(id);if(!n)return;
 const parent=n.parentId?nodeName(n.parentId):'Independent / Not set';
 byId('detailTitle').textContent=n.name;
 byId('detailContent').innerHTML=
 `<b>Type:</b> ${esc(typeName(n.type))}<br>`+
 `<b>IP:</b> ${esc(n.ip||'—')}<br>`+
 `<b>Code:</b> ${esc(n.code||'—')}<br>`+
 `<b>Internet Source:</b> ${esc(parent)}<br>`+
 `<b>Latitude:</b> ${Number(n.lat).toFixed(7)}<br>`+
 `<b>Longitude:</b> ${Number(n.lng).toFixed(7)}<br>`+
 `<b>Address:</b> ${esc(n.address||'—')}<br>`+
 `<b>Note:</b> ${esc(n.note||'—')}`;
 byId('detailEditBtn').style.display=editMode?'':'none';
 byId('detailDeleteBtn').style.display=editMode?'':'none';
 openModal('detailModal');
}

function toggleEditMode(){
 editMode=!editMode;
 byId('viewModeBtn').textContent=editMode?'✎ Edit Mode':'👁 View Mode';
 byId('viewModeBtn').classList.toggle('active',editMode);
 renderAll();
 toast(editMode?'Edit mode enabled':'View mode enabled');
}
function openModal(id){byId(id).classList.add('show')}
function closeModal(id){byId(id).classList.remove('show')}
document.querySelectorAll('.modal-bg').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('show')}));

function populateNodeForm(){
 const enabled=settings.types.filter(t=>t.enabled!==false);
 byId('nodeType').innerHTML=enabled.map(t=>`<option value="${esc(t.id)}">${esc(t.icon||'📍')} ${esc(t.name)}</option>`).join('');
 byId('nodeParent').innerHTML='<option value="">No parent / independent</option>'+nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.name)} (${esc(typeName(n.type))})</option>`).join('');
}
function openAddModal(){
 if(!editMode){toast('Enable Edit Mode first');return}
 populateNodeForm();byId('nodeModalTitle').textContent='Add Location';byId('editNodeId').value='';
 ['nodeName','nodeIP','nodeCode','nodeLat','nodeLng','nodeAddress','nodeNote'].forEach(id=>byId(id).value='');
 byId('nodeLat').value=map.getCenter().lat.toFixed(7);byId('nodeLng').value=map.getCenter().lng.toFixed(7);
 openModal('nodeModal');
}
function chooseOnMap(){chooseLocation=true;closeModal('nodeModal');toast('Click the map to choose coordinates');map.once('click',e=>{if(!chooseLocation)return;byId('nodeLat').value=e.latlng.lat.toFixed(7);byId('nodeLng').value=e.latlng.lng.toFixed(7);chooseLocation=false;openModal('nodeModal');toast('Coordinates selected')})}
function saveNode(){
 const id=byId('editNodeId').value;
 const node={
  id:id||('node_'+Date.now()),
  type:byId('nodeType').value,
  name:byId('nodeName').value.trim(),
  ip:byId('nodeIP').value.trim(),
  code:byId('nodeCode').value.trim(),
  lat:Number(byId('nodeLat').value),
  lng:Number(byId('nodeLng').value),
  address:byId('nodeAddress').value.trim(),
  parentId:byId('nodeParent').value,
  note:byId('nodeNote').value.trim()
 };
 if(!node.name){toast('Enter location name');return}
 if(!Number.isFinite(node.lat)||!Number.isFinite(node.lng)){toast('Enter valid latitude and longitude');return}
 if(node.parentId===node.id){toast('A location cannot be its own parent');return}
 pushHistory();
 if(id){const i=nodes.findIndex(n=>n.id===id);if(i>=0)nodes[i]=node}
 else nodes.push(node);
 closeModal('nodeModal');renderAll();queueDataSave();toast('Location saved');
}
function editSelected(){
 const n=getNode(selectedNodeId);if(!n)return;
 closeModal('detailModal');populateNodeForm();
 byId('nodeModalTitle').textContent='Edit Location';byId('editNodeId').value=n.id;
 byId('nodeType').value=n.type;byId('nodeName').value=n.name||'';
 byId('nodeIP').value=n.ip||'';byId('nodeCode').value=n.code||'';
 byId('nodeLat').value=n.lat;byId('nodeLng').value=n.lng;
 byId('nodeAddress').value=n.address||'';byId('nodeParent').value=n.parentId||'';
 byId('nodeNote').value=n.note||'';openModal('nodeModal');
}
function deleteSelected(){
 const n=getNode(selectedNodeId);if(!n||!confirm('Delete '+n.name+'?'))return;
 pushHistory();
 const remove=new Set([n.id]);let changed=true;
 while(changed){changed=false;nodes.forEach(x=>{if(x.parentId&&remove.has(x.parentId)&&!remove.has(x.id)){remove.add(x.id);changed=true}})}
 nodes=nodes.filter(x=>!remove.has(x.id));
 connections=connections.filter(x=>!remove.has(x.from)&&!remove.has(x.to));
 closeModal('detailModal');renderAll();queueDataSave();toast('Location deleted');
}

function openConnectionModal(){
 if(!editMode){toast('Enable Edit Mode first');return}
 if(nodes.length<2){toast('Add at least two locations first');return}
 byId('lineFrom').innerHTML=nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.name)}</option>`).join('');
 byId('lineTo').innerHTML=nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.name)}</option>`).join('');
 byId('lineType').innerHTML=settings.connectionTypes.filter(t=>t.enabled!==false).map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');
 byId('lineTo').selectedIndex=nodes.length>1?1:0;
 openModal('lineModal');
}
function saveConnection(){
 const from=byId('lineFrom').value,to=byId('lineTo').value,type=byId('lineType').value;
 if(!from||!to||from===to){toast('Choose two different locations');return}
 if(connections.some(x=>x.from===from&&x.to===to)){toast('This connection already exists');return}
 pushHistory();connections.push({id:'line_'+Date.now(),from,to,type,points:[]});
 closeModal('lineModal');renderAll();queueDataSave();toast('Connection created');
}

function pushHistory(){
 undoStack.push({nodes:structuredCloneSafe(nodes),connections:structuredCloneSafe(connections)});
 if(undoStack.length>60)undoStack.shift();redoStack=[];
}
function undo(){
 if(!undoStack.length){toast('Nothing to undo');return}
 redoStack.push({nodes:structuredCloneSafe(nodes),connections:structuredCloneSafe(connections)});
 const s=undoStack.pop();nodes=s.nodes;connections=s.connections;renderAll();queueDataSave();toast('Undo complete');
}
function redo(){
 if(!redoStack.length){toast('Nothing to redo');return}
 undoStack.push({nodes:structuredCloneSafe(nodes),connections:structuredCloneSafe(connections)});
 const s=redoStack.pop();nodes=s.nodes;connections=s.connections;renderAll();queueDataSave();toast('Redo complete');
}

function queueDataSave(){
 clearTimeout(saveTimer);setStatus('Unsaved changes');
 saveTimer=setTimeout(saveDataNow,500);
}
async function saveDataNow(){
 if(saving){saveAgain=true;return}
 saving=true;setStatus('Saving...');
 try{
  const result=await googleRun(BACKEND.saveData,{nodes,connections});
  if(!result||!result.success)throw new Error(result?.message||'Save failed');
  setStatus('All changes saved','ok');
 }catch(e){setStatus('Save failed','err');toast(e.message||'Could not save to Google Sheets')}
 finally{saving=false;if(saveAgain){saveAgain=false;saveDataNow()}}
}
let settingsTimer=null,settingsPending={};
function queueSettingsSave(part){
 settingsPending=Object.assign(settingsPending,part);
 clearTimeout(settingsTimer);
 settingsTimer=setTimeout(async()=>{
  const payload=settingsPending;settingsPending={};
  setStatus('Saving settings...');
  try{
   const result=await googleRun(BACKEND.saveSettings,payload);
   if(!result||!result.success)throw new Error(result?.message||'Settings save failed');
   setStatus('Settings saved','ok');
  }catch(e){setStatus('Settings save failed','err');toast(e.message||'Settings save failed')}
 },350);
}
async function loadAll(){
 byId('loading').style.display='flex';setStatus('Loading...');
 try{
  const result=await googleRun(BACKEND.load);
  if(!result||!result.success)throw new Error(result?.message||'Could not load map');
  nodes=Array.isArray(result.nodes)?result.nodes:[];
  connections=Array.isArray(result.connections)?result.connections:[];
  settings=normalizeSettings(result.settings);
  setLayer(settings.view);
  populateNodeForm();renderAll();
  setStatus('Connected to Google Sheets','ok');
 }catch(e){
  setStatus('Connection error','err');
  toast(e.message||'Could not connect to Google Sheets');
  byId('nodeList').innerHTML='<div class="empty">Could not load map data.<br>Check deployment access and Code.gs.</div>';
 }finally{byId('loading').style.display='none'}
}

function init(){
 initMap();
 loadAll();
 window.addEventListener('beforeunload',()=>{if(saveTimer)saveDataNow()});
}
window.addEventListener('load',init);
</script>
</body>
</html>
