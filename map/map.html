
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE ONLINE Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body,#map{height:100%;width:100%;margin:0;font-family:Arial,sans-serif}
body{overflow:hidden}
#map{background:#e5e7eb}
.leaflet-control-layers{
 border:0!important;border-radius:12px!important;
 box-shadow:0 3px 15px #0003!important;
}
.leaflet-control-layers-expanded{padding:10px 13px!important}
.stats{
 position:absolute;z-index:700;top:12px;left:12px;
 display:flex;gap:7px;max-width:calc(100% - 24px);
 overflow-x:auto;pointer-events:none;
}
.stat{
 min-width:83px;padding:9px 12px;border-radius:10px;
 background:#fff;color:#172033;box-shadow:0 2px 12px #0002;
 text-align:center;white-space:nowrap;
}
.stat b{display:block;font-size:19px}
.stat span{font-size:10px;color:#64748b;font-weight:700}
.brand{
 position:absolute;z-index:700;bottom:15px;left:12px;
 background:#fff;color:#172033;border-radius:10px;
 padding:9px 12px;box-shadow:0 2px 12px #0002;
 font-size:12px;font-weight:800;pointer-events:none;
}
.gps-status{
 position:absolute;z-index:700;right:12px;bottom:15px;
 background:#fff;color:#172033;border-radius:10px;
 padding:9px 12px;box-shadow:0 2px 12px #0002;
 font-size:11px;font-weight:700;max-width:65%;
}
.gps-dot{
 display:inline-block;width:8px;height:8px;border-radius:50%;
 background:#16a34a;margin-right:6px;
}
.only-icon{
 background:transparent;border:0;display:flex;
 justify-content:center;align-items:center;
 font-size:27px;line-height:1;
 filter:drop-shadow(0 1px 2px #0008);
}
.home-icon{
 width:20px;height:20px;border:3px solid white;
 border-radius:50%;background:#1685f8;
 box-shadow:0 0 0 2px #1685f8,0 2px 7px #0005;
}
.my-location{
 width:18px;height:18px;border:3px solid white;
 border-radius:50%;background:#1685f8;
 box-shadow:0 0 0 2px #1685f8,0 0 0 8px #1685f833;
}
.fiber-flow{
 stroke-dasharray:2 12;stroke-linecap:round;
 animation:fiberMove var(--speed,1s) linear infinite;
}
.fiber-flow.reverse{animation-direction:reverse}
@keyframes fiberMove{
 from{stroke-dashoffset:0}
 to{stroke-dashoffset:-28}
}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{
 background:#fff;color:#172033;border-radius:10px
}
.pop-title{font-size:14px;font-weight:800;margin-bottom:5px}
.pop-line{font-size:11px;color:#64748b;margin:3px 0}
.pop-btn{
 border:0;border-radius:7px;background:#1685f8;color:white;
 padding:7px 10px;margin-top:8px;font-weight:700
}
@media(max-width:600px){
 .stats{gap:5px;top:8px;left:7px;max-width:calc(100% - 14px)}
 .stat{min-width:69px;padding:7px 8px}
 .stat b{font-size:16px}
 .stat span{font-size:9px}
 .brand{bottom:10px;left:8px}
 .gps-status{bottom:10px;right:8px}
}
</style>
</head>
<body>

<div id="map"></div>

<div class="stats">
 <div class="stat"><b id="totalCustomer">0</b><span>CUSTOMER</span></div>
 <div class="stat"><b id="totalPull">0</b><span>PULL</span></div>
 <div class="stat"><b id="totalSwitch">0</b><span>SWITCH</span></div>
 <div class="stat"><b id="totalOther">0</b><span>OTHER</span></div>
</div>

<div class="brand">ONE ONLINE · NETWORK MAP</div>
<div class="gps-status" id="gpsStatus">
 <span class="gps-dot"></span>My Location: Waiting...
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API="https://script.google.com/macros/s/AKfycbxmDzfnY3LpvfvHjC4usnZiBT4BX4KZIjVoCGcSULikoTKQaC_mj7cbG_zUaiTyZ4sb8w/exec";
const CACHE="ONE_ONLINE_MAP_DATA_V1";

const DEFAULTS={
 mapType:"road",centerLat:23.8103,centerLng:90.4125,zoomLevel:14,
 markerSize:30,showMarkerLabels:false,showWires:true,hiddenTypes:[],
 wireColor:"#f59e0b",wireWeight:3,wireOpacity:1,wireStyle:"solid",
 fiberColor:"#2563eb",fiberWeight:4,fiberOpacity:1,fiberStyle:"dotted",
 fiberSpeed:1,fiberDashSize:2,fiberDirection:"forward",
 dropColor:"#16a34a",dropWeight:2,dropOpacity:1,dropStyle:"dashed",
 displayArea:{enabled:false,points:[]},
 homePoint:{lat:23.8103,lng:90.4125,zoom:14},
 lockedArea:{enabled:false,points:[]}
};

let map,locations=[],connections=[],settings={...DEFAULTS};
let customTypes=[],markerLayer,connectionLayer,areaLayer;
let myMarker=null,myAccuracy=null,watchId=null;
let mapLayers={},homeMarker=null;

const $=id=>document.getElementById(id);
const val=(o,keys,d="")=>{
 for(const k of keys) if(o && o[k]!==undefined && o[k]!==null && o[k]!=="") return o[k];
 return d;
};
const json=(v,d)=>{try{return typeof v==="string"?JSON.parse(v):v||d}catch(e){return d}};
const typeName=v=>String(v||"").trim().toLowerCase();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function normalizeLocation(r){
 const extra=json(val(r,["dataJson","Data JSON","data_json"],{}),{});
 const x={...extra,...r};
 return {
  ...x,
  id:String(val(x,["id","ID","locationId"],"")),
  name:val(x,["name","Name"],"Unnamed"),
  type:val(x,["type","Type"],"Customer"),
  lat:Number(val(x,["lat","latitude","Latitude"],NaN)),
  lng:Number(val(x,["lng","longitude","Longitude"],NaN)),
  icon:val(x,["icon","Icon"],"📍"),
  color:val(x,["color","Color"],"#2563eb")
 };
}
function normalizeConnection(r){
 return {...r,
  id:String(val(r,["id","ID"],"")),
  from:String(val(r,["from","From"],"")),
  to:String(val(r,["to","To"],"")),
  type:String(val(r,["type","Type"],"wire")).toLowerCase(),
  name:val(r,["name","Name"],"")
 };
}
function typeConfig(type){
 return customTypes.find(x=>typeName(x.name)===typeName(type))
 ||{name:type,icon:"📍",color:"#64748b"};
}
function validPoint(x){
 return Number.isFinite(x.lat)&&Number.isFinite(x.lng)&&
 Math.abs(x.lat)<=90&&Math.abs(x.lng)<=180;
}

function init(){
 map=L.map("map",{zoomControl:true,maxZoom:22,minZoom:3});
 mapLayers.road=L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:22,maxNativeZoom:19,attribution:"© OpenStreetMap"}
 );
 mapLayers.satellite=L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:22,maxNativeZoom:19,attribution:"Tiles © Esri"}
 );
 mapLayers.terrain=L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {maxZoom:17,maxNativeZoom:17,attribution:"© OpenTopoMap"}
 );
 mapLayers.road.addTo(map);
 L.control.layers({
  "Road":mapLayers.road,
  "Satellite":mapLayers.satellite,
  "Terrain":mapLayers.terrain
 },null,{position:"topright",collapsed:true}).addTo(map);

 markerLayer=L.layerGroup().addTo(map);
 connectionLayer=L.layerGroup().addTo(map);
 areaLayer=L.layerGroup().addTo(map);
 loadData();
 startGPS();
 setTimeout(()=>map.invalidateSize(true),300);
}

function applyData(raw){
 const data=raw.data||raw;
 locations=(data.locations||[]).map(normalizeLocation);
 connections=(data.connections||[]).map(normalizeConnection);
 settings={...DEFAULTS,...(data.settings||{})};
 customTypes=[
  {name:"Customer",icon:"👤",color:"#2563eb"},
  {name:"Pull",icon:"📍",color:"#9333ea"},
  {name:"Switch",icon:"🔀",color:"#16a36a"},
  {name:"Pole",icon:"🗼",color:"#f59e0b"},
  ...(data.customTypes||[])
 ];
 (settings._customTypes||[]).forEach(x=>{
  if(!customTypes.some(t=>typeName(t.name)===typeName(x.name)))customTypes.push(x);
 });
 render();
}

async function loadData(){
 try{
  const c=localStorage.getItem(CACHE);
  if(c)applyData(JSON.parse(c));
 }catch(e){}
 try{
  const r=await fetch(API+"?action=getMapData&_="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw Error("API "+r.status);
  const data=await r.json();
  applyData(data);
  localStorage.setItem(CACHE,JSON.stringify(data.data||data));
 }catch(e){
  console.error(e);
  if(!locations.length) $("gpsStatus").textContent="Map data could not load";
 }
}

function iconMarker(loc){
 const cfg=typeConfig(loc.type);
 const icon=loc.icon||cfg.icon||"📍";
 return L.divIcon({
  className:"",
  html:`<div class="only-icon">${esc(icon)}</div>`,
  iconSize:[34,34],iconAnchor:[17,17]
 });
}
function popup(loc){
 return `<div class="pop-title">${esc(loc.name)}</div>
 <div class="pop-line">${esc(loc.type)}</div>
 ${loc.locationNumber?`<div class="pop-line">Location No: ${esc(loc.locationNumber)}</div>`:""}
 <div class="pop-line">${loc.lat}, ${loc.lng}</div>
 <button class="pop-btn" onclick="openGoogle(${loc.lat},${loc.lng})">Open Google Maps</button>`;
}

function renderMarkers(){
 markerLayer.clearLayers();
 const hidden=(settings.hiddenTypes||[]).map(typeName);
 const visible=[];
 locations.forEach(loc=>{
  if(!loc.id||!validPoint(loc)||hidden.includes(typeName(loc.type)))return;
  const m=L.marker([loc.lat,loc.lng],{icon:iconMarker(loc),title:loc.name});
  m.bindPopup(popup(loc));
  m.addTo(markerLayer);
  visible.push(loc);
 });
 $("totalCustomer").textContent=locations.filter(x=>typeName(x.type)==="customer").length;
 $("totalPull").textContent=locations.filter(x=>typeName(x.type)==="pull").length;
 $("totalSwitch").textContent=locations.filter(x=>typeName(x.type)==="switch").length;
 $("totalOther").textContent=locations.filter(x=>!["customer","pull","switch"].includes(typeName(x.type))).length;
 return visible;
}

function getLineStyle(c){
 const t=typeName(c.type);
 if(t.includes("fiber")){
  return {color:settings.fiberColor,weight:+settings.fiberWeight||4,
   opacity:+settings.fiberOpacity,dash:"2 12",fiber:true};
 }
 if(t.includes("drop")){
  return {color:settings.dropColor,weight:+settings.dropWeight||2,
   opacity:+settings.dropOpacity,dash:settings.dropStyle==="solid"?null:"7 7"};
 }
 return {color:settings.wireColor,weight:+settings.wireWeight||3,
  opacity:+settings.wireOpacity,dash:settings.wireStyle==="solid"?null:
  settings.wireStyle==="dotted"?"2 8":"8 7"};
}
function renderConnections(){
 connectionLayer.clearLayers();
 if(settings.showWires===false)return;
 const byId={};locations.forEach(x=>byId[String(x.id)]=x);
 connections.forEach(c=>{
  const a=byId[c.from],b=byId[c.to];
  if(!a||!b)return;
  const st=getLineStyle(c);
  const line=L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{
   color:st.color,weight:st.weight,opacity:st.opacity,
   dashArray:st.dash,lineCap:"round",className:st.fiber?"fiber-flow":""
  }).addTo(connectionLayer);
  if(st.fiber){
   line.on("add",()=>{
    const p=line.getElement();if(!p)return;
    p.style.setProperty("--speed",Math.max(.2,+settings.fiberSpeed||1)+"s");
    p.style.strokeDasharray=(+settings.fiberDashSize||2)+" 12";
    if(settings.fiberDirection==="reverse")p.classList.add("reverse");
   });
  }
  line.bindTooltip(esc(c.name||`${a.name} → ${b.name}`));
 });
}

function renderArea(){
 areaLayer.clearLayers();
 const area=settings.displayArea||settings.lockedArea||{};
 const pts=(area.points||[]).map(p=>[
  +val(p,["lat","latitude"],NaN),+val(p,["lng","lon","longitude"],NaN)
 ]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));
 if(area.enabled&&pts.length>=3){
  const bounds=L.latLngBounds(pts);
  // Darken the map outside the allowed polygon.
  const world=[
   [-85,-179.9],[-85,179.9],[85,179.9],[85,-179.9]
  ];
  L.polygon([world,pts],{
   stroke:false,fillColor:"#101827",fillOpacity:.58,
   fillRule:"evenodd",interactive:false
  }).addTo(areaLayer);
  L.polygon(pts,{
   color:"#facc15",weight:3,fillOpacity:.04,
   dashArray:"8 6",interactive:false
  }).addTo(areaLayer);
  map.setMaxBounds(bounds.pad(.08));
  map.options.maxBoundsViscosity=1;
  map.fitBounds(bounds,{padding:[25,25]});
  map.setMinZoom(Math.max(3,map.getZoom()-1));
 }else{
  map.setMaxBounds(null);
  map.setMinZoom(3);
 }
}

function renderHome(){
 if(homeMarker){map.removeLayer(homeMarker);homeMarker=null}
 const h=settings.homePoint||{};
 if(Number.isFinite(+h.lat)&&Number.isFinite(+h.lng)){
  homeMarker=L.marker([+h.lat,+h.lng],{
   interactive:false,
   icon:L.divIcon({className:"",html:'<div class="home-icon"></div>',iconSize:[20,20],iconAnchor:[10,10]})
  }).addTo(map);
 }
}

function render(){
 const visible=renderMarkers();
 renderConnections();
 renderArea();
 renderHome();

 const h=settings.homePoint||{};
 if(Number.isFinite(+h.lat)&&Number.isFinite(+h.lng)){
  map.setView([+h.lat,+h.lng],Math.max(3,+h.zoom||+settings.zoomLevel||14));
 }else if(visible.length){
  map.fitBounds(L.latLngBounds(visible.map(x=>[x.lat,x.lng])),{padding:[30,30]});
 }else{
  map.setView([+settings.centerLat||23.8103,+settings.centerLng||90.4125],+settings.zoomLevel||14);
 }
 setTimeout(()=>map.invalidateSize(true),150);
}

function startGPS(){
 if(!navigator.geolocation){
  $("gpsStatus").textContent="GPS not supported";
  return;
 }
 watchId=navigator.geolocation.watchPosition(pos=>{
  const lat=pos.coords.latitude,lng=pos.coords.longitude;
  const ll=[lat,lng];
  if(!myMarker){
   myMarker=L.marker(ll,{
    icon:L.divIcon({className:"",html:'<div class="my-location"></div>',iconSize:[18,18],iconAnchor:[9,9]}),
    title:"My Location"
   }).addTo(map);
   myMarker.bindTooltip("My Location");
  }else myMarker.setLatLng(ll);

  const accuracy=Math.max(5,pos.coords.accuracy||10);
  if(myAccuracy)map.removeLayer(myAccuracy);
  myAccuracy=L.circle(ll,{
   radius:accuracy,color:"#1685f8",weight:1,
   fillColor:"#1685f8",fillOpacity:.08,interactive:false
  }).addTo(map);

  $("gpsStatus").innerHTML='<span class="gps-dot"></span>My Location: Live';
 },err=>{
  $("gpsStatus").textContent=
   err.code===1?"Location permission denied":"Waiting for GPS...";
 },{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
}

window.openGoogle=(lat,lng)=>{
 window.open("https://www.google.com/maps?q="+lat+","+lng,"_blank");
};

window.addEventListener("load",init);
window.addEventListener("resize",()=>map&&map.invalidateSize(true));
</script>
</body>
</html>
