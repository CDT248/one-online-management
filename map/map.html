<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network Map | ONE ONLINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --bg:#0b1220;
  --panel:#111c2e;
  --panel2:#172338;
  --line:#26364d;
  --text:#e8f0fc;
  --muted:#91a3bd;
  --primary:#1685f8;
  --green:#16a36a;
  --red:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial, sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}
button{font:inherit;cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
.topbar{
  min-height:62px;padding:10px 18px;background:#101b2c;
  border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:11px}
.brand-logo{
  width:38px;height:38px;border-radius:11px;background:#087f5b;
  display:grid;place-items:center;font-size:20px;font-weight:900;color:white
}
.brand-title{font-size:16px;font-weight:800}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-top:3px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  padding:9px 12px;border-radius:9px;font-size:12px;font-weight:700;
}
.btn:hover{filter:brightness(1.2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:white}
.btn.green{background:#087f5b;border-color:#087f5b;color:white}
.btn.danger{background:#7f1d1d;border-color:#991b1b;color:white}
.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#16a36a}
.main{flex:1;min-height:0;display:flex;position:relative}
.map-wrap{flex:1;min-width:0;position:relative}
#map{width:100%;height:100%;background:#dce5ed;z-index:1}
.side{
  width:320px;max-width:90vw;background:var(--panel);
  border-left:1px solid var(--line);display:flex;flex-direction:column;
  z-index:500;transition:transform .25s ease;
}
.side-head{
  padding:15px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between
}
.side-head strong{font-size:14px}
.side-content{padding:14px;overflow:auto;flex:1}
.section-title{
  font-size:11px;color:#8da2bf;text-transform:uppercase;
  letter-spacing:1px;font-weight:800;margin:15px 0 9px
}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{
  background:var(--panel2);border:1px solid var(--line);
  border-radius:11px;padding:12px
}
.stat b{display:block;font-size:21px;margin-bottom:4px}
.stat span{font-size:11px;color:var(--muted)}
.legend-item{
  display:flex;align-items:center;gap:9px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:12px
}
.legend-icon{
  width:29px;height:29px;border-radius:9px;display:grid;
  place-items:center;background:#23334b;font-size:16px
}
.detail-empty{
  padding:18px;border:1px dashed #344760;border-radius:11px;
  color:var(--muted);font-size:12px;text-align:center;line-height:1.7
}
.detail-card{
  background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:13px;margin-top:10px
}
.detail-title{font-size:15px;font-weight:800;margin-bottom:5px}
.detail-sub{font-size:11px;color:var(--muted);margin-bottom:12px}
.info-row{
  display:flex;justify-content:space-between;gap:12px;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);
  font-size:11px
}
.info-row:last-child{border-bottom:0}
.info-key{color:var(--muted);min-width:90px}
.info-value{text-align:right;overflow-wrap:anywhere}
.map-tools{
  position:absolute;z-index:400;top:12px;left:12px;
  display:flex;gap:7px;flex-wrap:wrap;max-width:calc(100% - 24px)
}
.tool{
  border:1px solid #d1d9e3;background:white;color:#172033;
  border-radius:9px;padding:9px 11px;font-size:11px;font-weight:800;
  box-shadow:0 2px 10px #0002
}
.tool:hover{background:#edf5ff}
.map-note{
  position:absolute;bottom:16px;left:12px;z-index:400;
  background:#101b2ce8;color:white;border:1px solid #ffffff20;
  padding:9px 12px;border-radius:9px;font-size:11px;
  max-width:calc(100% - 24px)
}
.mobile-toggle{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111c2e;color:#e8f0fc}
.leaflet-popup-content{margin:12px;font-size:12px}
.popup-title{font-weight:800;font-size:14px;margin-bottom:5px}
.popup-sub{color:#9eb0c8;font-size:11px}
.popup-btn{
  margin-top:10px;background:#1685f8;border:0;color:white;
  border-radius:7px;padding:7px 10px;font-weight:700;font-size:11px
}
.custom-marker{
  display:flex;align-items:center;justify-content:center;
  border:3px solid white;border-radius:50%;
  box-shadow:0 2px 9px #0006;font-size:17px;
  font-weight:800;color:white
}
.marker-label{
  background:#101b2c;color:white;border:1px solid #ffffff40;
  border-radius:5px;padding:3px 6px;font-size:10px;font-weight:700;
  white-space:nowrap;box-shadow:0 2px 6px #0003
}
.fiber-flow{
  stroke-dasharray:2 13;
  stroke-linecap:round;
  animation:fiberFlow var(--fiber-duration,1.1s) linear infinite;
}
.fiber-flow.reverse{animation-direction:reverse}
@keyframes fiberFlow{
  from{stroke-dashoffset:0}
  to{stroke-dashoffset:-30}
}
.connection-tooltip{
  background:#111c2e;color:white;border:1px solid #344760;
  box-shadow:none;font-size:11px
}
.leaflet-control-attribution{font-size:9px}
@media(max-width:760px){
  .topbar{padding:9px 11px;min-height:56px}
  .brand-title{font-size:13px}
  .brand-sub{font-size:9px}
  .top-actions .status{display:none}
  .btn{padding:8px 9px;font-size:11px}
  .side{
    position:absolute;right:0;top:0;bottom:0;
    width:300px;max-width:88vw;box-shadow:-8px 0 25px #0005;
    transform:translateX(105%)
  }
  .side.open{transform:translateX(0)}
  .mobile-toggle{display:inline-block}
  .map-tools{top:10px;left:8px;gap:5px}
  .tool{padding:8px;font-size:10px}
  .map-note{bottom:10px;left:8px;font-size:10px}
}
</style>
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">O</div>
      <div>
        <div class="brand-title">ONE ONLINE</div>
        <div class="brand-sub">NETWORK MAP SYSTEM</div>
      </div>
    </div>

    <div class="top-actions">
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Loading map...</span></div>
      <button class="btn" id="refreshBtn">↻ Refresh</button>
      <button class="btn mobile-toggle" id="sideToggle">☰ Details</button>
      <button class="btn primary" id="fitBtn">⌖ Fit All</button>
    </div>
  </header>

  <main class="main">
    <div class="map-wrap">
      <div id="map"></div>

      <div class="map-tools">
        <button class="tool" id="roadBtn">🗺 Road</button>
        <button class="tool" id="satBtn">🛰 Satellite</button>
        <button class="tool" id="terrainBtn">⛰ Terrain</button>
        <button class="tool" id="zoomInBtn">＋</button>
        <button class="tool" id="zoomOutBtn">－</button>
      </div>

      <div class="map-note" id="mapNote">Network locations are loading...</div>
    </div>

    <aside class="side" id="sidePanel">
      <div class="side-head">
        <strong>Network Information</strong>
        <button class="btn mobile-toggle" id="closeSide">✕</button>
      </div>

      <div class="side-content">
        <div class="stat-grid">
          <div class="stat"><b id="totalLocations">0</b><span>Total Locations</span></div>
          <div class="stat"><b id="totalConnections">0</b><span>Connections</span></div>
          <div class="stat"><b id="totalCustomers">0</b><span>Customers</span></div>
          <div class="stat"><b id="totalPulls">0</b><span>Pull Points</span></div>
        </div>

        <div class="section-title">Map Legend</div>
        <div id="legend"></div>

        <div class="section-title">Selected Location Details</div>
        <div id="details">
          <div class="detail-empty">
            কোনো Location Marker-এর উপর ক্লিক করুন।<br>
            Customer, Pull, Switch বা Pole-এর তথ্য এখানে দেখা যাবে।
          </div>
        </div>
      </div>
    </aside>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   ONE ONLINE — NETWORK MAP
   Uses the separate Map Spreadsheet API.
========================================================= */

const MAP_API =
"https://script.google.com/macros/s/AKfycbxmDzfnY3LpvfvHjC4usnZiBT4BX4KZIjVoCGcSULikoTKQaC_mj7cbG_zUaiTyZ4sb8w/exec";

const CACHE_KEY = "ONE_ONLINE_MAP_DATA_V1";

const DEFAULT_SETTINGS = {
  mapType:"road",
  centerLat:23.8103,
  centerLng:90.4125,
  zoomLevel:13,
  markerSize:36,
  showMarkerLabels:true,
  showWires:true,
  hiddenTypes:[],
  wireColor:"#f59e0b",
  wireWeight:3,
  wireOpacity:.95,
  wireStyle:"solid",
  fiberColor:"#2563eb",
  fiberWeight:4,
  fiberOpacity:1,
  fiberStyle:"solid",
  fiberSpeed:1.1,
  fiberDashSize:2,
  fiberDirection:"forward",
  dropColor:"#16a34a",
  dropWeight:2,
  dropOpacity:.95,
  dropStyle:"solid",
  lockedArea:{enabled:false,points:[]},
  _customTypes:[]
};

const DEFAULT_TYPES = [
  {name:"Customer",icon:"👤",color:"#2563eb"},
  {name:"Pole",icon:"🗼",color:"#f59e0b"},
  {name:"Switch",icon:"🔀",color:"#16a36a"},
  {name:"Pull",icon:"📍",color:"#9333ea"}
];

let map;
let tileLayers = {};
let activeTile = null;
let markerLayer = L.layerGroup();
let connectionLayer = L.layerGroup();
let areaLayer = L.layerGroup();

let locations = [];
let connections = [];
let settings = {...DEFAULT_SETTINGS};
let customTypes = [...DEFAULT_TYPES];
let markersById = {};
let selectedLocation = null;
let allBounds = null;
let areaBounds = null;
let isDataLoaded = false;

/* -------------------- HELPERS -------------------- */

function valueOf(obj, keys, fallback=""){
  for(const key of keys){
    if(obj && obj[key] !== undefined && obj[key] !== null && obj[key] !== ""){
      return obj[key];
    }
  }
  return fallback;
}

function parseJSON(value, fallback){
  try{
    if(typeof value === "string") return JSON.parse(value);
    return value ?? fallback;
  }catch(e){
    return fallback;
  }
}

function cleanType(type){
  return String(type || "").trim().toLowerCase();
}

function normalizeLocation(raw){
  const extra = parseJSON(
    valueOf(raw,["dataJson","Data JSON","data_json","data"],{}),{}
  );

  const merged = {...extra,...raw};

  const id = String(valueOf(merged,["id","ID","locationId","Location ID"],""));
  const type = valueOf(merged,["type","Type"],"Customer");
  const name = valueOf(merged,["name","Name"],"Unnamed Location");

  const lat = Number(valueOf(
    merged,["lat","latitude","Latitude","Lat"],NaN
  ));
  const lng = Number(valueOf(
    merged,["lng","longitude","Longitude","Lng","Long"],NaN
  ));

  return {
    ...merged,
    id,
    type,
    name,
    lat,
    lng,
    icon:valueOf(merged,["icon","Icon"],"📍"),
    color:valueOf(merged,["color","Color"],"#2563eb"),
    locationNumber:valueOf(
      merged,["locationNumber","Location Number","location_number"],""
    )
  };
}

function normalizeConnection(raw){
  return {
    ...raw,
    id:String(valueOf(raw,["id","ID"],"")),
    from:String(valueOf(raw,["from","From"],"")),
    to:String(valueOf(raw,["to","To"],"")),
    type:String(valueOf(raw,["type","Type"],"wire")).toLowerCase(),
    name:valueOf(raw,["name","Name"],"")
  };
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[char]));
}

function setStatus(message, good=true){
  document.getElementById("statusText").textContent = message;
  document.getElementById("statusDot").style.background =
    good ? "#16a36a" : "#ef4444";
}

function setMapNote(message){
  document.getElementById("mapNote").textContent = message;
}

function getTypeConfig(type){
  const normalized = cleanType(type);
  return customTypes.find(x => cleanType(x.name) === normalized)
      || DEFAULT_TYPES.find(x => cleanType(x.name) === normalized)
      || {name:type || "Location",icon:"📍",color:"#64748b"};
}

function isHiddenType(type){
  const hidden = settings.hiddenTypes || [];
  return hidden.some(x => cleanType(x) === cleanType(type));
}

/* -------------------- MAP INITIALIZATION -------------------- */

function initMap(){
  map = L.map("map",{
    zoomControl:true,
    preferCanvas:false,
    maxZoom:22,
    minZoom:3,
    zoomSnap:.5
  }).setView(
    [Number(settings.centerLat)||23.8103,Number(settings.centerLng)||90.4125],
    Number(settings.zoomLevel)||13
  );

  tileLayers = {
    road:L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {maxZoom:22,maxNativeZoom:19,attribution:"© OpenStreetMap"}
    ),
    satellite:L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {maxZoom:22,maxNativeZoom:19,attribution:"Tiles © Esri"}
    ),
    terrain:L.tileLayer(
      "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
      {maxZoom:17,maxNativeZoom:17,attribution:"© OpenTopoMap"}
    )
  };

  markerLayer.addTo(map);
  connectionLayer.addTo(map);
  areaLayer.addTo(map);

  changeMapType(settings.mapType || "road");

  map.on("click",()=>{
    // Keep the selected details visible until another marker is selected.
  });

  setTimeout(()=>map.invalidateSize(true),250);
}

function changeMapType(type){
  type = cleanType(type);
  if(!tileLayers[type]) type = "road";

  if(activeTile) map.removeLayer(activeTile);
  activeTile = tileLayers[type];
  activeTile.addTo(map);

  settings.mapType = type;

  ["roadBtn","satBtn","terrainBtn"].forEach(id=>{
    document.getElementById(id).style.outline = "none";
  });

  const buttonId = {
    road:"roadBtn",
    satellite:"satBtn",
    terrain:"terrainBtn"
  }[type];

  if(buttonId){
    document.getElementById(buttonId).style.outline = "2px solid #1685f8";
  }
}

/* -------------------- MARKERS -------------------- */

function makeMarkerIcon(location){
  const config = getTypeConfig(location.type);
  const icon = location.icon || config.icon || "📍";
  const color = location.color || config.color || "#2563eb";

  const size = Math.max(22,Math.min(70,Number(settings.markerSize)||36));

  return L.divIcon({
    className:"",
    html:`<div class="custom-marker"
      style="width:${size}px;height:${size}px;background:${escapeHTML(color)}">
      ${escapeHTML(icon)}
    </div>`,
    iconSize:[size,size],
    iconAnchor:[size/2,size/2],
    popupAnchor:[0,-size/2]
  });
}

function makeLabel(location){
  if(!settings.showMarkerLabels) return null;

  return L.divIcon({
    className:"",
    html:`<div class="marker-label">${escapeHTML(location.name)}</div>`,
    iconSize:[0,0],
    iconAnchor:[-12,8]
  });
}

function markerPopupHTML(location){
  const typeConfig = getTypeConfig(location.type);
  return `
    <div class="popup-title">${escapeHTML(location.name)}</div>
    <div class="popup-sub">
      ${escapeHTML(location.type)} 
      ${location.locationNumber ? " • "+escapeHTML(location.locationNumber) : ""}
    </div>
    <button class="popup-btn"
      onclick="showLocationDetails('${escapeHTML(location.id)}')">
      View Full Information
    </button>
  `;
}

function renderMarkers(){
  markerLayer.clearLayers();
  markersById = {};
  const validLocations = [];

  locations.forEach(location=>{
    if(!location.id || !Number.isFinite(location.lat) ||
       !Number.isFinite(location.lng)) return;

    if(location.lat < -90 || location.lat > 90 ||
       location.lng < -180 || location.lng > 180) return;

    if(isHiddenType(location.type)) return;

    const marker = L.marker(
      [location.lat,location.lng],
      {icon:makeMarkerIcon(location),title:location.name}
    );

    marker.bindPopup(markerPopupHTML(location));

    marker.on("click",()=>{
      showLocationDetails(location.id);
    });

    marker.addTo(markerLayer);
    markersById[location.id] = marker;

    if(settings.showMarkerLabels){
      const label = L.marker(
        [location.lat,location.lng],
        {
          icon:makeLabel(location),
          interactive:false,
          keyboard:false
        }
      );
      label.addTo(markerLayer);
    }

    validLocations.push(location);
  });

  if(validLocations.length){
    allBounds = L.latLngBounds(
      validLocations.map(x=>[x.lat,x.lng])
    );
  }else{
    allBounds = null;
  }
}

/* -------------------- LOCATION DETAILS -------------------- */

function showLocationDetails(id){
  const location = locations.find(x=>String(x.id)===String(id));
  if(!location) return;

  selectedLocation = location;

  const excluded = new Set([
    "id","ID","type","Type","name","Name",
    "lat","latitude","Latitude","lng","longitude","Longitude",
    "icon","Icon","color","Color","dataJson","Data JSON"
  ]);

  const entries = Object.entries(location)
    .filter(([key,val])=>
      !excluded.has(key) &&
      val !== undefined && val !== null &&
      typeof val !== "object" &&
      String(val).trim() !== ""
    );

  let rows = `
    <div class="detail-card">
      <div class="detail-title">${escapeHTML(location.name)}</div>
      <div class="detail-sub">
        ${escapeHTML(location.type)}
        ${location.locationNumber ? " • Location No: "+escapeHTML(location.locationNumber) : ""}
      </div>
      <div class="info-row">
        <span class="info-key">Location ID</span>
        <span class="info-value">${escapeHTML(location.id)}</span>
      </div>
      <div class="info-row">
        <span class="info-key">Latitude</span>
        <span class="info-value">${location.lat}</span>
      </div>
      <div class="info-row">
        <span class="info-key">Longitude</span>
        <span class="info-value">${location.lng}</span>
      </div>`;

  entries.forEach(([key,val])=>{
    rows += `
      <div class="info-row">
        <span class="info-key">${escapeHTML(key)}</span>
        <span class="info-value">${escapeHTML(val)}</span>
      </div>`;
  });

  rows += `
      <div style="display:flex;gap:7px;margin-top:12px">
        <button class="btn primary" style="flex:1"
          onclick="focusLocation('${escapeHTML(location.id)}')">
          View on Map
        </button>
        <button class="btn" style="flex:1"
          onclick="openGoogleMaps('${location.lat}','${location.lng}')">
          Google Maps
        </button>
      </div>
    </div>`;

  document.getElementById("details").innerHTML = rows;

  if(window.innerWidth <= 760){
    document.getElementById("sidePanel").classList.add("open");
  }
}

function focusLocation(id){
  const marker = markersById[id];
  if(!marker) return;

  const point = marker.getLatLng();
  map.setView(point,Math.max(map.getZoom(),17),{animate:true});
  marker.openPopup();
}

function openGoogleMaps(lat,lng){
  const url = `https://www.google.com/maps?q=${encodeURIComponent(lat+","+lng)}`;
  window.open(url,"_blank");
}

/* -------------------- CONNECTIONS -------------------- */

function connectionStyle(connection){
  const type = cleanType(connection.type);

  if(type.includes("fiber") || type.includes("fib")){
    return {
      color:settings.fiberColor || "#2563eb",
      weight:Number(settings.fiberWeight)||4,
      opacity:Number(settings.fiberOpacity ?? 1),
      dashArray:"2 13",
      className:"fiber-flow",
      isFiber:true
    };
  }

  if(type.includes("drop")){
    return {
      color:settings.dropColor || "#16a34a",
      weight:Number(settings.dropWeight)||2,
      opacity:Number(settings.dropOpacity ?? .95),
      dashArray:settings.dropStyle==="dashed" ? "8 7" :
                settings.dropStyle==="dotted" ? "2 8" : null,
      isFiber:false
    };
  }

  return {
    color:settings.wireColor || "#f59e0b",
    weight:Number(settings.wireWeight)||3,
    opacity:Number(settings.wireOpacity ?? .95),
    dashArray:settings.wireStyle==="dashed" ? "9 7" :
              settings.wireStyle==="dotted" ? "2 8" : null,
    isFiber:false
  };
}

function renderConnections(){
  connectionLayer.clearLayers();

  if(settings.showWires === false) return;

  const byId = {};
  locations.forEach(location=>byId[String(location.id)] = location);

  connections.forEach(connection=>{
    const from = byId[String(connection.from)];
    const to = byId[String(connection.to)];

    if(!from || !to) return;
    if(isHiddenType(from.type) || isHiddenType(to.type)) return;

    const style = connectionStyle(connection);

    const line = L.polyline(
      [[from.lat,from.lng],[to.lat,to.lng]],
      {
        color:style.color,
        weight:style.weight,
        opacity:style.opacity,
        dashArray:style.dashArray,
        lineCap:"round",
        className:style.isFiber ? "fiber-flow" : ""
      }
    );

    if(style.isFiber){
      const speed = Math.max(.2,Number(settings.fiberSpeed)||1.1);
      const dashSize = Math.max(1,Number(settings.fiberDashSize)||2);

      line.on("add",()=>{
        const path = line.getElement();
        if(path){
          path.style.setProperty("--fiber-duration",speed+"s");
          path.style.strokeDasharray = `${dashSize} 13`;
          if(cleanType(settings.fiberDirection)==="reverse"){
            path.classList.add("reverse");
          }
        }
      });
    }

    const label = connection.name ||
      `${from.name} → ${to.name}`;

    line.bindTooltip(escapeHTML(label),{
      sticky:true,
      className:"connection-tooltip"
    });

    line.addTo(connectionLayer);
  });
}

/* -------------------- AREA LOCK -------------------- */

function validAreaPoints(){
  const area = settings.lockedArea || {};
  if(!area.enabled || !Array.isArray(area.points) || area.points.length < 3){
    return [];
  }

  return area.points.map(point=>[
    Number(valueOf(point,["lat","latitude"],NaN)),
    Number(valueOf(point,["lng","lon","longitude"],NaN))
  ]).filter(point=>
    Number.isFinite(point[0]) &&
    Number.isFinite(point[1]) &&
    Math.abs(point[0])<=90 &&
    Math.abs(point[1])<=180
  );
}

function renderAreaLock(){
  areaLayer.clearLayers();
  areaBounds = null;

  const points = validAreaPoints();

  if(points.length < 3){
    map.setMaxBounds(null);
    map.setMinZoom(3);
    return;
  }

  const polygon = L.polygon(points,{
    color:"#facc15",
    weight:3,
    opacity:1,
    fillColor:"#facc15",
    fillOpacity:.08,
    dashArray:"9 6",
    interactive:false
  }).addTo(areaLayer);

  areaBounds = polygon.getBounds();

  // Restrict map movement to the locked polygon's bounding rectangle.
  const paddedBounds = areaBounds.pad(.12);
  map.setMaxBounds(paddedBounds);
  map.options.maxBoundsViscosity = 1;

  // Calculate a minimum zoom that keeps the permitted area in view.
  map.fitBounds(areaBounds,{padding:[35,35],animate:false});
  const fitZoom = map.getZoom();
  map.setMinZoom(Math.max(3,fitZoom-1));

  setMapNote("🔒 Area Lock Active — Map movement is restricted to the saved area.");
}

/* -------------------- LEGEND + COUNTS -------------------- */

function renderLegend(){
  const types = [...customTypes];

  document.getElementById("legend").innerHTML = types.map(type=>`
    <div class="legend-item">
      <div class="legend-icon">${escapeHTML(type.icon || "📍")}</div>
      <div style="flex:1">${escapeHTML(type.name)}</div>
      <div style="width:10px;height:10px;border-radius:50%;
        background:${escapeHTML(type.color || "#64748b")}"></div>
    </div>
  `).join("");
}

function renderCounts(){
  document.getElementById("totalLocations").textContent = locations.length;
  document.getElementById("totalConnections").textContent = connections.length;

  document.getElementById("totalCustomers").textContent =
    locations.filter(x=>cleanType(x.type)==="customer").length;

  document.getElementById("totalPulls").textContent =
    locations.filter(x=>cleanType(x.type)==="pull").length;
}

/* -------------------- LOAD DATA -------------------- */

function extractPayload(response){
  let result = response;

  if(result && result.data){
    result = result.data;
  }

  if(typeof result === "string"){
    result = parseJSON(result,{});
  }

  return result || {};
}

function applyData(data){
  const result = extractPayload(data);

  locations = (Array.isArray(result.locations) ? result.locations : [])
    .map(normalizeLocation);

  connections = (Array.isArray(result.connections) ? result.connections : [])
    .map(normalizeConnection);

  settings = {
    ...DEFAULT_SETTINGS,
    ...(result.settings || {})
  };

  customTypes = [
    ...DEFAULT_TYPES,
    ...(Array.isArray(result.customTypes) ? result.customTypes : [])
  ];

  // Settings may also store custom types inside _customTypes.
  if(Array.isArray(settings._customTypes)){
    settings._customTypes.forEach(item=>{
      if(!customTypes.some(x=>cleanType(x.name)===cleanType(item.name))){
        customTypes.push(item);
      }
    });
  }

  renderAll();
}

function renderAll(){
  if(!map) return;

  changeMapType(settings.mapType || "road");

  renderMarkers();
  renderConnections();
  renderAreaLock();
  renderLegend();
  renderCounts();

  if(!validAreaPoints().length){
    setMapNote(
      locations.length
        ? "Network map loaded. Click any marker to view its information."
        : "No locations found. Add locations from Map Settings."
    );

    if(allBounds && allBounds.isValid()){
      map.fitBounds(allBounds,{padding:[45,45],maxZoom:17});
    }else{
      map.setView(
        [Number(settings.centerLat)||23.8103,Number(settings.centerLng)||90.4125],
        Number(settings.zoomLevel)||13
      );
    }
  }

  setTimeout(()=>map.invalidateSize(true),150);
}

async function loadMapData(){
  setStatus("Loading...",false);

  // Show cached map immediately if available.
  try{
    const cached = localStorage.getItem(CACHE_KEY);
    if(cached){
      const parsed = JSON.parse(cached);
      applyData(parsed);
      setStatus("Cached map loaded",true);
    }
  }catch(e){
    console.warn("Map cache unavailable",e);
  }

  try{
    const response = await fetch(
      MAP_API+"?action=getMapData&_="+Date.now(),
      {method:"GET",cache:"no-store"}
    );

    if(!response.ok) throw new Error("API request failed: "+response.status);

    const data = await response.json();
    const result = extractPayload(data);

    applyData(result);

    try{
      localStorage.setItem(CACHE_KEY,JSON.stringify(result));
    }catch(e){
      console.warn("Could not save map cache",e);
    }

    isDataLoaded = true;
    setStatus("Live map connected",true);
  }catch(error){
    console.error(error);
    setStatus(
      isDataLoaded ? "Showing saved map" : "API connection failed",
      false
    );

    if(!isDataLoaded){
      setMapNote("Map API connection failed. Please check your internet connection and Map Settings API URL.");
    }
  }
}

/* -------------------- BUTTONS -------------------- */

document.getElementById("refreshBtn").addEventListener("click",()=>{
  loadMapData();
});

document.getElementById("fitBtn").addEventListener("click",()=>{
  if(validAreaPoints().length){
    map.fitBounds(areaBounds,{padding:[35,35]});
  }else if(allBounds && allBounds.isValid()){
    map.fitBounds(allBounds,{padding:[45,45],maxZoom:17});
  }else{
    map.setView(
      [Number(settings.centerLat)||23.8103,Number(settings.centerLng)||90.4125],
      Number(settings.zoomLevel)||13
    );
  }
});

document.getElementById("roadBtn").addEventListener("click",()=>{
  changeMapType("road");
});

document.getElementById("satBtn").addEventListener("click",()=>{
  changeMapType("satellite");
});

document.getElementById("terrainBtn").addEventListener("click",()=>{
  changeMapType("terrain");
});

document.getElementById("zoomInBtn").addEventListener("click",()=>{
  map.zoomIn();
});

document.getElementById("zoomOutBtn").addEventListener("click",()=>{

});

document.getElementById("sideToggle").addEventListener("click",()=>{
  document.getElementById("sidePanel").classList.toggle("open");
});

document.getElementById("closeSide").addEventListener("click",()=>{

});

/* -------------------- START -------------------- */

window.addEventListener("load",()=>{
  initMap();
  loadMapData();

  setTimeout(()=>{
    if(map) map.invalidateSize(true);
  },700);
});

window.addEventListener("resize",()=>{
  if(map) map.invalidateSize(true);
});

// Expose functions for marker popup buttons.
window.showLocationDetails = showLocationDetails;
window.focusLocation = focusLocation;
window.openGoogleMaps = openGoogleMaps;
</script>
