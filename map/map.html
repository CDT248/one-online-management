
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map | ONE ONLINE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--panel:#111c2e;--panel2:#172338;--text:#e8f0fc;--muted:#91a2bb;--line:#26364d;--primary:#168bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex;flex-direction:column}
.top{min-height:62px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px;margin-top:3px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:8px;font-size:12px;font-weight:600}
.btn.primary{background:var(--primary);border-color:var(--primary);color:white}
.main{display:grid;grid-template-columns:290px minmax(0,1fr);flex:1;min-height:0}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}
#map{height:100%;width:100%;background:#dce5ec;z-index:1}
.search{width:100%;padding:11px;background:#0b1628;color:white;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}
.stat{background:var(--panel2);padding:11px;border:1px solid var(--line);border-radius:9px}
.stat b{display:block;font-size:20px}.stat small{color:var(--muted);font-size:10px}
.section{border-top:1px solid var(--line);padding-top:13px;margin-top:13px}
.section h3{font-size:12px;margin:0 0 10px}
.filter{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px;color:#cbd5e1}
.filter input{accent-color:var(--primary)}
.filter .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.connection-row{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px}
.connection-row input{accent-color:var(--primary)}
.legend-line{width:22px;border-top:3px solid}
.status{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}
.marker{display:flex;align-items:center;justify-content:center;border:2px solid white;border-radius:50%;box-shadow:0 2px 8px #0008;font-size:17px}
.leaflet-popup-content-wrapper{border-radius:10px}
.popup{min-width:170px;color:#172033;font:12px Inter,Arial}
.popup h3{font-size:14px;margin:0 0 8px}
.popup div{margin:4px 0}
.popup button{border:0;background:#168bfa;color:white;border-radius:6px;padding:6px 9px;margin-top:8px}
@media(max-width:760px){
 .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
 .sidebar{max-height:220px;border-right:0;border-bottom:1px solid var(--line)}
 #map{min-height:350px}
 .app{height:100dvh}
}
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="brand">ONE ONLINE <small>NETWORK MAP</small></div>
  <div class="actions">
   <button class="btn" onclick="fitAll()">Fit All</button>
   <button class="btn" onclick="resetView()">Reset View</button>
   <button class="btn" onclick="goEntry()">+ Map Entry</button>
   <button class="btn primary" onclick="goSettings()">Map Settings</button>
  </div>
 </header>
 <main class="main">
  <aside class="sidebar">
   <input id="search" class="search" placeholder="Search customer, pole, switch..." oninput="renderMarkers()">
   <div class="stats">
    <div class="stat"><b id="totalLocations">0</b><small>LOCATIONS</small></div>
    <div class="stat"><b id="totalConnections">0</b><small>CONNECTIONS</small></div>
   </div>
   <div class="section"><h3>LOCATION FILTER</h3><div id="typeFilters"></div></div>
   <div class="section">
    <h3>CONNECTION FILTER</h3>
    <label class="connection-row"><input type="checkbox" id="showWire" checked onchange="renderConnections()"> Wire</label>
    <label class="connection-row"><input type="checkbox" id="showFiber" checked onchange="renderConnections()"> Fiber</label>
    <label class="connection-row"><input type="checkbox" id="showDrop" checked onchange="renderConnections()"> Drop</label>
   </div>
   <div class="section">
    <h3>MAP INFORMATION</h3>
    <div class="status" id="mapStatus">Loading map data...</div>
   </div>
  </aside>
  <div id="map"></div>
 </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-polylinedecorator@1.7.0/dist/leaflet.polylineDecorator.min.js"></script>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxmDzfnY3LpvfvHjC4usnZiBT4BX4KZIjVoCGcSULikoTKQaC_mj7cbG_zUaiTyZ4sb8w/exec";
const STORAGE_KEY="ONE_ONLINE_MAP_DATA_V1";
const DEFAULT_TYPES=[
 {id:"customer",name:"Customer",icon:"👤",color:"#168bfa"},
 {id:"pole",name:"Pole",icon:"🗼",color:"#f59e0b"},
 {id:"switch",name:"Switch",icon:"🔀",color:"#10b981"}
];
let db={locations:[],connections:[],settings:{},customTypes:[]};
let map,tileLayer,markerLayer=L.layerGroup(),connectionLayer=L.layerGroup(),areaLayer=L.layerGroup();
let markerRefs=[];
const $=id=>document.getElementById(id);
const num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function normalizeType(s){return String(s||"").trim().toLowerCase().replace(/[\s_-]+/g,"")}
function getTypes(){return [...DEFAULT_TYPES,...(db.customTypes||[]).map((t,i)=>({id:String(t.id||"custom_"+i),name:t.name||"Custom",icon:t.icon||"📍",color:t.color||"#a855f7"}))]}
function typeFor(item){
 const raw=item.type||item.Type||item.locationType||item.category||"Customer";
 return getTypes().find(t=>normalizeType(t.id)===normalizeType(raw)||normalizeType(t.name)===normalizeType(raw))||{id:String(raw).toLowerCase(),name:raw,icon:item.icon||"📍",color:item.color||"#64748b"};
}
function coords(item){
 const lat=num(item.lat??item.latitude??item.Latitude,NaN);
 const lng=num(item.lng??item.longitude??item.Longitude,NaN);
 return Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180?[lat,lng]:null;
}
function itemName(x){return x.name||x.Name||x.customerName||x.Customer||"Unnamed location"}
function itemId(x){return String(x.id??x.ID??x.locationId??"")}
function getSettings(){return db.settings||{}}
function hiddenTypes(){return getSettings().hiddenTypes||[]}
function isTypeVisible(t){return !hiddenTypes().some(x=>normalizeType(x)===normalizeType(t.id)||normalizeType(x)===normalizeType(t.name))}
function tileURL(type){
 if(type==="satellite")return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
 if(type==="terrain")return "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png";
 return "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";
}
function setTiles(){
 const s=getSettings(),type=s.mapType||"road";
 if(tileLayer)map.removeLayer(tileLayer);
 tileLayer=L.tileLayer(tileURL(type),{maxZoom:19,attribution:type==="satellite"?"Tiles © Esri":"© OpenStreetMap contributors"}).addTo(map);
}
function initMap(){
 const s=getSettings();
 map=L.map("map").setView([num(s.centerLat,22.3569),num(s.centerLng,91.7832)],num(s.zoomLevel,13));
 setTiles();markerLayer.addTo(map);connectionLayer.addTo(map);areaLayer.addTo(map);
 map.on("zoomend",()=>{});
}
function markerIcon(item,t){
 const size=Math.max(12,Math.min(60,num(getSettings().markerSize,28)));
 const icon=item.icon||t.icon||"📍",color=item.color||t.color||"#168bfa";
 return L.divIcon({className:"",html:`<div class="marker" style="width:${size+10}px;height:${size+10}px;background:${esc(color)};font-size:${Math.max(11,size*.62)}px">${esc(icon)}</div>`,iconSize:[size+10,size+10],iconAnchor:[(size+10)/2,(size+10)/2]});
}
function markerPopup(item,t){
 const name=itemName(item),address=item.address||item.Address||"",phone=item.phone||item.Phone||"",ip=item.ip||item.IP||"";
 return `<div class="popup"><h3>${esc(name)}</h3><div><b>Type:</b> ${esc(t.name)}</div>${ip?`<div><b>IP:</b> ${esc(ip)}</div>`:""}${phone?`<div><b>Phone:</b> ${esc(phone)}</div>`:""}${address?`<div><b>Address:</b> ${esc(address)}</div>`:""}<div><b>Location ID:</b> ${esc(itemId(item)||"—")}</div></div>`;
}
function renderTypeFilters(){
 const root=$("typeFilters");root.innerHTML="";
 const actual=new Set(db.locations.map(x=>normalizeType(typeFor(x).id)));
 getTypes().filter(t=>actual.has(normalizeType(t.id))).forEach(t=>{
  const label=document.createElement("label");label.className="filter";
  const input=document.createElement("input");input.type="checkbox";input.checked=isTypeVisible(t);
  input.onchange=()=>{const hidden=new Set(hiddenTypes());if(input.checked)hidden.delete(t.id);else hidden.add(t.id);db.settings.hiddenTypes=[...hidden];renderMarkers();};
  const dot=document.createElement("span");dot.className="dot";dot.style.background=t.color;
  const text=document.createElement("span");text.textContent=t.name;
  label.append(input,dot,text);root.append(label);
 });
}
function renderMarkers(){
 markerLayer.clearLayers();markerRefs=[];
 const query=$("search").value.trim().toLowerCase(),s=getSettings();
 db.locations.forEach(item=>{
  const pos=coords(item);if(!pos)return;
  const t=typeFor(item);if(!isTypeVisible(t))return;
  const searchable=[itemName(item),item.phone,item.ip,item.address,t.name].join(" ").toLowerCase();
  if(query&&!searchable.includes(query))return;
  const marker=L.marker(pos,{icon:markerIcon(item,t)});
  marker.bindPopup(markerPopup(item,t));
  if(s.showMarkerLabels!==false)marker.bindTooltip(itemName(item),{direction:"top",offset:[0,-12]});
  marker.addTo(markerLayer);markerRefs.push({marker,item});
 });
 $("totalLocations").textContent=db.locations.length;
}
function connectionStyle(type){
 const s=getSettings(),t=String(type||"wire").toLowerCase();
 const prefix=t.includes("fiber")?"fiber":t.includes("drop")?"drop":"wire";
 const defaults={wire:{color:"#00d4ff",weight:3,opacity:.9,style:"solid"},fiber:{color:"#a855f7",weight:3,opacity:.9,style:"solid"},drop:{color:"#f59e0b",weight:2,opacity:.9,style:"dashed"}};
 const d=defaults[prefix];
 return {color:s[prefix+"Color"]||d.color,weight:num(s[prefix+"Weight"],d.weight),opacity:num(s[prefix+"Opacity"],d.opacity),dashArray:(s[prefix+"Style"]||d.style)==="dashed"?"8 7":(s[prefix+"Style"]||d.style)==="dotted"?"2 7":null};
}
function findLocation(ref){
 return db.locations.find(x=>String(x.id??x.ID??x.locationId)===String(ref)||itemName(x)===String(ref));
}
function connectionKind(c){const t=String(c.type||c.connectionType||"wire").toLowerCase();return t.includes("fiber")?"fiber":t.includes("drop")?"drop":"wire"}
function renderConnections(){
 connectionLayer.clearLayers();
 const s=getSettings();if(s.showWires===false)return;
 db.connections.forEach(c=>{
  const kind=connectionKind(c);
  if(!$("show"+kind.charAt(0).toUpperCase()+kind.slice(1)).checked)return;
  const from=findLocation(c.from??c.fromId??c.source),to=findLocation(c.to??c.toId??c.target);
  if(!from||!to)return;
  const a=coords(from),b=coords(to);if(!a||!b)return;
  const style=connectionStyle(kind);
  const line=L.polyline([a,b],style).addTo(connectionLayer);
  const label=c.name||c.label||kind.toUpperCase();
  if(label)line.bindTooltip(esc(label));
  if(c.direction!==false&&c.directed!==false&&L.polylineDecorator){
   L.polylineDecorator(line,{patterns:[{offset:"75%",repeat:0,symbol:L.Symbol.arrowHead({pixelSize:9,polygon:false,pathOptions:{color:style.color,weight:2,opacity:style.opacity}})}]}).addTo(connectionLayer);
  }
 });
 $("totalConnections").textContent=db.connections.length;
}
function getAreaPoints(){
 const a=getSettings().lockedArea||getSettings().areaLock||{};
 if(Array.isArray(a.points))return a.points.map(p=>Array.isArray(p)?[num(p[0]),num(p[1])]:[num(p.lat),num(p.lng)]).filter(p=>p.every(Number.isFinite));
 if(a.southWest&&a.northEast){const sw=a.southWest,ne=a.northEast;return [[num(sw.lat),num(sw.lng)],[num(ne.lat),num(sw.lng)],[num(ne.lat),num(ne.lng)],[num(sw.lat),num(ne.lng)]]}
 return [];
}
function pointInside(point,poly){
 let inside=false;const x=point[1],y=point[0];
 for(let i=0,j=poly.length-1;i<poly.length;j=i++){
  const xi=poly[i][1],yi=poly[i][0],xj=poly[j][1],yj=poly[j][0];
  const intersect=((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi);
  if(intersect)inside=!inside;
 }
 return inside;
}
function drawArea(){
 areaLayer.clearLayers();const a=getSettings().lockedArea||{};
 const pts=getAreaPoints();
 if(!a.enabled||pts.length<3)return;
 L.polygon(pts,{color:"#16a34a",weight:2,fill:false,dashArray:"7 6"}).addTo(areaLayer);
 // Keep the map bright: no world-sized dark mask is applied.
}
function applySettings(){
 const s=getSettings();
 setTiles();
 if(s.showWires===false){$("showWire").checked=false;$("showFiber").checked=false;$("showDrop").checked=false;}
 renderTypeFilters();renderMarkers();renderConnections();drawArea();
 if(s.centerLat!=null&&s.centerLng!=null)map.setView([num(s.centerLat,22.3569),num(s.centerLng,91.7832)],num(s.zoomLevel,map.getZoom()));
}
async function loadData(){
 try{
  const r=await fetch(API_URL+"?action=getMapData&t="+Date.now());
  if(!r.ok)throw Error("Server request failed");
  const result=await r.json();if(result.success===false)throw Error(result.message||"Load failed");
  const data=result.data||result;
  db={locations:Array.isArray(data.locations)?data.locations:[],connections:Array.isArray(data.connections)?data.connections:[],settings:data.settings||{},customTypes:Array.isArray(data.customTypes)?data.customTypes:[]};
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
  $("mapStatus").textContent="Google Sheet থেকে সর্বশেষ Map Data লোড হয়েছে।";
 }catch(e){
  try{const local=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");db={locations:local.locations||[],connections:local.connections||[],settings:local.settings||{},customTypes:local.customTypes||[]};$("mapStatus").textContent="Server পাওয়া যায়নি। Local backup data দেখানো হচ্ছে।";}
  catch(x){$("mapStatus").textContent="Map data load করা যায়নি: "+e.message;}
 }
 applySettings();
}
function fitAll(){
 const pts=markerRefs.map(x=>x.marker.getLatLng());
 if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[35,35],maxZoom:17});
}
function resetView(){const s=getSettings();map.setView([num(s.centerLat,22.3569),num(s.centerLng,91.7832)],num(s.zoomLevel,13))}
function goSettings(){window.parent.postMessage({type:"ONE_ONLINE_NAVIGATE",page:"map-setting"},"*")}
function goEntry(){window.parent.postMessage({type:"ONE_ONLINE_NAVIGATE",page:"map-entry"},"*")}
initMap();loadData();
window.addEventListener("storage",e=>{if(e.key===STORAGE_KEY)loadData()});
</script>
</body>
</html>
