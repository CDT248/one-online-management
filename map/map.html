<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Map | ONE ONLINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-arrowheads@1.2.2/src/leaflet-arrowheads.css">

<style>
:root{
  --bg:#08111f;
  --panel:#101d30;
  --panel2:#16263c;
  --line:#263b56;
  --text:#edf4ff;
  --muted:#91a5c0;
  --primary:#20b98a;
  --blue:#3997ff;
  --danger:#ff647c;
  --shadow:0 12px 35px rgba(0,0,0,.28);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* TOP BAR */
.topbar{
  min-height:64px;
  background:rgba(8,17,31,.97);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 18px;
  gap:12px;
  z-index:1000;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:170px;
}

.brand-logo{
  width:39px;
  height:39px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#12a879,#1687c9);
  color:white;
  font-size:21px;
  font-weight:900;
}

.brand-name{
  font-size:15px;
  font-weight:850;
  letter-spacing:.5px;
}

.brand-sub{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
  letter-spacing:1.3px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.action-btn{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:9px;
  padding:9px 12px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
}

.action-btn:hover{
  background:var(--panel2);
  border-color:#45617f;
}

.action-btn.active{
  background:#123d35;
  border-color:var(--primary);
  color:#75f0c7;
}

.action-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#e4a63b;
  display:inline-block;
}

.status-dot.online{background:#21c78e}
.status-dot.error{background:#ff647c}

/* STATISTICS */
.stats-bar{
  display:flex;
  gap:9px;
  padding:10px 14px;
  background:#0c1829;
  border-bottom:1px solid var(--line);
  overflow-x:auto;
  scrollbar-width:thin;
  z-index:900;
}

.stat-card{
  min-width:125px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 12px;
  display:flex;
  align-items:center;
  gap:10px;
}

.stat-icon{
  width:34px;
  height:34px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:#1b3450;
  font-size:18px;
  flex-shrink:0;
}

.stat-number{
  font-size:19px;
  font-weight:850;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
}

.stat-label{
  font-size:10px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
}

/* MAP */
.map-wrap{
  flex:1;
  min-height:0;
  position:relative;
  background:#dce5eb;
}

#map{
  width:100%;
  height:100%;
  z-index:1;
}

/* MAP CONTROLS */
.map-tools{
  position:absolute;
  top:13px;
  right:13px;
  z-index:700;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.map-tool{
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.18);
  background:#101d30;
  color:white;
  border-radius:11px;
  font-size:18px;
  cursor:pointer;
  box-shadow:var(--shadow);
  display:grid;
  place-items:center;
}

.map-tool:hover{background:#1b3450}

.map-tool.active{
  background:#087e60;
  border-color:#31d5a2;
}

.map-type-switch{
  position:absolute;
  top:13px;
  left:13px;
  z-index:700;
  display:flex;
  gap:4px;
  padding:4px;
  background:#101d30;
  border:1px solid rgba(255,255,255,.15);
  border-radius:11px;
  box-shadow:var(--shadow);
}

.map-type-switch button{
  border:0;
  color:#b9c9dc;
  background:transparent;
  padding:9px 13px;
  border-radius:7px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.map-type-switch button.active{
  background:#087e60;
  color:white;
}

/* SEARCH */
.search-box{
  position:absolute;
  z-index:700;
  top:68px;
  left:13px;
  width:min(290px,calc(100% - 90px));
}

.search-box input{
  width:100%;
  padding:12px 14px;
  background:#101d30;
  border:1px solid #344a66;
  border-radius:10px;
  color:white;
  outline:none;
  font-size:12px;
  box-shadow:var(--shadow);
}

.search-box input::placeholder{color:#91a5c0}

.search-results{
  display:none;
  margin-top:5px;
  max-height:260px;
  overflow:auto;
  background:#101d30;
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
}

.search-result{
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  font-size:12px;
}

.search-result:hover{background:#1b3450}

.search-result small{
  display:block;
  color:var(--muted);
  margin-top:4px;
}

/* MAP MARKERS */
.location-marker{
  background:transparent;
  border:0;
}

.marker-content{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  width:30px;
  height:34px;
  font-size:25px;
  line-height:1;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.65));
  transition:transform .15s;
}

.marker-content:hover{transform:scale(1.2)}

.marker-content.selected{
  transform:scale(1.3);
  filter:drop-shadow(0 0 5px #fff);
}

.marker-label{
  position:absolute;
  top:33px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  background:rgba(8,17,31,.91);
  border:1px solid rgba(255,255,255,.22);
  color:white;
  border-radius:4px;
  padding:3px 6px;
  font-size:10px;
  font-weight:700;
  pointer-events:none;
}

/* POPUP */
.leaflet-popup-content-wrapper,
.leaflet-popup-tip{
  background:#101d30;
  color:#edf4ff;
}

.leaflet-popup-content-wrapper{
  border:1px solid #344a66;
  border-radius:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.leaflet-popup-content{
  margin:13px;
  min-width:210px;
}

.popup-title{
  font-size:15px;
  font-weight:850;
  margin-bottom:9px;
}

.popup-type{
  display:inline-block;
  padding:4px 7px;
  border-radius:5px;
  background:#164638;
  color:#77e8c2;
  font-size:10px;
  font-weight:800;
  margin-bottom:8px;
}

.popup-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:6px 0;
  border-bottom:1px solid #263b56;
  font-size:11px;
}

.popup-row span:first-child{color:#91a5c0}
.popup-row span:last-child{
  text-align:right;
  overflow-wrap:anywhere;
  max-width:140px;
}

.popup-more{
  margin-top:9px;
  font-size:10px;
  color:#9fb2c9;
}

/* CONNECTION LINES */
.connection-line{
  stroke-linecap:round;
  stroke-linejoin:round;
}

.flow-line{
  stroke-dasharray:9 10;
  animation:wireFlow 1.1s linear infinite;
}

@keyframes wireFlow{
  from{stroke-dashoffset:0}
  to{stroke-dashoffset:-38}
}

/* LOADING AND MESSAGE */
.loading-screen{
  position:absolute;
  inset:0;
  z-index:2000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#08111f;
  gap:13px;
}

.loader{
  width:38px;
  height:38px;
  border:3px solid #263b56;
  border-top-color:#20b98a;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

.loading-title{font-weight:800;font-size:14px}
.loading-sub{font-size:11px;color:var(--muted)}

.toast{
  position:absolute;
  z-index:1800;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#101d30;
  color:white;
  border:1px solid #344a66;
  border-radius:9px;
  padding:11px 16px;
  box-shadow:var(--shadow);
  font-size:12px;
  display:none;
  max-width:90%;
  text-align:center;
}

.map-credit{
  position:absolute;
  z-index:600;
  bottom:5px;
  left:5px;
  padding:3px 6px;
  background:rgba(8,17,31,.75);
  border-radius:4px;
  color:#d6e4f4;
  font-size:9px;
  pointer-events:none;
}

@media(max-width:650px){
  .topbar{min-height:56px;padding:7px 10px}
  .brand{min-width:0}
  .brand-logo{width:34px;height:34px}
  .brand-name{font-size:12px}
  .brand-sub{font-size:8px}
  .action-btn{padding:8px 9px;font-size:10px}
  .action-btn .btn-text{display:none}
  .stats-bar{padding:8px;gap:7px}
  .stat-card{min-width:108px;padding:8px}
  .stat-number{font-size:17px}
  .stat-icon{width:30px;height:30px;font-size:16px}
  .map-tools{top:112px;right:9px}
  .map-tool{width:38px;height:38px}
  .map-type-switch{top:10px;left:9px}
  .search-box{top:59px;left:9px;width:min(245px,calc(100% - 70px))}
}
</style>
</head>

<body>
<div id="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">O</div>
      <div>
        <div class="brand-name">ONE ONLINE</div>
        <div class="brand-sub">NETWORK MAP</div>
      </div>
    </div>

    <div class="top-actions">
      <div class="action-btn" style="cursor:default">
        <span class="status-dot" id="apiStatus"></span>
        <span id="apiStatusText">Connecting...</span>
      </div>

      <button class="action-btn" onclick="loadMapData()">
        <span>↻</span><span class="btn-text">Refresh</span>
      </button>

      <button class="action-btn" id="gpsTopButton" onclick="toggleMyLocation()">
        <span>◎</span><span class="btn-text">My Location</span>
      </button>
    </div>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-card">
      <div class="stat-icon">👤</div>
      <div>
        <div class="stat-number" id="totalCustomer">0</div>
        <div class="stat-label">Total Customer</div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">📍</div>
      <div>
        <div class="stat-number" id="totalPull">0</div>
        <div class="stat-label">Total Pull</div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">🔀</div>
      <div>
        <div class="stat-number" id="totalSwitch">0</div>
        <div class="stat-label">Total Switch</div>
      </div>
    </div>

    <div id="customStats" style="display:flex;gap:9px"></div>
  </div>

  <div class="map-wrap">
    <div id="map"></div>

    <div class="map-type-switch">
      <button id="roadButton" class="active" onclick="changeMapType('road')">ROAD</button>
      <button id="satelliteButton" onclick="changeMapType('satellite')">SATELLITE</button>
    </div>

    <div class="search-box">
      <input
        id="mapSearch"
        type="search"
        placeholder="Search Name / IP / Location Number..."
        autocomplete="off"
        oninput="searchLocations(this.value)"
      >
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="map-tools">
      <button class="map-tool" title="My Location" onclick="toggleMyLocation()">◎</button>
      <button class="map-tool" title="Zoom In" onclick="map.zoomIn()">＋</button>
      <button class="map-tool" title="Zoom Out" onclick="map.zoomOut()">−</button>
      <button class="map-tool" title="Show All Locations" onclick="showAllLocations()">⌖</button>
    </div>

    <div class="map-credit">ONE ONLINE NETWORK MAP</div>
  </div>

  <div class="loading-screen" id="loadingScreen">
    <div class="loader"></div>
    <div class="loading-title">Loading Network Map</div>
    <div class="loading-sub">Please wait...</div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-arrowheads@1.2.2/src/leaflet-arrowheads.js"></script>

<script>
/************************************************************
 ONE ONLINE — FULL NETWORK MAP
 Uses separate Map Spreadsheet API.
************************************************************/

const MAP_API =
"https://script.google.com/macros/s/AKfycbxmDzfnY3LpvfvHjC4usnZiBT4BX4KZIjVoCGcSULikoTKQaC_mj7cbG_zUaiTyZ4sb8w/exec";

const CACHE_KEY = "ONE_ONLINE_MAP_DATA_V1";

let map;
let locations = [];
let connections = [];
let settings = {};
let customTypes = [];
let cableCategories = [];

let markerLayer;
let wireLayer;
let searchIndex = [];

let gpsWatchId = null;
let gpsMarker = null;
let gpsAccuracy = null;

let roadLayer;
let satelliteLayer;
let currentMapType = "road";

let markerByLocation = new Map();
let selectedMarker = null;

const DEFAULT_CENTER = [23.8103, 90.4125];
const DEFAULT_ZOOM = 12;


/* ---------------- INITIALIZE MAP ---------------- */

function initializeMap(){
  map = L.map("map",{
    zoomControl:false,
    preferCanvas:true
  });

  roadLayer = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:20,
      attribution:"© OpenStreetMap"
    }
  );

  satelliteLayer = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom:19,
      attribution:"Tiles © Esri"
    }
  );

  markerLayer = L.layerGroup().addTo(map);
  wireLayer = L.layerGroup().addTo(map);

  const initialType = String(settings.mapType || "road").toLowerCase();
  changeMapType(initialType === "satellite" ? "satellite" : "road", false);

  const center = getDefaultCenter();
  map.setView(center, getDefaultZoom());

  setTimeout(()=>map.invalidateSize(),300);
}

function changeMapType(type, updateSettings=true){
  if(!map) return;

  currentMapType = type === "satellite" ? "satellite" : "road";

  if(map.hasLayer(roadLayer)) map.removeLayer(roadLayer);
  if(map.hasLayer(satelliteLayer)) map.removeLayer(satelliteLayer);

  if(currentMapType === "satellite"){
    satelliteLayer.addTo(map);
  }else{
    roadLayer.addTo(map);
  }

  document.getElementById("roadButton").classList.toggle(
    "active",currentMapType === "road"
  );

  document.getElementById("satelliteButton").classList.toggle(
    "active",currentMapType === "satellite"
  );

  if(updateSettings) settings.mapType = currentMapType;
}


/* ---------------- LOAD DATA ---------------- */

async function loadMapData(){
  setApiStatus("loading","Connecting...");

  try{
    const response = await fetch(
      MAP_API + "?action=getMapData&t=" + Date.now(),
      {
        method:"GET",
        cache:"no-store",
        redirect:"follow"
      }
    );

    if(!response.ok){
      throw new Error("Server response: " + response.status);
    }

    const result = await response.json();

    const data = result.data || result;

    locations = Array.isArray(data.locations) ? data.locations : [];
    connections = Array.isArray(data.connections) ? data.connections : [];
    settings = data.settings || {};
    customTypes = normalizeCustomTypes(
      data.customTypes || settings._customTypes || []
    );
    cableCategories = normalizeCableCategories(
      settings._cableCategories || []
    );

    localStorage.setItem(CACHE_KEY,JSON.stringify({
      locations,
      connections,
      settings,
      customTypes
    }));

    setApiStatus("online","Connected");

    renderEverything();

    hideLoading();

    showToast("Map data loaded successfully");

  }catch(error){
    console.error("Map API Error:",error);

    const cached = readCache();

    if(cached){
      locations = cached.locations || [];
      connections = cached.connections || [];
      settings = cached.settings || {};
      customTypes = normalizeCustomTypes(
        cached.customTypes || settings._customTypes || []
      );
      cableCategories = normalizeCableCategories(
        settings._cableCategories || []
      );

      renderEverything();
      setApiStatus("error","Offline Cache");
      showToast("Server unavailable. Showing saved map data.");
    }else{
      setApiStatus("error","Connection Error");
      hideLoading();
      showToast("Map data could not be loaded. Check Map API.");
    }
  }
}

function readCache(){
  try{
    const value = localStorage.getItem(CACHE_KEY);
    return value ? JSON.parse(value) : null;
  }catch(e){
    return null;
  }
}


/* ---------------- NORMALIZE DATA ---------------- */

function parseJSON(value){
  if(!value) return {};
  if(typeof value === "object") return value;

  try{
    return JSON.parse(value);
  }catch(e){
    return {};
  }
}

function getValue(obj,names,defaultValue=""){
  if(!obj) return defaultValue;

  for(const name of names){
    if(obj[name] !== undefined && obj[name] !== null && obj[name] !== ""){
      return obj[name];
    }

    const found = Object.keys(obj).find(
      key => key.toLowerCase() === name.toLowerCase()
    );

    if(found && obj[found] !== undefined && obj[found] !== null && obj[found] !== ""){
      return obj[found];
    }
  }

  return defaultValue;
}

function normalizeLocation(raw){
  const extra = parseJSON(
    getValue(raw,["Data JSON","dataJson","data","extraData"],{})
  );

  const item = Object.assign({},extra,raw);

  return {
    ...item,
    id:String(getValue(item,["ID","id","locationId"],"")),
    type:String(getValue(item,["Type","type","category"],"Other")),
    name:String(getValue(item,["Name","name","customerName"],"Unnamed Location")),
    ip:String(getValue(item,["IP","ip","IP Address","ipAddress"],"")),
    locationNumber:String(getValue(item,[
      "Location Number","locationNumber","LocationNumber"
    ],"")),
    lat:Number(getValue(item,["Latitude","latitude","lat"],NaN)),
    lng:Number(getValue(item,["Longitude","longitude","lng","long"],NaN)),
    icon:String(getValue(item,["Icon","icon","emoji"],"")),
    color:String(getValue(item,["Color","color"],"#20b98a")),
    notes:String(getValue(item,["Notes","notes","description"],""))
  };
}

function normalizeConnection(raw){
  return {
    ...raw,
    id:String(getValue(raw,["id","ID"],"")),
    from:String(getValue(raw,["from","From","fromId","From IP"],"")),
    to:String(getValue(raw,["to","To","toId","To IP"],"")),
    type:String(getValue(raw,["type","Type"],"fiber")),
    category:String(getValue(raw,["category","Category","wireCategory"],"")),
    name:String(getValue(raw,["name","Name"],"")),
    direction:String(getValue(raw,["direction","Direction"],"AUTO")).toUpperCase()
  };
}

function normalizeCustomTypes(items){
  if(!Array.isArray(items)) return [];

  return items.map(item=>{
    if(typeof item === "string"){
      return {name:item,icon:"📍",color:"#20b98a"};
    }

    return {
      name:String(getValue(item,["name","Name","type"],"Other")),
      icon:String(getValue(item,["icon","Icon","emoji"],"📍")),
      color:String(getValue(item,["color","Color"],"#20b98a"))
    };
  });
}

function normalizeCableCategories(items){
  if(!Array.isArray(items)) return [];

  return items.map(item=>{
    if(typeof item === "string"){
      return {
        name:item,
        color:"#20b98a",
        weight:3,
        style:"solid",
        direction:"AUTO"
      };
    }

    return {
      name:String(getValue(item,["name","Name","category"],"Fiber")),
      color:String(getValue(item,["color","Color"],"#20b98a")),
      weight:Number(getValue(item,["weight","thickness","Weight"],3)),
      style:String(getValue(item,["style","lineStyle","Style"],"solid")),
      direction:String(getValue(item,["direction","Direction"],"AUTO")).toUpperCase()
    };
  });
}


/* ---------------- RENDER EVERYTHING ---------------- */

function renderEverything(){
  if(!map) initializeMap();

  locations = locations.map(normalizeLocation);
  connections = connections.map(normalizeConnection);

  renderStatistics();
  renderMarkers();
  renderConnections();
  buildSearchIndex();

  const center = getDefaultCenter();

  if(!map._userMoved){
    map.setView(center,getDefaultZoom());
  }

  setTimeout(()=>map.invalidateSize(),200);
}


/* ---------------- STATISTICS ---------------- */

function normalizeType(type){
  return String(type || "Other").trim().toLowerCase();
}

function countType(type){
  return locations.filter(
    item=>normalizeType(item.type) === normalizeType(type)
  ).length;
}

function renderStatistics(){
  document.getElementById("totalCustomer").textContent =
    countType("Customer");

  document.getElementById("totalPull").textContent =
    countType("Pull");

  document.getElementById("totalSwitch").textContent =
    countType("Switch");

  const container = document.getElementById("customStats");
  container.innerHTML = "";

  const excluded = ["customer","pull","switch"];

  const allTypes = new Map();

  locations.forEach(item=>{
    const key = normalizeType(item.type);

    if(!excluded.includes(key)){
      allTypes.set(key,{
        name:item.type,
        count:(allTypes.get(key)?.count || 0) + 1
      });
    }
  });

  customTypes.forEach(item=>{
    const key = normalizeType(item.name);

    if(!excluded.includes(key) && !allTypes.has(key)){
      allTypes.set(key,{name:item.name,count:0});
    }
  });

  allTypes.forEach(item=>{
    const typeConfig = getTypeConfig(item.name);

    const card = document.createElement("div");
    card.className = "stat-card";

    card.innerHTML = `
      <div class="stat-icon">${escapeHTML(typeConfig.icon)}</div>
      <div>
        <div class="stat-number">${item.count}</div>
        <div class="stat-label">${escapeHTML(item.name)}</div>
      </div>
    `;

    container.appendChild(card);
  });
}


/* ---------------- TYPE CONFIG ---------------- */

function getTypeConfig(type){
  const key = normalizeType(type);

  const builtIn = {
    customer:{icon:"👤",color:"#20b98a"},
    pull:{icon:"📍",color:"#e7a83e"},
    switch:{icon:"🔀",color:"#3997ff"},
    pole:{icon:"🗼",color:"#e7a83e"},
    onu:{icon:"📡",color:"#9b79ff"},
    router:{icon:"📶",color:"#3997ff"},
    box:{icon:"📦",color:"#20b98a"}
  };

  if(builtIn[key]) return builtIn[key];

  const custom = customTypes.find(
    item=>normalizeType(item.name) === key
  );

  if(custom){
    return {
      icon:custom.icon || "📍",
      color:custom.color || "#20b98a"
    };
  }

  const location = locations.find(
    item=>normalizeType(item.type) === key
  );

  return {
    icon:location?.icon || "📍",
    color:location?.color || "#20b98a"
  };
}


/* ---------------- MARKERS ---------------- */

function renderMarkers(){
  markerLayer.clearLayers();
  markerByLocation.clear();

  const hidden = Array.isArray(settings.hiddenTypes)
    ? settings.hiddenTypes.map(normalizeType)
    : [];

  const showLabels = settings.showMarkerLabels !== false;

  locations.forEach(location=>{
    if(!Number.isFinite(location.lat) || !Number.isFinite(location.lng)){
      return;
    }

    if(Math.abs(location.lat)>90 || Math.abs(location.lng)>180){
      return;
    }

    if(hidden.includes(normalizeType(location.type))) return;

    const config = getTypeConfig(location.type);
    const icon = location.icon || config.icon;
    const size = Math.max(18,Math.min(38,Number(settings.markerSize || 25)));

    const html = `
      <div class="marker-content" style="font-size:${size}px">
        ${escapeHTML(icon)}
        ${showLabels ? `<span class="marker-label">${escapeHTML(location.name)}</span>` : ""}
      </div>
    `;

    const markerIcon = L.divIcon({
      className:"location-marker",
      html,
      iconSize:[size+8,size+12],
      iconAnchor:[(size+8)/2,size+10],
      popupAnchor:[0,-size]
    });

    const marker = L.marker([location.lat,location.lng],{
      icon:markerIcon,
      title:location.name,
      riseOnHover:true
    });

    marker.bindPopup(buildPopup(location));

    marker.on("click",()=>{
      selectedMarker = marker;
    });

    marker.addTo(markerLayer);

    markerByLocation.set(location.id,marker);
  });
}


/* ---------------- LOCATION POPUP ---------------- */

function buildPopup(location){
  const fields = [
    ["Name",location.name],
    ["Type",location.type],
    ["IP",location.ip],
    ["Location Number",location.locationNumber],
    ["Phone",getValue(location,["Phone","phone","Mobile","mobile"],"")],
    ["Address",getValue(location,["Address","address"],"")],
    ["Area",getValue(location,["Area","area"],"")],
    ["Latitude",location.lat],
    ["Longitude",location.lng]
  ];

  let rows = "";

  fields.forEach(([label,value])=>{
    if(value !== "" && value !== null && value !== undefined){
      rows += `
        <div class="popup-row">
          <span>${escapeHTML(label)}</span>
          <span>${escapeHTML(String(value))}</span>
        </div>
      `;
    }
  });

  const extraFields = [
    "Reason","ONU","Fiber","Gmail","Bill","Billing Date",
    "Collect","Renew","Notes"
  ];

  extraFields.forEach(key=>{
    const value = getValue(location,[key,key.toLowerCase()],"");

    if(value !== ""){
      rows += `
        <div class="popup-row">
          <span>${escapeHTML(key)}</span>
          <span>${escapeHTML(String(value))}</span>
        </div>
      `;
    }
  });

  return `
    <div class="popup-title">${escapeHTML(location.name)}</div>
    <div class="popup-type">${escapeHTML(location.type)}</div>
    ${rows}
    ${location.notes ? `<div class="popup-more">${escapeHTML(location.notes)}</div>` : ""}
  `;
}


/* ---------------- CONNECTIONS ---------------- */

function findLocationByEndpoint(value){
  const target = String(value || "").trim().toLowerCase();

  if(!target) return null;

  return locations.find(location=>{
    const candidates = [
      location.id,
      location.ip,
      location.locationNumber,
      location.name
    ];

    return candidates.some(
      item=>String(item || "").trim().toLowerCase() === target
    );
  }) || null;
}

function getCableConfig(connection){
  const categoryName = connection.category || connection.type || "Fiber";

  const config = cableCategories.find(
    item=>normalizeType(item.name) === normalizeType(categoryName)
  );

  if(config) return config;

  const type = normalizeType(connection.type);

  if(type.includes("drop")){
    return {
      name:categoryName,
      color:settings.dropColor || "#f5a623",
      weight:Number(settings.dropWeight || 3),
      style:settings.dropStyle || "solid",
      direction:"AUTO"
    };
  }

  if(type.includes("fiber")){
    return {
      name:categoryName,
      color:settings.fiberColor || settings.wireColor || "#20b98a",
      weight:Number(settings.fiberWeight || settings.wireWeight || 3),
      style:settings.fiberStyle || settings.wireStyle || "dashed",
      direction:"AUTO"
    };
  }

  return {
    name:categoryName,
    color:settings.wireColor || "#20b98a",
    weight:Number(settings.wireWeight || 3),
    style:settings.wireStyle || "solid",
    direction:"AUTO"
  };
}

function renderConnections(){
  wireLayer.clearLayers();

  if(settings.showWires === false) return;

  connections.forEach(connection=>{
    const from = findLocationByEndpoint(connection.from);
    const to = findLocationByEndpoint(connection.to);

    if(!from || !to) return;

    if(!Number.isFinite(from.lat) || !Number.isFinite(from.lng)) return;
    if(!Number.isFinite(to.lat) || !Number.isFinite(to.lng)) return;

    const config = getCableConfig(connection);

    const categoryDirection = String(
      config.direction || "AUTO"
    ).toUpperCase();

    const connectionDirection = String(
      connection.direction || "AUTO"
    ).toUpperCase();

    const direction =
      connectionDirection !== "AUTO"
      ? connectionDirection
      : categoryDirection;

    const style = String(config.style || "solid").toLowerCase();

    const animated =
      direction === "ON" ||
      (
        direction === "AUTO" &&
        (
          style.includes("dash") ||
          style.includes("dot") ||
          normalizeType(config.name).includes("fiber")
        )
      );

    let dashArray = null;

    if(style.includes("dot")){
      dashArray = "2 9";
    }else if(style.includes("dash")){
      dashArray = "9 8";
    }

    const line = L.polyline(
      [
        [from.lat,from.lng],
        [to.lat,to.lng]
      ],
      {
        color:config.color || "#20b98a",
        weight:Number(config.weight || 3),
        opacity:Number(
          settings.wireOpacity !== undefined
          ? settings.wireOpacity
          : 0.9
        ),
        dashArray:dashArray,
        className:animated ? "connection-line flow-line" : "connection-line"
      }
    );

    line.bindPopup(`
      <div class="popup-title">Network Connection</div>
      <div class="popup-row">
        <span>From</span>
        <span>${escapeHTML(from.name)}</span>
      </div>
      <div class="popup-row">
        <span>To</span>
        <span>${escapeHTML(to.name)}</span>
      </div>
      <div class="popup-row">
        <span>Category</span>
        <span>${escapeHTML(config.name || connection.category || connection.type)}</span>
      </div>
      <div class="popup-row">
        <span>Direction</span>
        <span>${escapeHTML(direction)}</span>
      </div>
    `);

    line.addTo(wireLayer);

    // Arrowheads show the stored From -> To connection.
    if(typeof line.arrowheads === "function"){
      line.arrowheads({
        frequency:"50px",
        size:"10px",
        fill:true,
        color:config.color || "#20b98a"
      });
    }
  });
}


/* ---------------- SEARCH ---------------- */

function buildSearchIndex(){
  searchIndex = locations.filter(item=>
    Number.isFinite(item.lat) && Number.isFinite(item.lng)
  );
}

function searchLocations(query){
  const box = document.getElementById("searchResults");
  const value = String(query || "").trim().toLowerCase();

  if(!value){
    box.style.display = "none";
    box.innerHTML = "";
    return;
  }

  const results = searchIndex.filter(item=>{
    return [
      item.name,
      item.ip,
      item.locationNumber,
      item.type,
      getValue(item,["Phone","phone"],""),
      getValue(item,["Address","address"],"")
    ].some(v=>String(v || "").toLowerCase().includes(value));
  }).slice(0,15);

  box.innerHTML = "";

  if(!results.length){
    box.innerHTML = `<div class="search-result">No location found</div>`;
  }else{
    results.forEach(item=>{
      const row = document.createElement("div");
      row.className = "search-result";

      row.innerHTML = `
        <strong>${escapeHTML(item.name)}</strong>
        <small>${escapeHTML(item.type)} · ${escapeHTML(item.ip || item.locationNumber || "No IP")}</small>
      `;

      row.onclick = ()=>{
        const marker = markerByLocation.get(item.id);

        if(marker){
          map.setView([item.lat,item.lng],18);
          marker.openPopup();
        }

        box.style.display = "none";
        document.getElementById("mapSearch").value = item.name;
      };

      box.appendChild(row);
    });
  }

  box.style.display = "block";
}


/* ---------------- DEFAULT MAP CENTER ---------------- */

function getDefaultCenter(){
  const home = settings.homePoint || {};

  const lat = Number(
    home.lat !== undefined ? home.lat : settings.centerLat
  );

  const lng = Number(
    home.lng !== undefined ? home.lng : settings.centerLng
  );

  if(
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    Math.abs(lat)<=90 &&
    Math.abs(lng)<=180
  ){
    return [lat,lng];
  }

  return DEFAULT_CENTER;
}

function getDefaultZoom(){
  const zoom = Number(settings.zoomLevel || DEFAULT_ZOOM);

  return Math.max(3,Math.min(20,zoom));
}


/* ---------------- SHOW ALL LOCATIONS ---------------- */

function showAllLocations(){
  const points = locations.filter(item=>
    Number.isFinite(item.lat) && Number.isFinite(item.lng)
  );

  if(!points.length){
    map.setView(getDefaultCenter(),getDefaultZoom());
    showToast("No locations available");
    return;
  }

  const bounds = L.latLngBounds(
    points.map(item=>[item.lat,item.lng])
  );

  map.fitBounds(bounds,{
    padding:[45,45],
    maxZoom:17
  });
}


/* ---------------- GPS / MY LOCATION ---------------- */

function toggleMyLocation(){
  if(gpsWatchId !== null){
    stopGPS();
    return;
  }

  if(!navigator.geolocation){
    showToast("Your browser does not support GPS location");
    return;
  }

  if(!window.isSecureContext){
    showToast("GPS requires HTTPS. Open the secure web app URL.");
    return;
  }

  showToast("Requesting location permission...");

  gpsWatchId = navigator.geolocation.watchPosition(
    position=>{
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      const point = [lat,lng];

      if(!gpsMarker){
        gpsMarker = L.circleMarker(point,{
          radius:8,
          color:"#ffffff",
          weight:3,
          fillColor:"#168cff",
          fillOpacity:1
        }).addTo(map);

        gpsMarker.bindPopup("Your Current Location");

        gpsAccuracy = L.circle(point,{
          radius:accuracy,
          color:"#168cff",
          weight:1,
          fillColor:"#168cff",
          fillOpacity:.10
        }).addTo(map);

        map.setView(point,17);
      }else{
        gpsMarker.setLatLng(point);
        gpsAccuracy.setLatLng(point);
        gpsAccuracy.setRadius(accuracy);
      }

      document.getElementById("gpsTopButton").classList.add("active");
    },
    error=>{
      stopGPS();

      if(error.code === 1){
        showToast("Location permission denied. Allow GPS in browser settings.");
      }else if(error.code === 2){
        showToast("Your current location is unavailable.");
      }else{
        showToast("GPS request timed out. Try again.");
      }
    },
    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:15000
    }
  );
}

function stopGPS(){
  if(gpsWatchId !== null){
    navigator.geolocation.clearWatch(gpsWatchId);
  }

  gpsWatchId = null;

  if(gpsMarker){
    map.removeLayer(gpsMarker);
    gpsMarker = null;
  }

  if(gpsAccuracy){
    map.removeLayer(gpsAccuracy);
    gpsAccuracy = null;
  }

  document.getElementById("gpsTopButton").classList.remove("active");
}


/* ---------------- STATUS / UI HELPERS ---------------- */

function setApiStatus(status,text){
  const dot = document.getElementById("apiStatus");
  const label = document.getElementById("apiStatusText");

  dot.className = "status-dot";

  if(status === "online") dot.classList.add("online");
  if(status === "error") dot.classList.add("error");

  label.textContent = text;
}

function hideLoading(){
  document.getElementById("loadingScreen").style.display = "none";
}

let toastTimer;

function showToast(message){
  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(toastTimer);

  toastTimer = setTimeout(()=>{
    toast.style.display = "none";
  },3000);
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}


/* ---------------- MAP EVENTS ---------------- */

document.addEventListener("DOMContentLoaded",()=>{
  initializeMap();
  loadMapData();

  map.on("movestart",()=>{
    map._userMoved = true;
  });

  document.addEventListener("click",event=>{
    const search = document.querySelector(".search-box");

    if(search && !search.contains(event.target)){
      document.getElementById("searchResults").style.display = "none";
    }
  });

  window.addEventListener("resize",()=>{
    setTimeout(()=>map.invalidateSize(),150);
  });
});

// If this page is loaded inside a hidden page container,
// call this when the page becomes visible.
window.addEventListener("pageshow",()=>{
  setTimeout(()=>{
    if(map) map.invalidateSize();
  },300);
});

</script>
